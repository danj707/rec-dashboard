<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/public/favicon.ico" type="image/x-icon">
<title>rec.us Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-page: #0a0a0a; --bg-card: #141414; --bg-card-hover: #1a1a1a;
  --bg-surface: #1e1e1e; --bg-modal: #111111;
  --border: #262626; --border-subtle: #1e1e1e;
  --text-primary: #f0f0f0; --text-secondary: #888888; --text-muted: #555555;
  --amber: #f59e0b; --amber-glow: rgba(245,158,11,0.08);
  --blue: #3b82f6; --green: #22c55e; --red: #ef4444; --purple: #8b5cf6;
  --pink: #ec4899; --cyan: #06b6d4;
  --chart-grid: #262626; --chart-text: #888;
  /* The live cards sit in the same grid as everything else and were washed out
     against it (Dan: "they look a bit washed out and don't stand out"). A warm
     tint separates them from the date-filtered cards without a second border
     style — and it is a TOKEN, so the dark and light versions are one decision
     rather than two literals scattered through the rules below. */
  --live-bg: #191510; --live-border: #33291a;
  --font-display: 'DM Sans', sans-serif; --font-body: 'Inter', sans-serif;
}
[data-theme="light"] {
  --bg-page: #f3f4f6; --bg-card: #ffffff; --bg-card-hover: #fafafa;
  --bg-surface: #ffffff; --bg-modal: #ffffff;
  --border: #d4d4d4; --border-subtle: #e8e8e8;
  --text-primary: #111111; --text-secondary: #555555; --text-muted: #999999;
  --amber: #d97706; --amber-glow: rgba(217,119,6,0.08);
  --blue: #2563eb; --green: #16a34a; --red: #dc2626; --purple: #7c3aed;
  --pink: #db2777; --cyan: #0891b2;
  --chart-grid: #e5e5e5; --chart-text: #666;
  --live-bg: #fdf6e8; --live-border: #e7d9b8;
}
[data-theme="light"] .btn { background: #fff; border-color: #d4d4d4; color: #333; }
[data-theme="light"] .btn:hover { background: #f5f5f5; border-color: #bbb; }
[data-theme="light"] .btn-amber { background: #d97706; color: #fff; border-color: #d97706; }
[data-theme="light"] .btn-amber:hover { background: #b45309; }
[data-theme="light"] .btn-quick { background: #fff; border-color: #d4d4d4; color: #666; }
[data-theme="light"] .btn-quick:hover, [data-theme="light"] .btn-quick.active { background: #fffbeb; border-color: #d97706; color: #d97706; }
[data-theme="light"] .date-input { background: #fff; border-color: #d4d4d4; color: #333; }
[data-theme="light"] .dash-header { background: #fff; border-color: #e5e5e5; }
[data-theme="light"] .settings-bar { border-color: #e5e5e5; }
[data-theme="light"] .modal-panel { border-color: #e5e5e5; }
[data-theme="light"] .edit-section-header { background: #f9f9f9; }
[data-theme="light"] .edit-section-header:hover { background: #f0f0f0; }
body { font-family: var(--font-body); background: var(--bg-page); color: var(--text-primary); min-height: 100vh; }

/* Header */
.dash-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px;
  border-bottom: 1px solid var(--border); background: var(--bg-card); position: sticky; top: 0; z-index: 50; }
.dash-header-left { display: flex; align-items: center; gap: 14px; }
.dash-logo { height: 36px; width: auto; max-width: 180px; border-radius: 6px; object-fit: contain; }
.dash-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.dash-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
.dash-header-center { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dash-header-right { display: flex; align-items: center; gap: 8px; }

/* ── The weather card ──────────────────────────────────────────────────────
   A 206x44 card in the toolbar whose own background is the org's current sky.
   The one rule that is not cosmetic: EVERY DAY SKY SITS IN THE LIGHT RANGE AND
   EVERY NIGHT AND WET ONE IN THE DARK RANGE, so a single ink colour clears
   4.5:1 across the whole card. The reporting project's full-page version could
   float its text on cards ABOVE the sky; a 44px card has nowhere to hide, so
   the palette is the contrast fix and the gradients may not be prettied up
   without re-checking them.

   NIGHT IS A MODIFIER, NOT A SKY (`wxc-night` picks the night ramp for
   whichever sky is current) — so rain at 9pm still rains. And night is the
   ORG'S clock, never the viewer's: it does not touch `data-theme`, which is
   whoever is looking at it choosing dark mode for themselves. */
.wxc { position: relative; overflow: hidden; border-radius: 10px; display: flex; align-items: center;
  gap: 9px; padding: 0 12px; width: 206px; height: 44px; flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 1px 3px rgba(0,0,0,.18); }
.wxc-ic { position: relative; z-index: 2; display: flex; opacity: .95; }
.wxc-txt { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.wxc-l1 { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.wxc-l1 b { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1; letter-spacing: -.3px; }
.wxc-lab { font-size: 11px; font-weight: 600; line-height: 1; }
.wxc-l2 { font-size: 9.5px; font-weight: 500; line-height: 1; letter-spacing: .1px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.wxc-fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

/* DAY — all light, dark ink. Darkest stop is #a3abb2 against #1a1f24: 6.9:1. */
.wxc-clear    { background: linear-gradient(100deg,#8ec8ea 0%,#bfdff2 55%,#e6f2fa 100%); color: #0d2438; }
.wxc-cloudy   { background: linear-gradient(100deg,#a9c2d6 0%,#c6d5e0 55%,#e4e9ed 100%); color: #16232e; }
.wxc-overcast { background: linear-gradient(100deg,#a3abb2 0%,#bcc2c7 55%,#d8dadc 100%); color: #1a1f24; }
.wxc-fog      { background: linear-gradient(100deg,#b8bcbf 0%,#d0d1d1 55%,#eceae7 100%); color: #1e2225; }
.wxc-snow     { background: linear-gradient(100deg,#a8b4c0 0%,#c5cdd5 55%,#e6e9ec 100%); color: #161b21; }
/* WET DAY — dark, white ink. Lightest stop is #616e7a against #fff: 5.3:1. */
.wxc-drizzle  { background: linear-gradient(100deg,#3c4854 0%,#4b5865 55%,#5a6672 100%); color: #ffffff; }
.wxc-rain     { background: linear-gradient(100deg,#2f3a45 0%,#3d4955 55%,#4b5764 100%); color: #ffffff; }
.wxc-storm    { background: linear-gradient(100deg,#20272f 0%,#2c343d 55%,#3a434d 100%); color: #ffffff; }
.wxc-clear .wxc-l2, .wxc-cloudy .wxc-l2 { color: #2b4a62; }
.wxc-overcast .wxc-l2, .wxc-fog .wxc-l2, .wxc-snow .wxc-l2 { color: #32383e; }
.wxc-drizzle .wxc-l2, .wxc-rain .wxc-l2, .wxc-storm .wxc-l2 { color: #dde6ee; }

/* NIGHT — one ramp per sky, all dark, all white ink. Declared AFTER the day
   rules and at the same specificity, so source order is what makes them win. */
.wxc-night.wxc-clear    { background: linear-gradient(100deg,#0b1224 0%,#141f38 55%,#1e2c49 100%); }
.wxc-night.wxc-cloudy   { background: linear-gradient(100deg,#131c2c 0%,#1e2a3d 55%,#2a3850 100%); }
.wxc-night.wxc-overcast { background: linear-gradient(100deg,#1a1f26 0%,#252c35 55%,#313944 100%); }
.wxc-night.wxc-fog      { background: linear-gradient(100deg,#21262b 0%,#2e343a 55%,#3b4149 100%); }
.wxc-night.wxc-drizzle  { background: linear-gradient(100deg,#171e26 0%,#222b35 55%,#2d3844 100%); }
.wxc-night.wxc-rain     { background: linear-gradient(100deg,#131a22 0%,#1d2630 55%,#27323e 100%); }
.wxc-night.wxc-snow     { background: linear-gradient(100deg,#1e2531 0%,#2b3442 55%,#394353 100%); }
.wxc-night.wxc-storm    { background: linear-gradient(100deg,#0e1319 0%,#171d25 55%,#212932 100%); }
.wxc-night { color: #eef2f8; }
.wxc-night .wxc-l2 { color: #a8b5c8; }

/* The sky's own weather, over the gradient. */
.wxc-fx-sun { background: radial-gradient(38px 38px at 88% -18%, rgba(255,246,214,.95), rgba(255,222,150,.35) 52%, transparent 74%); }
.wxc-fx-stars { background:
  radial-gradient(1.1px 1.1px at 14% 26%, rgba(255,255,255,.9), transparent 60%),
  radial-gradient(1px 1px at 33% 62%, rgba(255,255,255,.6), transparent 60%),
  radial-gradient(1.2px 1.2px at 58% 22%, rgba(255,255,255,.8), transparent 60%),
  radial-gradient(1px 1px at 74% 70%, rgba(255,255,255,.55), transparent 60%),
  radial-gradient(1.1px 1.1px at 91% 34%, rgba(255,255,255,.75), transparent 60%),
  radial-gradient(26px 26px at 88% -12%, rgba(232,238,255,.3), transparent 72%); }
.wxc-fx-fog { background: repeating-linear-gradient(0deg, rgba(255,255,255,.22) 0 2px, transparent 2px 9px);
  animation: wxc-fogdrift 9s linear infinite; }
@keyframes wxc-fogdrift { from { transform: translateX(0); } to { transform: translateX(-18px); } }
.wxc-fx-rain, .wxc-fx-drizzle { background: repeating-linear-gradient(74deg, rgba(214,229,244,.55) 0 1px, transparent 1px 7px);
  animation: wxc-raindrop .55s linear infinite; }
.wxc-fx-rain { opacity: .34; }
.wxc-fx-drizzle { opacity: .16; animation-duration: .95s; }
@keyframes wxc-raindrop { from { transform: translate3d(0,-9px,0); } to { transform: translate3d(-3px,9px,0); } }
.wxc-fx-snow { background:
  radial-gradient(1.6px 1.6px at 18% 20%, rgba(255,255,255,.95), transparent 60%),
  radial-gradient(1.4px 1.4px at 46% 66%, rgba(255,255,255,.85), transparent 60%),
  radial-gradient(1.7px 1.7px at 72% 30%, rgba(255,255,255,.9), transparent 60%),
  radial-gradient(1.3px 1.3px at 90% 74%, rgba(255,255,255,.8), transparent 60%);
  background-size: 64px 44px; animation: wxc-snowdrift 7s linear infinite; }
@keyframes wxc-snowdrift { from { background-position: 0 -14px; } to { background-position: -22px 44px; } }
/* Motion in a toolbar is a distraction if you did not ask for it. */
@media (prefers-reduced-motion: reduce) { .wxc-fx { animation: none !important; } }
/* The PDF is a document about a date range; a live sky is not part of it. */
.print-header .wxc { display: none !important; }

/* ── The whole page takes the sky (Dan, 2026-09-19: "doesn't the whole org
   page get the overcast treatment?") ───────────────────────────────────────
   A FIXED layer behind everything, the same mechanism the reports project's
   org landing uses. Inert until the server injects a reading: no reading, no
   `has-wx`, and the page renders exactly as it did before.

   THE ONE THING THAT COULD NOT BE LIFTED IS THE GROUND. Over there the page
   has no theme switch, so every sky settles into one hardcoded near-white.
   Here the viewer picks, so each ramp fades into `var(--bg-page)` instead —
   in light theme that is the #f3f4f6 the reports version effectively uses, and
   in dark theme the sky darkens into the near-black ground rather than
   dropping a sheet of daylight behind a dark dashboard. Same sky, both
   themes, and neither one fights its own chrome. */
.wx-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
body.has-wx > *:not(.wx-layer) { position: relative; z-index: 1; }
.wx-sky, .wx-glow { position: absolute; inset: 0; }
.wx-fx, .wx-fx2 { position: absolute; inset: -14% -10%; }
.wx-orb { position: absolute; border-radius: 50%; display: none; }

body.wx-clear    .wx-sky { background: linear-gradient(180deg,#1d68a4 0%,#4593c6 8%,#8ec2df 17%,var(--wx-ground) 30%,var(--wx-ground) 100%); }
body.wx-clear    .wx-glow { background: radial-gradient(520px 320px at 80% 4%,rgba(255,239,200,.8),rgba(255,207,130,.18) 48%,transparent 72%); }
body.wx-cloudy   .wx-sky { background: linear-gradient(180deg,#4d7ea6 0%,#7ba3c2 8%,#a9c0d0 17%,var(--wx-ground) 30%,var(--wx-ground) 100%); }
body.wx-cloudy   .wx-glow { background: radial-gradient(560px 300px at 70% 2%,rgba(255,255,255,.34),transparent 70%); }
body.wx-overcast .wx-sky { background: linear-gradient(180deg,#5a646f 0%,#79828c 9%,#9aa1a8 18%,var(--wx-ground) 30%,var(--wx-ground) 100%); }
body.wx-overcast .wx-glow { background: radial-gradient(620px 320px at 58% 0%,rgba(255,255,255,.3),transparent 70%); }
body.wx-fog      .wx-sky { background: linear-gradient(180deg,#8e939a 0%,#a7abb0 9%,#c0c2c4 19%,var(--wx-ground) 30%,var(--wx-ground) 100%); }
body.wx-fog      .wx-glow { background: radial-gradient(760px 420px at 50% 22%,rgba(255,255,255,.5),transparent 76%); }
body.wx-drizzle .wx-sky,
body.wx-rain     .wx-sky { background: linear-gradient(180deg,#333d48 0%,#485663 9%,#65727e 18%,var(--wx-ground) 30%,var(--wx-ground) 100%); }
body.wx-drizzle  .wx-glow,
body.wx-rain     .wx-glow { background: radial-gradient(620px 300px at 26% 0%,rgba(190,206,222,.22),transparent 66%); }
body.wx-storm    .wx-sky { background: linear-gradient(180deg,#1f262f 0%,#333c47 9%,#4d5761 18%,var(--wx-ground) 30%,var(--wx-ground) 100%); }
body.wx-storm    .wx-glow { background: radial-gradient(560px 300px at 34% 0%,rgba(226,214,180,.2),transparent 64%); }
body.wx-snow     .wx-sky { background: linear-gradient(180deg,#78808e 0%,#919aa6 9%,#aeb4be 18%,var(--wx-ground) 30%,var(--wx-ground) 100%); }
body.wx-snow     .wx-glow { background: radial-gradient(620px 320px at 52% 0%,rgba(255,255,255,.34),transparent 72%); }

/* THE GROUND IS WHERE THE WEATHER ACTUALLY READS ON THIS PAGE. The reports
   project's org landing is a sparse list of cards, so its sky shows. This one
   is a dense grid — 48 widgets on Watertown — and the first build of this put
   a beautiful sky entirely behind opaque cards: you could not tell overcast
   from clear. So the strong sky keeps the top of the viewport and every ramp
   settles by 30% into a GROUND TINTED WITH ITS OWN COLOUR, which then shows in
   every gutter, every gap between cards and the whole page below the fold.
   Mixed into `var(--bg-page)` rather than replacing it, so light theme gets a
   tinted near-white and dark theme a tinted near-black. */
body.wx-clear    { --wx-ground: color-mix(in srgb, var(--bg-page) 74%, #8ec2df); }
body.wx-cloudy   { --wx-ground: color-mix(in srgb, var(--bg-page) 74%, #a9c0d0); }
body.wx-overcast { --wx-ground: color-mix(in srgb, var(--bg-page) 74%, #9aa1a8); }
body.wx-fog      { --wx-ground: color-mix(in srgb, var(--bg-page) 74%, #c0c2c4); }
body.wx-drizzle  { --wx-ground: color-mix(in srgb, var(--bg-page) 74%, #65727e); }
body.wx-rain     { --wx-ground: color-mix(in srgb, var(--bg-page) 74%, #65727e); }
body.wx-storm    { --wx-ground: color-mix(in srgb, var(--bg-page) 74%, #4d5761); }
body.wx-snow     { --wx-ground: color-mix(in srgb, var(--bg-page) 74%, #aeb4be); }
/* Night is its own ground too, and it wins by source order. */
body.wx-night { --wx-ground: color-mix(in srgb, var(--bg-page) 74%, #1e2f4c); }

body.wx-clear .wx-orb, body.wx-cloudy .wx-orb { display: block; right: 15%; top: 6%; width: 44px; height: 44px;
  background: #fff6dc; box-shadow: 0 0 50px 18px rgba(255,226,160,.5); }

/* ── EVERY PARTICLE CARRIES A LIGHT EDGE AND A DARK ONE ────────────────────
   Dan, on the merged page: "if it starts snowing there or raining, I better
   see snow and rain."

   THE FIRST VERSION WAS LIFTED STRAIGHT OFF THE CARD AND WAS NEARLY INVISIBLE
   HERE, which is the ground problem one layer up, again. The card's own
   background is a dark saturated ramp, so a white streak or a white flake
   reads beautifully on it. The PAGE's ground is a light tint of the theme
   colour — so white-on-near-white vanished, and measured against its own
   ground the snow was the worst of them.

   A particle has to work on the dark sky band at the top of the viewport AND
   on the light ground below it, in either theme. So each one is drawn TWICE:
   a light edge and a slate one beside it. Whichever ground it lands on, one of
   the two is visible — which is also what rain actually looks like. */
body.wx-drizzle .wx-fx, body.wx-rain .wx-fx, body.wx-storm .wx-fx {
  animation: wx-rain .52s linear infinite;
  background-image: repeating-linear-gradient(101deg,
    rgba(212,232,252,0) 0 5px,
    rgba(226,240,255,.78) 5px, rgba(226,240,255,.78) 6px,
    rgba(51,65,85,.55) 6px, rgba(51,65,85,.55) 7px,
    rgba(212,232,252,0) 7px 12px); }
body.wx-drizzle .wx-fx2, body.wx-rain .wx-fx2, body.wx-storm .wx-fx2 {
  animation: wx-rain .86s linear infinite;
  background-image: repeating-linear-gradient(99deg,
    rgba(226,240,255,0) 0 9px,
    rgba(240,248,255,.6) 9px, rgba(240,248,255,.6) 10px,
    rgba(51,65,85,.42) 10px, rgba(51,65,85,.42) 11px,
    rgba(226,240,255,0) 11px 20px); }
body.wx-rain .wx-fx, body.wx-storm .wx-fx { opacity: .58; }
body.wx-rain .wx-fx2, body.wx-storm .wx-fx2 { opacity: .36; }
/* Drizzle stays the faintest of the three — it is drizzle — but it is no
   longer below the threshold of being seen at all. */
body.wx-drizzle .wx-fx { opacity: .38; }
body.wx-drizzle .wx-fx2 { opacity: .24; }
@keyframes wx-rain { from { transform: translate3d(0,-10%,0); } to { transform: translate3d(-30px,10%,0); } }

/* A FLAKE IS WHITE AND MUST STAY WHITE, so its second edge is a shadow rather
   than a second colour: invisible against the dark sky band, and what makes it
   a flake rather than a blank pixel against the light ground. */
body.wx-snow .wx-fx, body.wx-snow .wx-fx2 {
  filter: drop-shadow(0 0 1.1px rgba(30,41,59,.7)) drop-shadow(0 1px 1px rgba(30,41,59,.4)); }
body.wx-snow .wx-fx {
  animation: wx-snow 11s linear infinite; background-size: 300px 240px;
  background-image: radial-gradient(3px 3px at 24px 28px,#fff 55%,transparent 56%),radial-gradient(2.4px 2.4px at 132px 92px,rgba(255,255,255,.95) 55%,transparent 56%),radial-gradient(3.4px 3.4px at 214px 40px,#fff 55%,transparent 56%),radial-gradient(2.6px 2.6px at 66px 170px,rgba(255,255,255,.9) 55%,transparent 56%),radial-gradient(3px 3px at 268px 210px,#fff 55%,transparent 56%); }
body.wx-snow .wx-fx2 {
  opacity: .72; animation: wx-snow 19s linear infinite; background-size: 200px 160px;
  background-image: radial-gradient(2.1px 2.1px at 32px 22px,rgba(255,255,255,.88) 55%,transparent 56%),radial-gradient(1.9px 1.9px at 118px 70px,rgba(255,255,255,.8) 55%,transparent 56%),radial-gradient(2.2px 2.2px at 172px 126px,rgba(255,255,255,.88) 55%,transparent 56%); }
@keyframes wx-snow { from { background-position: 0 -30px; } to { background-position: -80px 260px; } }

/* NIGHT OVERRIDES THE SKY AND KEEPS THE CONDITION'S OWN PARTICLES, so a wet
   night still rains. Declared after the day ramps at the same specificity —
   source order is what makes them win. */
body.wx-night .wx-sky { background: linear-gradient(180deg,#070d1e 0%,#101c36 9%,#1e2f4c 18%,var(--wx-ground) 30%,var(--wx-ground) 100%); }
body.wx-night .wx-glow { background:
  radial-gradient(1.7px 1.7px at 12% 9%,rgba(255,255,255,.9),transparent 60%),
  radial-gradient(1.4px 1.4px at 25% 5%,rgba(255,255,255,.7),transparent 60%),
  radial-gradient(1.6px 1.6px at 37% 13%,rgba(255,255,255,.8),transparent 60%),
  radial-gradient(1.3px 1.3px at 48% 6%,rgba(255,255,255,.62),transparent 60%),
  radial-gradient(1.7px 1.7px at 61% 12%,rgba(255,255,255,.85),transparent 60%),
  radial-gradient(1.4px 1.4px at 72% 4%,rgba(255,255,255,.66),transparent 60%),
  radial-gradient(1.5px 1.5px at 90% 15%,rgba(255,255,255,.75),transparent 60%),
  radial-gradient(340px 210px at 78% 7%,rgba(198,218,255,.22),transparent 72%); }
body.wx-night .wx-orb { display: block; width: 30px; height: 30px; right: 17%; top: 6%;
  background: #f3efe1; box-shadow: 0 0 36px 12px rgba(226,233,255,.26); }

/* THE TWO THINGS THAT SIT DIRECTLY ON THE GROUND rather than inside a card:
   the refresh strip and each section's own header. They live in the TOP
   fifth of a fixed layer, which is the part of every ramp that is actually
   sky — 11px muted text on `#485663` is 3.2:1 — so they get a plate in the
   theme's own page colour and keep the ink they already pass with. The
   gutters and the gaps between cards are where the sky is meant to show. */
/* The top bar sits over the most saturated part of every ramp, and opaque it
   wastes it — so both strips go translucent and let the sky through. Kept high
   enough (86/88%) that every ink ratio in them is what it is today. */
body.has-wx .dash-header { background: color-mix(in srgb, var(--bg-card) 86%, transparent);
  backdrop-filter: blur(6px); }
body.has-wx .settings-bar { background: color-mix(in srgb, var(--bg-page) 88%, transparent);
  backdrop-filter: blur(4px); }
/* AND THE FIRST SECTION HEADER GETS ONE TOO. It is the one piece of chrome
   that sits OUTSIDE a card and inside the strong part of the ramp — and where
   it lands depends on the viewport height and on whether the early-access
   banner is up, so the gradient cannot be tuned to dodge it. Without this its
   11px "not date-filtered" chip is muted grey on mid-grey sky. The later
   headers are already over the tinted ground, where the plate is within a hair
   of the page colour and invisible. */
body.has-wx .section-header { position: relative; }
body.has-wx .section-header::before { content: ""; position: absolute; inset: 2px -16px;
  background: color-mix(in srgb, var(--bg-page) 86%, transparent); backdrop-filter: blur(4px);
  border-radius: 12px; z-index: -1; }

@media (prefers-reduced-motion: reduce) { .wx-fx, .wx-fx2 { animation: none !important; } }
/* The PDF is a document about a date range; a live sky is not part of it. */
@media print { .wx-layer { display: none !important; } }

/* Buttons */
.btn { font-family: var(--font-body); font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); cursor: pointer; transition: all 0.15s; }
.btn:hover { background: #252525; border-color: #333; }
.btn-amber { background: var(--amber); color: #000; border-color: var(--amber); font-weight: 600; }
.btn-amber:hover { background: #d97706; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-quick { background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
  padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; }
.btn-quick:hover, .btn-quick.active { border-color: var(--amber); color: var(--amber); background: var(--amber-glow); }
.date-input { font-family: var(--font-body); font-size: 13px; padding: 6px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); outline: none; }
.date-input:focus { border-color: var(--amber); }

/* Compare To dropdown */
.cmp-dd { position: relative; display: inline-block; }
.cmp-dd-menu { position: absolute; top: calc(100% + 5px); left: 0; z-index: 60; min-width: 230px;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.35); }
.cmp-dd-item { display: block; width: 100%; text-align: left; background: transparent; border: none;
  color: var(--text-primary); padding: 8px 26px 8px 10px; border-radius: 6px; cursor: pointer; position: relative; }
.cmp-dd-item:hover:not(.disabled) { background: var(--amber-glow); }
.cmp-dd-item.active .cmp-dd-item-label { color: var(--amber); }
.cmp-dd-item.disabled { opacity: 0.45; cursor: not-allowed; }
.cmp-dd-item-label { display: block; font-size: 13px; font-weight: 600; }
.cmp-dd-item-sub { display: block; font-size: 10px; color: var(--text-muted); margin-top: 1px; }
.cmp-dd-check { position: absolute; right: 9px; top: 9px; color: var(--amber); font-size: 12px; }

/* Section */
.dashboard-section { padding: 0 24px; margin-bottom: 8px; }
.section-header { display: flex; align-items: center; gap: 12px; padding: 20px 0 12px 0; }
.section-icon { font-size: 22px; }
.section-label { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.section-line { flex: 1; height: 1px; background: var(--border); }
.section-badge { font-size: 10px; color: var(--text-muted); padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; }
/* The count doubles as the way into this section's widget list. It has to LOOK
   like a control at rest — a hover-only affordance is the reason the pencil on
   the Fast Track report went unnoticed for a release. */
.section-badge-btn { font-family: var(--font-body); background: var(--bg-surface); cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px; transition: color .15s, border-color .15s, background .15s; }
.section-badge-btn .sb-pencil { opacity: .75; font-size: 9px; }
.section-badge-btn:hover { color: var(--text-primary); border-color: var(--text-muted); background: var(--bg-elevated, var(--bg-surface)); }
.section-badge-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Widget Grid */

.kpi-strip { display: flex; gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.kpi-strip-item { flex: 1; background: var(--bg-surface); padding: 14px 18px; text-align: center; min-width: 0; }
.kpi-strip-item:first-child { border-radius: 10px 0 0 10px; }
.kpi-strip-item:last-child { border-radius: 0 10px 10px 0; }
.kpi-strip-value { display: block; font-size: 26px; font-weight: 700; color: var(--text-primary); font-family: var(--font-display); letter-spacing: -0.02em; }
.kpi-strip-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
.kpi-strip-note { display: block; font-size: 10px; color: var(--text-muted); margin-top: 2px; }
@media (max-width: 600px) { .kpi-strip { flex-wrap: wrap; } .kpi-strip-item { flex: 1 1 45%; } .kpi-strip-value { font-size: 20px; } }
@media print { .kpi-strip { break-inside: avoid; } }
/* ONE DEFINITION FOR THE ROW FLOOR AND THE GAP, because `.widget-tall` now has
   to be exactly two of one plus one of the other. Two copies is how a tall card
   ends up a hair short of two rows and the grid re-flows. */
:root { --widget-row-min: 300px; --widget-grid-gap: 14px; }
.widget-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--widget-grid-gap); }
/* ── Live Widgets ────────────────────────────────────────────────────────
   Everything here is themed through the same tokens as the rest of the
   dashboard, so the card reads the same in light and dark. The one literal
   colour is the live green, which has to mean "live" in both. */
/* THE TINT NEEDS THE COMPOUND SELECTOR, and this is a cascade collision, not a
   style preference: `.widget-card` sets `background: var(--bg-card)` a hundred
   lines BELOW this block, and at equal specificity the later rule wins — so a
   bare `.live-card` background is silently overridden and the cards render
   exactly as washed-out as before. `.widget-card.live-card` (0,2,0) outranks it
   whatever the order. Caught by the render check comparing the two computed
   backgrounds; no source assertion would have noticed. */
.live-card { display: flex; flex-direction: column; }
/* FOUR ON A SCREEN. Dan: "lets shrink the cards a bit, ideally we have 4 cards
   on a screen, right now the registration and programs widgets are too big."

   EVERY PIXEL HERE COMES OUT OF CHROME, NOT OUT OF CONTENT, and that is the
   whole design of this block. The obvious lever is showing fewer rows —
   LIVE_ROWS from eight, LIVE_PROG_ROWS from ten — and both of those numbers
   are Dan's own earlier asks ("I'd expect to see the top, say 10 or so
   programs"). Shrinking a card by deleting the thing it was asked to show
   trades one complaint for the next one. So the padding, the headline, the
   timeline and the row rhythm give up the height instead, and all four cards
   still show exactly what they showed before.

   Measured out of the live cards' own boxes: 12px of card padding, ~14px of
   headline, ~16px of timeline, 4px of legend and ~6px per table row. On the
   registrations card that is roughly 150px off a ~500px card, which is what
   puts a second row of two inside a 1080p viewport.

   SCOPED TO `.live-card`, deliberately. `.widget-card`'s own 20px padding is
   right for a widget somebody reads once; these are watched, so they are
   denser. Every other widget on the dashboard is untouched. */
.widget-card.live-card { padding: 10px 16px; }
/* THE LANE HAS TO HOLD ITS OWN MARKS. Three rows at `top: 4 + lane*8` plus an
   8px mark is 28px, and the 2px ring makes 30 — so 30px, and the JS step and
   this height are one measurement the spec pins against each other. It was
   26px with a step of 10, which put the third row of dots BELOW the box, on
   top of the hour labels: the stray "5a" in Dan's screenshot. */
.live-card .live-timeline { height: 30px; margin: 6px 0 13px; }
.live-card .live-timeline .lt-mark { width: 8px; height: 8px; margin-left: -4px; }
/* AND THE HOUR LABELS HAVE TO CLEAR THE LEGEND. `bottom: -14px` under a 13px
   margin overhangs by a pixel; at 8.5px type the label is ~10px tall, so -11px
   sits it inside the gap with room to spare. */
.live-card .live-timeline .lt-day em { bottom: -11px; }
.live-card .live-legend { margin-bottom: 4px; }
.live-card .live-table th { padding: 3px 8px 3px 0; }
.live-card .live-table td { padding: 3px 8px 3px 0; }
.live-card .live-count { margin: 2px 0 0; }
.live-card .live-count .live-n { font-size: 23px; }
/* MEASURED, NOT GUESSED: the Programs card is what sets the height of the top
   row — its ten rows are Dan's own ask and they are two lines each, so cutting
   the registration list beside it buys literally nothing (verified in the
   browser: LIVE_ROWS 8 -> 5 moved the grid by zero pixels). The second line is
   where its pixels are, so that is what gives them back. */
.live-card .live-sub-prog { font-size: 8.5px; line-height: 1.15; margin-top: 0; }
/* The header's own 16px gap is sized for a widget read once; on a card watched
   all day the title and the number it introduces belong closer together. */
.live-card .widget-header { margin-bottom: 8px; }
/* The programs card carries a second line in its MONEY column too ("of $X
   charged"), so it pays the same per-row cost twice. */
.live-card .live-table-progs .lm .lm-sub { line-height: 1.2; margin-top: 0; }
/* The check-ins card's face row is the one place where tightening the gap
   would cost legibility rather than buy it — the ring that marks a fresh scan
   needs room to sit outside the circle without touching its neighbour. */

.widget-card.live-card { background: var(--live-bg); border-color: var(--live-border); }
.widget-card.live-card:hover { border-color: var(--live-border); }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #16a34a;
            box-shadow: 0 0 0 3px rgba(22,163,74,.16); margin-right: 5px; vertical-align: middle; }
@media (prefers-reduced-motion: no-preference) {
  .live-dot { animation: livePulse 2.4s ease-in-out infinite; }
  @keyframes livePulse { 0%,100% { box-shadow: 0 0 0 3px rgba(22,163,74,.16); } 50% { box-shadow: 0 0 0 6px rgba(22,163,74,.05); } }
}
.live-chip { background: rgba(22,163,74,.12); color: #16a34a; padding: 1px 5px; border-radius: 3px;
             font-weight: 600; font-size: 9px; margin-right: 4px; }
.live-pause { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-muted); cursor: pointer; }
.live-controls { display: flex; align-items: center; gap: 8px; }
.live-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; font-weight: 400; }
/* REFRESH NOW. Dan: "add a manual refresh button on both these live cards in
   case I don't want to wait every minute." It is the SAME fetch the poll runs,
   so both cards move together — there is one feed, and a button that refreshed
   half the pair would be the two-cards-disagree bug this section was built to
   avoid. Disabled while a fetch is in flight, so an impatient double-click
   cannot queue two. */
.live-refresh { background: transparent; border: 1px solid var(--border); color: var(--text-muted);
                border-radius: 5px; width: 20px; height: 20px; line-height: 1; font-size: 12px;
                cursor: pointer; padding: 0; display: inline-flex; align-items: center;
                justify-content: center; transition: color .15s, border-color .15s; }
.live-refresh:hover:not(:disabled) { color: var(--green); border-color: var(--green); }
.live-refresh:disabled { opacity: .45; cursor: default; }
/* THE SOUND MENU. Styled explicitly rather than left as a native select,
   because a default control renders with the OS chrome and the OS's own light
   background — which on the dark theme is a white box in a tinted card, the
   same collision the season menu in the reporting project shipped with. */
.live-chime-pick { background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);
                   border-radius: 5px; height: 20px; font-size: 10px; font-family: inherit;
                   padding: 0 4px; cursor: pointer; max-width: 96px; }
.live-chime-pick:hover { color: var(--green); border-color: var(--green); }
@media (prefers-reduced-motion: no-preference) {
  .live-refresh:disabled { animation: liveSpin 0.9s linear infinite; }
  @keyframes liveSpin { to { transform: rotate(360deg); } }
}
/* THE BIG LINE HAD NO RULE AT ALL, which is why it read "9across 5" — two
   inline elements with nothing between them. Dan: "fix the spacing". A flex
   gap, not a literal space in the markup, so the number and its caption cannot
   drift apart again. */
.live-big { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 6px; flex-wrap: wrap; }
.live-big strong { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1;
                   color: var(--text-primary); font-variant-numeric: tabular-nums; }
.live-big span { font-size: 11px; color: var(--text-muted); }
.live-count { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 2px; }
.live-count .live-n { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1;
                      color: var(--text-primary); font-variant-numeric: tabular-nums; }
.live-count .live-u { font-size: 11px; color: var(--text-muted); }
/* THE TIMELINE. One lane across the last seven days; every mark is one
   registration at its own minute, and a paid one carries a $. Marks are
   absolutely placed, so adding one costs no layout anywhere else on the card. */
.live-timeline { position: relative; height: 42px; margin: 10px 0 22px;
                 border-bottom: 1px solid var(--border); }
.live-timeline .lt-day { position: absolute; top: 0; bottom: 0; }
.live-timeline .lt-day i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border-subtle); }
.live-timeline .lt-day em { position: absolute; bottom: -14px; left: 3px; font-style: normal;
                            font-size: 8.5px; letter-spacing: .04em; color: var(--text-muted); white-space: nowrap; }
.live-timeline .lt-day.today em { color: #16a34a; font-weight: 700; }
/* NOW is a real edge on this card, so it is drawn. Without it the last day
   reads as empty rather than as not-yet-happened. */
.live-timeline .lt-now { position: absolute; top: 0; bottom: 0; width: 1px; background: #16a34a; opacity: .5; }
/* THREE PAYMENT STATES, AS DOTS. Dan: "change the dollar signs (yeah I loved
   it too) to a green dot for paid, and an orange dot for a partial
   payment/payment plan (you had a grey dot right now)". Colour is the only
   difference, so all three keep the same size and shape — a dot that also
   changed shape would read as a different KIND of thing rather than the same
   registration at a different stage. The legend under the lane names them,
   because a three-colour code with nothing explaining it is a puzzle. */
.live-timeline .lt-mark { position: absolute; width: 9px; height: 9px; margin-left: -4px;
                          border-radius: 50%; background: var(--border); }
.live-timeline .lt-mark.paid { background: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,.18); }
.live-timeline .lt-mark.part { background: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.20); }
/* FREE IS NOT "NOT YET PAID" — it is the opposite fact, so it does not share the
   unpaid dot. Slate rather than a fourth bright colour: a comped registration is
   a normal, finished thing and must not compete for attention with the money. */
.live-timeline .lt-mark.free { background: #64748b; box-shadow: 0 0 0 2px rgba(100,116,139,.18); }
/* THE LEGEND SITS BELOW THE HOUR LABELS, not on top of them. The tick labels
   are absolutely placed at `bottom: -14px` — OUTSIDE the timeline's own box —
   so a legend pulled up under it lands in the same 14 pixels and the two read
   as one cramped row (Dan: "Some spacing issues on the chat legend"). The
   timeline reserves that space in its margin now and the legend starts after
   it. */
.live-legend { display: flex; gap: 14px; align-items: center; font-size: 9.5px;
               color: var(--text-muted); margin: 0 0 12px; }
.live-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                 margin-right: 4px; vertical-align: middle; background: var(--border); }
.live-legend .lg-paid i { background: #16a34a; }
.live-legend .lg-part i { background: #f59e0b; }
.live-legend .lg-free i { background: #64748b; }
.live-legend .lg-fail i { background: #dc2626; }

/* ── MEMBERSHIP CHECK-INS ──────────────────────────────────────────────────
   AN ACCEPTED SCAN IS THE SAME GREEN AS A PAID SIGNUP — both mean "this went
   through" and the two cards sit one above the other, so a second green would
   read as a third state. A refusal is RED rather than the registrations card's
   grey: grey there means "no money yet", which is ordinary and waits; red here
   means somebody was turned away at the desk, which is not. */
.live-timeline .lt-mark.ci-ok   { background: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,.18); }
.live-timeline .lt-mark.ci-failed { background: #dc2626; box-shadow: 0 0 0 2px rgba(220,38,38,.20); }
/* FACILITY BOOKINGS reuse the same two inks as the check-ins card — green for
   "this went through", red for "this did not" — because the two cards sit in
   one grid and a third palette for the same two meanings is how a colour stops
   meaning anything. */
.live-timeline .lt-mark.fac-booked   { background: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,.18); }
.live-timeline .lt-mark.fac-canceled { background: #dc2626; box-shadow: 0 0 0 2px rgba(220,38,38,.20); }

/* ── THE COLUMN FORM ───────────────────────────────────────────────────────
   The same lane, the same axis, the same two inks — only the marks change.
   Fifteen-minute columns, stacked bottom-up in each card's own state order.
   Absolutely positioned like the dots, so switching form costs no layout
   anywhere else on the card. */
.live-timeline-cols .lt-col { position: absolute; bottom: 0; top: 0; }
 /* A SEGMENT IS NEVER INVISIBLE: a quarter-hour with one scan in it against a
    peak of 37 is 2.7% of the height, under a pixel, and a quiet stretch that
    renders as nothing reads as no data rather than as a trickle. */
.live-timeline-cols .lt-col-seg { position: absolute; left: 8%; right: 8%; min-height: 2px;
                                  background: var(--border); border-radius: 1px 1px 0 0; }
.live-timeline-cols .lt-col-seg.paid,
.live-timeline-cols .lt-col-seg.ci-ok,
.live-timeline-cols .lt-col-seg.fac-booked   { background: #16a34a; }
.live-timeline-cols .lt-col-seg.part         { background: #f59e0b; }
.live-timeline-cols .lt-col-seg.free         { background: #64748b; }
.live-timeline-cols .lt-col-seg.none         { background: var(--border); }
.live-timeline-cols .lt-col-seg.ci-failed,
.live-timeline-cols .lt-col-seg.fac-canceled { background: #dc2626; }
/* THE PEAK, NAMED. A column chart with no number is "busier here than there";
   the figure is what makes it a count. Top-left, out of the columns' way, and
   muted because it is a scale label rather than a headline. */
.live-timeline-cols .lt-peak { position: absolute; top: -1px; left: 0; font-size: 8.5px;
                               font-weight: 700; color: var(--text-muted); line-height: 1;
                               font-variant-numeric: tabular-nums; pointer-events: none; }
/* THE ARRIVAL HIGHLIGHT SURVIVES THE CHANGE OF FORM. A dot pops itself; a
   column can only light up if it knows which marks are in it, which is why
   liveBuckets keeps their keys. Same ten-second fade as the row highlight. */
@media (prefers-reduced-motion: no-preference) {
  .live-timeline-cols .lt-col.fresh .lt-col-seg { animation: liveColIn 10s ease-out both; }
  @keyframes liveColIn {
    0%   { transform: scaleY(1.5); filter: brightness(1.5); }
    6%   { transform: scaleY(1);   filter: brightness(1.5); }
    100% { transform: scaleY(1);   filter: brightness(1); }
  }
  .live-timeline-cols .lt-col.fresh .lt-col-seg { transform-origin: 50% 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .live-timeline-cols .lt-col.fresh .lt-col-seg { filter: brightness(1.4); }
}
/* A LEGEND NOTE, not a fourth dot: the self-service share is a fact about the
   bookings beside it rather than another colour to decode, so it carries no
   swatch and sits at the end of the row. */
/* BESIDE THE LEGEND, NOT AT THE FAR EDGE. `margin-left: auto` pushed this to
   the right rim of the card — eight hundred pixels from the dots it belongs
   with, reading as an orphan rather than as a fact about them. */
.live-legend .lg-note { color: var(--text-muted); font-variant-numeric: tabular-nums;
                        padding-left: 12px; border-left: 1px solid var(--border); }

.live-ci-fail { color: #dc2626; font-weight: 600; }

/* A ROW OF FACES, WRAPPING. Not a table: the ask was to SEE who came in, and a
   name-and-time table is what the check-ins report already is. */
.live-ci-people { display: flex; flex-wrap: wrap; gap: 10px 12px; margin: 2px 0 6px;
                  --ci-tile: 46px; }
.ci-person { display: flex; flex-direction: column; align-items: center;
             width: var(--ci-tile); text-align: center; }
.ci-person a { text-decoration: none; }
/* EVERY LINE IS BOUNDED BY THE TILE, not by a number that has to be kept equal
   to it. The first version pinned `max-width: 92px` on the detail lines and
   the tile width on a DIFFERENT selector, so on a card where the tile stayed
   46px the lines were 92px wide and spilled into the neighbour — which is
   exactly what Torrance rendered. `100%` cannot disagree with the tile. */
.ci-person b { font-size: 10px; font-weight: 600; color: var(--text-primary);
               max-width: 100%; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; margin-top: 3px; }
.ci-person i { font-size: 9px; font-style: normal; color: var(--text-muted); }

/* ── THE 2x CARD ──────────────────────────────────────────────────────
   THE LIST SCROLLS INSIDE THE CARD, and `flex: 1 1 0` with `min-height: 0` is
   what makes that true rather than aspirational — exactly as `.ht-list` does
   next door, and for the same reason: `.live-grid` sizes its rows `1fr`, so a
   list that kept its intrinsic height would grow the row this card is supposed
   to fit inside and push Happening Today's own height with it. Apex scans 468
   members before three in the afternoon; without this, a busy afternoon
   silently re-lays-out the whole section.

   `align-content: flex-start` is not decoration either: a wrapping flex
   container given a flex basis of zero spreads its rows down the free space,
   so without it a half-full card renders its faces in bands with gaps between
   them rather than as a block at the top. */
.ci-tall .live-ci-people { flex: 1 1 0; min-height: 0; overflow-y: auto;
                           align-content: flex-start; }
/* THE TILE WIDENS ONLY WHERE THERE IS SOMETHING EXTRA TO PUT IN IT. A 46px
   tile fits about eight characters, which is a stub rather than a place —
   "El Segund…" and "El Segund…" are two different desks reading the same. But
   widening every tall card would halve how many faces fit per row at the eight
   orgs measured with a single desk, where the location is hoisted into the
   header and there is nothing under the name at all. So the width rides on
   `.ci-where`, which is on only when the per-face line actually renders. */
/* THE TILE WIDENS ON `.ci-tall`, NOT ON `.ci-where` — and that distinction is
   the bug Dan hit. The PRODUCT line renders on every tall card; only the PLACE
   is gated on there being two or more of them. Tying the width to the place
   meant a tall card at an org with no desks recorded kept a 46px tile under a
   full-width product name. Torrance is that org: its two scans today carry no
   desk at all, so the card was tall, the product printed, and the text ran
   straight across the face beside it. Any tall card needs the room. */
.ci-tall .ci-person { --ci-tile: 104px; }
/* THE HOVER'S OWN TWO LINES. Muted and a size below the time, so the face and
   the first name stay the thing the eye lands on — this is the detail you
   would have had to mouse over, not a second headline. Truncated with the full
   value still on the tile's `title`. */
.ci-person em { display: block; font-style: normal; font-size: 8.5px; line-height: 1.25;
                color: var(--text-secondary); margin-top: 2px; max-width: 100%;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ci-person u { display: block; text-decoration: none; font-size: 8.5px; line-height: 1.25;
               color: var(--text-muted); max-width: 100%;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* THE PHOTO SITS ON TOP OF THE INITIALS, in the same box, so a member with an
   image and one without are the same shape and the row does not go ragged at
   the 92.5% of orgs where most people have neither. An image that fails to
   load hides itself and the initials are simply already there. */
.ci-face { position: relative; display: block; width: 34px; height: 34px; border-radius: 50%;
           overflow: hidden; background: var(--border); }
.ci-face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
               z-index: 1; }
.ci-face em { position: absolute; inset: 0; display: flex; align-items: center;
              justify-content: center; font-style: normal; font-size: 12px; font-weight: 700;
              color: #fff; letter-spacing: .3px; }
.ci-face.ci-ok     { background: #16a34a; }
/* A REFUSED SCAN IS RINGED, not just tinted: the ring survives a photo sitting
   on top of it, and a photo is exactly the case where a background colour says
   nothing at all. */
.ci-face.ci-failed { background: #dc2626; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #dc2626; }
/* A MEMBER WHO JUST SCANNED STAYS LIT. Dan: "keep the user's icon/image
   highlighted for a bit longer time."

   IT WAS NOT A DURATION PROBLEM, WHICH IS WHY IT NEEDED MORE THAN A NUMBER.
   The face borrowed `liveMarkIn`, the timeline mark's animation — scale 2.2
   down to 1 by 8% of the run, then nine flat seconds holding at scale 1. So
   the nominal ten seconds were real and the VISIBLE highlight was eight
   hundred milliseconds; after that a member who had just walked in looked
   exactly like one from an hour ago. A longer `liveMarkIn` would have bought
   a longer flat stretch and nothing else.

   So the face gets its own animation, shaped like the ROW highlight rather
   than like the mark: a green ring that lands, holds bright, and fades out
   across the whole window, so the arrival is legible for as long as the class
   is on. The pop stays — it is what catches the eye — but it is no longer the
   entire signal.

   THIRTY SECONDS, NOT TEN, and it is a constant of its own rather than a
   bigger LIVE_FLASH_MS: that one also governs the registration row highlight,
   the money pop and the timeline marks, and Dan asked about one of the four.
   `LIVE_FACE_FLASH_MS` in the page must equal the duration here or the class
   comes off mid-fade (or holds after it), so the spec pins the two together. */
@media (prefers-reduced-motion: no-preference) {
  .ci-person.live-new .ci-face { animation: liveFaceIn 30s ease-out both; }
  @keyframes liveFaceIn {
    0%   { transform: scale(2.2); box-shadow: 0 0 0 3px var(--bg-card), 0 0 0 6px #16a34a; }
    3%   { transform: scale(1);   box-shadow: 0 0 0 3px var(--bg-card), 0 0 0 6px #16a34a; }
    60%  { transform: scale(1);   box-shadow: 0 0 0 3px var(--bg-card), 0 0 0 6px #16a34a; }
    100% { transform: scale(1);   box-shadow: 0 0 0 3px rgba(0,0,0,0), 0 0 0 6px rgba(22,163,74,0); }
  }
}
/* Reduced motion still gets the signal, just without the movement or the fade
   — the ring is simply there while the class is. */
@media (prefers-reduced-motion: reduce) {
  .ci-person.live-new .ci-face { box-shadow: 0 0 0 3px var(--bg-card), 0 0 0 6px #16a34a; }
}
@media (prefers-reduced-motion: no-preference) {
  .live-timeline .lt-mark.fresh { animation: liveMarkIn 10s ease-out both; }
  @keyframes liveMarkIn {
    0%   { transform: scale(2.2); }
    8%   { transform: scale(1); }
    100% { transform: scale(1); }
  }
}
/* FIXED COLUMNS. The rows change under the reader every minute, so natural
   widths meant every poll re-measured the table and the columns jumped. Only
   the section flexes; everything else is a fixed track. */
.live-table { width: 100%; table-layout: fixed; border-collapse: collapse; margin-top: 4px; }
.live-table th { text-align: left; font-size: 9px; font-weight: 700; letter-spacing: .06em;
                 text-transform: uppercase; color: var(--text-muted);
                 padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
.live-table td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--border-subtle);
                 font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-table tr:last-child td { border-bottom: 0; }
.live-table .lt { width: 72px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.live-table .lp { width: 24%; color: var(--text-secondary); }
/* THE FACILITY TABLE IS A DIFFERENT SHAPE. Its last column is a schedule
   ("Sep 20 1:00p", or "Sep 20 +12" for a recurring rental) rather than a
   price, so it needs width and left alignment where `.lm` is a narrow
   right-aligned money column. */
.live-table-fac .lm { width: 84px; text-align: left; font-variant-numeric: tabular-nums;
                      color: var(--text-secondary); font-weight: 400; }
.live-table-fac .ls { white-space: normal; }
/* ONE PERSON COLUMN ON THE ENROLLMENTS TABLE, so it takes the width the owner
   column used to have as well, and the name is primary ink rather than the
   secondary it wore as a second column.

   SCOPED AWAY FROM THE PROGRAMS TABLE, which shares `.live-table` and uses
   `.lp` for its SIGNUPS count — widening `.lp` outright made a number column a
   third of the row wide, which is the one-class-two-tables trap this file
   already records for `.lm` at 62px. */
.live-table:not(.live-table-progs) .lp { width: 34%; font-weight: 600; color: var(--text-primary); }
.live-table .ls { color: var(--text-secondary); }
.live-table .lm { width: 104px; padding-right: 0; text-align: right; white-space: nowrap;
                  font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-primary); }
/* THE CHARGE IS MUTED BEHIND WHAT ARRIVED. Dan, on a $325 registration with
   $195 paid on a plan: "would like to see 195/325 here." Both figures in the
   same orange would read as one number with a slash in it; the paid half keeps
   the state colour and the charge steps back, so the eye lands on the money
   that is actually in. It inherits nothing from `.lm`'s weight for the same
   reason. */
.live-table .lm .live-of { color: var(--text-secondary); font-weight: 400; }
/* Paid green, part-paid orange — the same two colours as the dots in the lane,
   because they are saying the same thing about the same registration. */
.live-table .lm.live-paid { color: #16a34a; }
.live-table .lm.live-part { color: #f59e0b; }
.live-table .lm.live-free { color: var(--text-muted); font-weight: 500; }
.live-table th.lm { text-align: right; }
/* THE PROGRAMS CARD REUSES THIS TABLE WITH A LONGER MONEY COLUMN STILL. Dan:
   "look at the alignment on the headers and revenue section" — with
   `table-layout: fixed` the declared width is honoured, so a 15-character
   nowrap header ("PROGRAM REVENUE") simply overflowed the card's right edge,
   and the "of $X charged" sub-line was clipped. (The base was 62px when this
   was written, sized for the registrations card's bare price; it is 104px now
   that a part-paid row prints "$195 / $325", and this override still has to
   clear the two-line sub-cell on top of that.) */
.live-table-progs .lm { width: 116px; }
.live-table-progs .lm .lm-sub { font-size: 9px; color: #f59e0b; font-weight: 400;
                                white-space: nowrap; line-height: 1.35; margin-top: 1px; }

/* A NEW REGISTRATION ANNOUNCES ITSELF, then stops. Dan: "the new one(s) pop on
   the top, highlighted, then the highlighting fades after 10 seconds or so."
   The fade is the ANIMATION's job and the class comes off on a timer, so a
   later re-render cannot replay it on a row that is no longer news. */
@media (prefers-reduced-motion: no-preference) {
  .live-table tr.live-new td { animation: liveArrive 10s ease-out both; }
  @keyframes liveArrive {
    0%   { background: rgba(22,163,74,.28); transform: translateY(-4px); }
    6%   { background: rgba(22,163,74,.28); transform: translateY(0); }
    100% { background: rgba(22,163,74,0);   transform: translateY(0); }
  }
}
/* Reduced motion still gets the signal, just without the movement. */
@media (prefers-reduced-motion: reduce) {
  .live-table tr.live-new td { background: rgba(22,163,74,.16); }
}

/* THE BOLT HAS A PULSE. Dan: "animate the lightning bolt or something, make it
   seem more 'alive'. Doesn't feel like it's doing anything." It is the only
   thing on the card that moves between registrations, so it is what says the
   widget is still watching. Slow and low-contrast on purpose — this sits on a
   dashboard somebody leaves open, and a hard blink at 60-second intervals is
   an irritation, not a signal. */
.live-bolt { display: inline-block; transform-origin: 50% 60%; }
@media (prefers-reduced-motion: no-preference) {
  .live-bolt { animation: liveBolt 2.8s ease-in-out infinite; }
  @keyframes liveBolt {
    /* Never fully at rest. It used to sit at .55 for two of every three
       seconds, so a still frame — or a glance — read as a dead icon: Dan saw
       one bolt bright and the other faint and reported the second as not
       animating. Both were running; the flat stretch is what made it look
       otherwise, so the baseline now drifts and the flicker is stronger. */
    0%, 100%      { opacity: .62; transform: scale(1); }
    30%           { opacity: .78; transform: scale(1.04); }
    62%           { opacity: .62; transform: scale(1); }
    68%           { opacity: 1;   transform: scale(1.22); }
    74%           { opacity: .72; transform: scale(1.02); }
    80%           { opacity: 1;   transform: scale(1.12); }
    88%           { opacity: .7;  transform: scale(1); }
  }
}
/* MONEY LANDING IS THE EVENT on the programs card, so the figure itself moves
   and says how much arrived. Dan: "the card on the right pulses with more
   revenue for that program." The delta comes from the same arrival diff the
   row highlight uses, so the two cannot disagree about what just happened. */
.live-bump { display: inline-block; margin-left: 5px; font-size: 9px; font-weight: 700; color: #16a34a; }
/* +N: this row covers more sections than the one its link opens. */
/* THE PROGRAMME UNDER THE SECTION NAME — context, not identity, so it is
   smaller, muted and on its own line rather than competing with the link. */
.live-sub-prog { display: block; font-size: 9px; color: var(--text-muted);
                 line-height: 1.3; margin-top: 1px; }
.live-more { display: inline-block; margin-left: 4px; font-size: 9px; font-weight: 700;
             color: var(--text-muted); vertical-align: 1px; }
/* THE TREND ARROW. Down is the one that needs the reader; up and flat are
   muted so the eye lands on what to promote rather than on a wall of green.
   Deliberately NOT the green/orange the price column uses for payment state —
   one card should not spend the same two colours on two unrelated meanings. */
.live-trend { display: inline-block; margin-left: 5px; font-size: 9px; vertical-align: 1px;
              letter-spacing: .02em; }
.live-trend-up   { color: var(--text-muted); }
.live-trend-flat { color: var(--text-muted); opacity: .7; }
.live-trend-down { color: #b45309; font-weight: 700; }
.live-trend-new  { margin-left: 3px; font-size: 8px; font-weight: 700; text-transform: uppercase;
                   color: var(--text-muted); }
@media (prefers-reduced-motion: no-preference) {
  /* THE POP MOVES THE FIGURE; IT DOES NOT RECOLOUR IT. It used to animate
     `color` to green, which overrode the payment-state ink for ten seconds —
     so a brand-new UNPAID price rendered green, saying the money had arrived
     when it had not. Caught by the render case that reads the computed colour
     of each state. Scale only now. */
  .live-table tr.live-new .lm { animation: liveMoneyPop 10s ease-out both; }
  @keyframes liveMoneyPop {
    0%  { transform: scale(1.28); }
    7%  { transform: scale(1); }
    100%{ transform: scale(1); }
  }
}

/* A link into Rec. Underlined on hover only: a column of eight underlined
   names reads as a wall of links rather than a list of people. */
.live-link { color: inherit; text-decoration: none; }
.live-link:hover { text-decoration: underline; color: var(--amber); }
.live-table .ls .live-link:hover { color: var(--amber); }
.live-foot { margin-top: 8px; font-size: 10px; color: var(--text-muted); }

/* ── HAPPENING TODAY ──────────────────────────────────────────────────
   THE LIVE GRID SIZES ITS OWN ROWS, and only this section does. Dan's layout
   is one double-height card on the left with two half-height ones stacked
   beside it, which is a 2-row span plus EQUAL rows — and `1fr` auto rows is
   what makes the two on the right the same height as each other rather than
   each sizing to whatever it happens to contain. Scoped to `.live-grid` so
   the report sections below keep sizing their rows independently. */
.live-grid { grid-auto-rows: 1fr; }
/* AND THE SPAN IS NOT ENOUGH ON ITS OWN — this is the bug Dan hit.
   `grid-row: span 2` only produces a double-height card while some OTHER card
   in the same grid occupies a SINGLE row and therefore sizes it. Torrance runs
   two live cards, Happening Today and Check-Ins; the moment both spanned two
   rows nothing was left to size a row, the rows collapsed to the cards' own
   `min-height` split between them, and BOTH came out at 300px. Measured in a
   browser: `cards=2 ht=300 ci=300` where the intent was ~614 each — so ticking
   2x height made Happening Today HALF the height it had been, which is exactly
   what Dan reported.

   So a tall card carries its own floor: two ordinary rows plus the gap between
   them. Both numbers come from the variables the grid itself uses, or this
   drifts the first time either changes. */
.widget-tall { grid-row: span 2; }
/* (0,2,0) DELIBERATELY. `.widget-md` sets its own `min-height` and is declared
   AFTER this rule, so a bare `.widget-tall` (0,1,0) loses the cascade on equal
   specificity and the floor silently does nothing — which is how the first
   version of this fix measured 300px in exactly the two-card case it was
   written for. Same shape as `.widget-card.live-card` further up this file. */
.widget-card.widget-tall { min-height: calc(var(--widget-row-min) * 2 + var(--widget-grid-gap)); }
/* THE LIST SCROLLS INSIDE THE CARD, and `flex: 1 1 0` with `min-height: 0` is
   what makes that true rather than aspirational: a flex basis of zero drops
   the list out of the card's own intrinsic height, so a day with a hundred
   sessions cannot grow the grid row the card is supposed to fit inside.
   `overflow-y: auto` on its own would not — the row would size to the whole
   list and there would be nothing left over to scroll. */
.ht-list { flex: 1 1 0; min-height: 0; overflow-y: auto; margin-top: 2px; }
.ht-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 0 8px;
          align-items: baseline; padding: 6px 4px 6px 7px;
          border-bottom: 1px solid var(--border-subtle); border-left: 3px solid transparent; }
.ht-row:last-child { border-bottom: 0; }
.ht-when { font-size: 9.5px; font-weight: 700; white-space: nowrap;
           font-variant-numeric: tabular-nums; color: var(--text-muted); }
.ht-name { display: block; font-size: 11px; font-weight: 600;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ht-where { display: block; font-size: 9px; color: var(--text-muted); line-height: 1.3;
            margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* THE ENROLMENT READS "11/20" — Dan's own example. Tabular figures so a column
   of them lines up, and a dash where the capacity is NULL: no cap means
   unlimited, not zero, and "11/0" is a number that cannot be true. */
.ht-enr { font-size: 10px; font-weight: 700; white-space: nowrap;
          font-variant-numeric: tabular-nums; }
.ht-enr-full { color: #b45309; }
/* RUNNING NOW IS THE GREEN ONE. Dan: "as the program becomes 'live' and
   happening in their time zone, it highlights in green". The bar on the left
   carries it rather than a full green fill, so a morning with eight things
   running at once still reads as a list. */
.ht-row-live { background: rgba(22,163,74,.10); border-left-color: #16a34a; }
.ht-row-live .ht-when { color: #16a34a; }
.ht-row-cancel .ht-name { text-decoration: line-through; }
.ht-row-cancel { opacity: .72; }
.ht-note { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 8px; }
@media (max-width: 1100px) { .widget-grid { grid-template-columns: repeat(3, 1fr); } }
/* BELOW FOUR COLUMNS THE TWO-ROW SPAN STOPS MEANING ANYTHING — there is no
   longer a column beside it for the two half-height cards to stack in — so the
   tall card becomes an ordinary one and the rows size to content again. The
   list keeps its scroll either way, because widget-md still carries a
   min-height for it to fill. */
@media (max-width: 1100px) {
  .live-grid { grid-auto-rows: auto; }
  /* THE FLOOR GOES WITH THE SPAN. Below four columns there is no longer a
     column beside the tall card for anything to stack in, so a 614px floor
     would leave a tall empty card on a laptop rather than a double-height one
     beside its neighbours. */
  .widget-tall { grid-row: span 1; }
  .widget-card.widget-tall { min-height: var(--widget-row-min); }
}
@media (max-width: 800px) { .widget-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .widget-grid { grid-template-columns: 1fr; } }

/* Widget Cards */
.widget-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px;
  padding: 20px; position: relative; transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s; }
.widget-card:hover { transform: translateY(-2px); border-color: var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.widget-sm { grid-column: span 1; }
.widget-md { grid-column: span 2; min-height: var(--widget-row-min); }
.widget-lg { grid-column: span 4; min-height: 200px; }
@media (max-width: 500px) { .widget-md, .widget-lg { grid-column: span 1; } }

/* Table widget */
.widget-table { overflow-x: auto; max-height: 320px; overflow-y: auto; }
.widget-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.widget-table th { text-align: left; padding: 6px 10px; font-size: 10px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-card); }
.widget-table td { padding: 5px 10px; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); }
.widget-table tr:hover td { background: var(--bg-card-hover); }
.widget-table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* Target / Goal */
.metric-with-target { display: flex; align-items: center; gap: 16px; }
.metric-with-target .metric-left { flex: 1; }
.progress-ring { width: 68px; height: 68px; flex-shrink: 0; }
.target-pct { font-family: var(--font-display); font-size: 14px; font-weight: 700; }
.target-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.target-editor { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; padding: 8px 10px;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; }
.target-editor input { font-family: var(--font-body); font-size: 13px; width: 100px; padding: 4px 8px;
  border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--text-primary); outline: none; }
.target-editor input:focus { border-color: var(--amber); }
.target-editor .te-label { font-size: 11px; color: var(--text-secondary); }
.gear-btn { background: none; border: none; cursor: pointer; font-size: 13px; opacity: 0.3; padding: 2px;
  transition: opacity 0.15s; color: var(--text-secondary); }
.gear-btn:hover { opacity: 0.8; }
.widget-card:hover .gear-btn { opacity: 0.5; }
/* The tile's own link into the report tab it was computed from. Deliberately
   NOT hover-only: a control nobody can find is a control that does not exist,
   and the bug report for it arrives as a feature request. */
.widget-report-link { text-decoration: none; font-size: 12px; opacity: 0.45; padding: 2px;
  transition: opacity 0.15s; color: var(--text-secondary); line-height: 1; }
.widget-report-link:hover { opacity: 1; }
.widget-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.widget-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; letter-spacing: 0.02em; }
.widget-icon { font-size: 16px; opacity: 0.7; }
/* Smart-card visualization switcher — lets a chart widget flip between bar/pie/line.
   Low-opacity until card hover (same discoverability pattern as .gear-btn). */
.viz-switch { display: inline-flex; gap: 2px; opacity: 0.4; transition: opacity 0.15s; }
.widget-card:hover .viz-switch, .viz-switch:focus-within { opacity: 1; }
.viz-btn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 20px;
  padding: 0; border: none; background: none; border-radius: 4px; cursor: pointer; color: var(--text-muted, #94a3b8); }
.viz-btn:hover { color: var(--text-secondary, #334155); background: rgba(127,127,127,0.14); }
.viz-btn.active { color: var(--amber, #f59e0b); background: rgba(245,158,11,0.14); }
.viz-btn svg { width: 14px; height: 14px; display: block; }

/* Metric */
.metric-value { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1.1; margin-top: 8px; letter-spacing: -0.02em; }
.metric-green { color: var(--green); }
.metric-red { color: var(--red); }
.metric-amber { color: var(--amber); }
/* ── Prior-period delta pill ── */
.delta-pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; animation: pillIn .25s ease; }
.delta-pill.good { background: rgba(34,197,94,.14); color: var(--green); }
.delta-pill.bad  { background: rgba(239,68,68,.13); color: var(--red); }
.delta-pill.flat { background: rgba(148,163,184,.15); color: var(--text-muted); }
.delta-pill .dvs { font-weight: 500; opacity: .75; }
@keyframes pillIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

/* ── Tabs (format borrowed from rental-report's g-tabs) ── */
.g-tabs { display: flex; gap: 0; margin: 0; padding: 0 24px; border-bottom: 2px solid var(--border); flex-wrap: wrap; }
.g-tab { padding: 11px 20px; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer;
  border: none; border-bottom: 2px solid transparent; margin-bottom: -2px; background: none;
  font-family: var(--font-body); display: flex; align-items: center; gap: 7px; transition: color 0.15s; }
.g-tab:hover { color: var(--text-primary); }
.g-tab.active { color: var(--amber); border-bottom-color: var(--amber); }
.g-tab .tab-count { font-size: 10px; font-weight: 700; background: var(--amber); color: #000; border-radius: 9px; padding: 1px 7px; }
.g-tab .tab-alert { font-size: 10px; font-weight: 800; background: #ef4444; color: #fff; border-radius: 9px;
  min-width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
  box-shadow: 0 0 0 2px var(--bg-main, transparent); }

/* Skeleton */
.skeleton { background: linear-gradient(90deg, var(--bg-surface) 25%, #222 50%, var(--bg-surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Stale-data dim on date change. Applied per widget, not to the whole board:

/* THE INNER BAR ONLY EXISTS WHILE LOADING. It carried a background and a 30%

/* THE 2x HEIGHT TICK. Indented under its card and visibly a sub-option rather

/* ── Revenue Streams Widget ── */
