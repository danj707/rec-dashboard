<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token') || '';
const _pathParts = window.location.pathname.replace(/^\//, '').split('/');
const IS_SHARE = _pathParts[0] === 'share';
const SHARE_TOKEN = IS_SHARE ? _pathParts[1] : null;
const ORG_SLUG = IS_SHARE ? '' : _pathParts[0];
/* ORG_SLUG and TOKEN are this dashboard's names for the organisation. rental-report
 * has its own, and they can drift — Shrewsbury was `town-of-shrewsbury` here and
 * `shrewsbury` there for five weeks, so every report link 404'd. The server
 * reconciles the two on the organisation UUID and hands the answer down in
 * _orgMeta; these are the ONLY values a rental-report URL may be built from.
 * They fall back to ours, which is what the page did before and is correct for
 * every org that has not drifted. */
function RPT_SLUG(){ return (window._orgMeta && window._orgMeta.reportingSlug) || ORG_SLUG; }
function RPT_TOKEN(){ return (window._orgMeta && window._orgMeta.reportingToken) || TOKEN; }
const IS_PRINT = params.get('_print') === '1';
const PRINT_SECTIONS = params.get('sections') ? params.get('sections').split(',') : null;
const CHART_COLORS = ['#f59e0b','#3b82f6','#22c55e','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16','#14b8a6','#f97316'];
const pf = v => parseFloat(v) || 0;
// Signup timestamp (ms) for a user row, or null. Powers the period-comparison
// pills on the all-time Users & Demographics tiles (computed from created_at
// rather than a prior-window fetch, which all-time reports don't have).
const userCreatedMs = r => { const d = r['created_at'] || r['Created At'] || r['signup_date'] || r['Signup Date'] || r['Created'] || ''; const t = d ? new Date(d).getTime() : NaN; return isNaN(t) ? null : t; };
const DAY_MS = 86400000;

function fmt(val, format) {
  if (val == null || isNaN(val)) return '\u2014';
  if (format === 'currency') return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  if (format === 'currency2') return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (format === 'number2') return Number(val).toFixed(2);
  if (format === 'percent') return Number(val).toFixed(1) + '%';
  return Number(val).toLocaleString('en-US');
}
function fmtTooltip(v, format) { return format==='currency' ? '$'+Number(v).toLocaleString('en-US',{maximumFractionDigits:0}) : Number(v).toLocaleString('en-US'); }
// Value-axis currency ticks: one decimal on thousands ($1.2k) so adjacent
// ticks never round into duplicate labels ($2k, $2k, $1k, $1k…).
function fmtAxisCurrency(v) { return '$' + (v >= 1000 ? (v/1000).toFixed(1).replace(/\.0$/,'') + 'k' : v); }
// Did any GL revenue land in the selected window? Used by the program tiles
// to caption registration-season zero states.
function glHasRevenue(all) {
  const gl = all && all.gl;
  return Array.isArray(gl) && gl.reduce((s,r) => s + pf(r['Total Payments']), 0) > 0;
}
function shortDate(iso) { if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function getMonthRange(offset = 0) {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth() + offset;
  const start = new Date(y, m, 1), end = new Date(y, m + 1, 0);
  return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0] };
}

// ═══════════════════════════════════════════════════════
//  MEMBERSHIP BOOK HELPERS
// ═══════════════════════════════════════════════════════
// These are a deliberate MIRROR of the module-scope helpers in
// rental-report's public/memberships.html, and they carry the same names on
// purpose so a grep finds both copies. Card 17301 is SHARED between the two
// projects (f4496307-… here, SHARED_UUIDS.memberships there), so a rule about
// what a row MEANS has to be the same in both or the dashboard and the report
// it links to will disagree about the same org on the same day.
//
// They are at module scope, not inside a transform, so a spec can RUN them
// rather than regex over them.
//
// THE THREE THINGS THAT ARE EASY TO GET WRONG, all measured against prod
// during the report work and all reproduced here:
//
//   1. A PASS IS NOT A MEMBERSHIP. Norman's feed is 20,341 rows of which
//      16,940 are passes — including 4,518 "$5 League Tournament Gate Adult"
//      admissions. Counting those as members inflates every membership figure
//      on this section, and it is why 'Active Members' needed a pass gate.
//   2. A BILLING CYCLE IS A PROPERTY OF THE PLAN, NOT OF ONE ROW. Dividing by
//      each row's own (Next Renewal − Period Start) reads the time REMAINING
//      in the period on a membership whose renewal is imminent: at Apex, 8
//      rows had a gap under a day (smallest 15 minutes) and one derived
//      44,665 renewals. The median across a plan's members is unmoved by a
//      minority of corrupt rows.
//   3. PRESENCE, NOT COUNT. Feeds cache 4 hours, so a pre-v3/v4 response with
//      none of these columns is live alongside a current one. A widget that
//      renders 0 there says "this org has no auto-renew"; the truth is "this
//      feed cannot tell us". Every gate below tests whether the COLUMN is
//      present, never whether any row has a value.

function mbCol(r, name) { return r ? r[name] : undefined; }
function mbHasColumn(rows, name) {
  return Array.isArray(rows) && rows.length > 0 && rows.some(r => r && Object.prototype.hasOwnProperty.call(r, name));
}
function mbHasProductKind(rows) { return mbHasColumn(rows, 'Product Kind'); }
function mbHasAutoRenew(rows) { return mbHasColumn(rows, 'Auto Renew'); }
function mbHasCancelSchedule(rows) { return mbHasColumn(rows, 'Cancel Scheduled At'); }
function mbHasPeriod(rows) { return mbHasColumn(rows, 'Period Start'); }

function mbIsPass(r) { return String(mbCol(r, 'Product Kind') || '').toLowerCase() === 'pass'; }
function mbIsActive(r) { return String(mbCol(r, 'Status') || '').toLowerCase() === 'active'; }

// A membership is CANCELLED if it has a cancellation date; the status word is
// the fallback, not the test. Reading the word first misses a row whose status
// has moved on but which carries the date.
function mbIsCanceled(r) {
  if (!r) return false;
  if (mbCol(r, 'Canceled At')) return true;
  const st = String(mbCol(r, 'Status') || '').toLowerCase();
  return st === 'canceled' || st === 'cancelled';
}

// SCHEDULED to cancel is not CANCELLED — the membership is still live and
// still billing, it just will not renew. The !mbIsCanceled guard is what stops
// the two being added together the moment one becomes the other.
function mbCancelPending(r) {
  return !!(r && mbCol(r, 'Cancel Scheduled At') && !mbIsCanceled(r));
}

// `Auto Renew` is the truth (stripe_subscription_id IS NOT NULL). `Renewal
// Type` INFERS it from next_renewal_at and is a different test — it is the
// pre-v2 fallback only, so a warm 4-hour cache entry still resolves to the
// same answer rather than reading as nobody auto-renewing.
function mbIsAutoRenew(r) {
  if (!r) return false;
  const explicit = mbCol(r, 'Auto Renew');
  if (explicit != null && explicit !== '') {
    return explicit === true || String(explicit).toLowerCase() === 'true' || String(explicit) === '1';
  }
  return String(mbCol(r, 'Renewal Type') || '').toLowerCase().indexOf('auto') >= 0;
}

function mbPlanKey(r) {
  return (r && (mbCol(r, 'Group / Plan') || mbCol(r, 'Membership Type'))) || '—';
}

function mbDays(a, b) {
  const t0 = Date.parse(a), t1 = Date.parse(b);
  if (isNaN(t0) || isNaN(t1)) return null;
  return (t1 - t0) / 86400000;
}

// One ROW's gap. Only ever used as a vote toward its plan's median — see (2).
function mbRowGapDays(r) {
  const d = mbDays(mbCol(r, 'Period Start'), mbCol(r, 'Next Renewal'));
  return d == null || d <= 0 ? null : d;
}

// The plan's cycle is the MEDIAN of its members' gaps, with sub-day gaps
// excluded from the vote entirely: they are a renewal about to happen, not a
// cadence, and they are the input that produced 44,665.
function mbPlanCycles(rows) {
  const byPlan = {};
  (rows || []).forEach(r => {
    const g = mbRowGapDays(r);
    if (g == null || g < 1) return;
    const k = mbPlanKey(r);
    (byPlan[k] = byPlan[k] || []).push(g);
  });
  const out = {};
  Object.keys(byPlan).forEach(k => {
    const v = byPlan[k].sort((a, b) => a - b);
    out[k] = v[Math.floor(v.length / 2)];
  });
  return out;
}

function mbCadence(days) {
  if (days == null) return null;
  if (days <= 10) return 'per week';
  if (days <= 45) return 'per month';
  if (days <= 120) return 'per quarter';
  return 'per year';
}

// THERE IS NO RENEWAL-EVENT HISTORY ANYWHERE — `membership` keeps only the
// CURRENT period — so renewals are derived: elapsed time divided by the plan's
// cycle. Verified by remainder at Norman (weekly exact, monthly 0.06 off a
// whole number, annual exact), which is why this is safe to state at all.
//
// NULL, never 0, when it cannot be derived: next_renewal_at is cleared on
// cancellation, so a member who renewed six times and then left would
// otherwise read as never having renewed — and would drag down the very plan
// that kept billing them longest. Above 600 the dates are wrong and a dash is
// more honest than a confident number.
function mbRenewalsSoFar(r, planCycle) {
  if (!r || !planCycle || planCycle < 1) return null;
  const d = mbDays(mbCol(r, 'Start Date'), mbCol(r, 'Period Start'));
  if (d == null || d < 0) return null;
  const n = Math.round(d / planCycle);
  return n <= 600 ? n : null;
}

// Churn as a HAZARD RATE: of all renewal opportunities, what share ended in a
// cancellation. The lifetime share of a four-year-old book having eventually
// cancelled is unremarkable; the same figure sitting in a KPI row reads as a
// monthly rate and looks like a fire. Dan: "always report the churn rate based
// on its renewal period."
function mbChurnPerCycle(renewals, canceled) {
  const opportunities = (renewals || 0) + (canceled || 0);
  if (!opportunities) return null;
  return canceled / opportunities;
}

// A per-cycle charge is only comparable across plans once it is per month.
// Measured: 50 memberships bill WEEKLY, so reading the charge as monthly
// understates them roughly fourfold.
function mbMonthlyValue(price, cycleDays) {
  if (cycleDays == null || cycleDays < 1) return null;
  return price * (30.44 / cycleDays);
}

function mbPrice(r) {
  return pf(mbCol(r, 'Net Collected') || mbCol(r, 'Paid') || mbCol(r, 'Price'));
}

// The auto-renew BOOK: the rows somebody is actually on auto-renew for. Dan,
// after two rounds of narrowing a denominator instead: "the memberships showing
// up in the auto renew tab should be those that are setup for auto renew."
// That one rule subsumes every exclusion argued for separately — a pass, a
// season plan and a desk-paid cash plan all have nobody enrolled and fall out
// together instead of as three special cases.
function mbBook(rows) {
  return (rows || []).filter(r => mbIsAutoRenew(r));
}

// ═══════════════════════════════════════════════════════
//  CRM & MESSAGING
// ═══════════════════════════════════════════════════════
// Card 21913, one row per MESSAGE (a send) — the grain Rec's own
// /marketing/messages list uses, which is the page this section links to.
//
// Every one of these is at MODULE SCOPE so the spec can LIFT AND RUN it. A
// regex over a rate passes on an inverted comparison, and every defect this
// section can have is arithmetic about counts.

function msgN(r, k) { const n = parseInt(r && r[k], 10); return isNaN(n) ? 0 : n; }
function msgIsSms(r) { return String((r && r['Channel']) || '').toUpperCase() === 'SMS'; }
function msgIsMarketing(r) { return String((r && r['Type']) || '').toLowerCase() === 'marketing'; }

// A send's segments travel as a JSON ARRAY, never a joined string — segment
// names are written by humans and Watertown really has one called "Spring
// Pickleball Intermediate League Captains". Splitting on a comma would turn
// the first segment somebody names "Adults, Seniors" into two that do not
// exist. Metabase can hand a jsonb column back either already parsed or as
// text depending on the column's inferred type, so both are read and anything
// else yields nothing rather than a guess — and measured against the live
// card the STRING branch is the one that runs: card 21913's Segments arrives
// as "[\"Kids Track & Field\"]", so a reader that only handled an array
// would report every send as untargeted while looking perfectly correct.
function msgSegmentNames(r) {
  const v = r && r['Segments'];
  const clean = a => a.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim());
  if (Array.isArray(v)) return clean(v);
  if (typeof v === 'string' && v.trim()) {
    try { const parsed = JSON.parse(v); return Array.isArray(parsed) ? clean(parsed) : []; }
    catch (e) { return []; }
  }
  return [];
}

// ONE reducer, N readers. Nine tiles and three charts read this section's
// figures; nine inline reduces is how two of them come to disagree about the
// same window — already recorded here for the Programs revenue row.
function msgTotals(rows) {
  const t = { sends: 0, recipients: 0, delivered: 0, bounced: 0, noOutcome: 0,
              complaints: 0, clicked: 0, costCents: 0, smsSegments: 0,
              smsSends: 0, smsRecipients: 0, emailSends: 0, emailRecipients: 0,
              marketingSends: 0, marketingRecipients: 0,
              transactionalSends: 0, transactionalRecipients: 0,
              segmentSends: 0 };
  (rows || []).forEach(r => {
    const rec = msgN(r, 'Recipients');
    t.sends++; t.recipients += rec;
    t.delivered += msgN(r, 'Delivered');
    t.bounced += msgN(r, 'Bounced');
    t.noOutcome += msgN(r, 'No Outcome');
    t.complaints += msgN(r, 'Complaints');
    t.clicked += msgN(r, 'Clicked');
    t.costCents += msgN(r, 'Cost Cents');
    t.smsSegments += msgN(r, 'SMS Segments');
    if (msgIsSms(r)) { t.smsSends++; t.smsRecipients += rec; }
    else { t.emailSends++; t.emailRecipients += rec; }
    if (msgIsMarketing(r)) { t.marketingSends++; t.marketingRecipients += rec; }
    else { t.transactionalSends++; t.transactionalRecipients += rec; }
    if (msgSegmentNames(r).length) t.segmentSends++;
  });
  return t;
}

// REC'S OWN FORMULA, delivered / sent. West Haven's "Last Chance to register
// for Zumba" message page reads "Sent 1,664 · Delivered 98.4%", and 1,637 of
// 1,664 is 98.38%. Dividing by the rows that reached a terminal state gives
// 99.3% instead — defensible, and 0.9pp adrift of the page this section's own
// header links to. Two surfaces disagreeing about one send is worse.
//
// NULL, NEVER 0, WHEN THE WINDOW RECORDS NO OUTCOME AT ALL — and that is the
// whole reason Dan's "email delivery rates (which are a bit sus)" was a real
// finding rather than a grumble. Email delivery webhooks were not wired until
// 2026-02: every one of the 15,158 deliveries before then has delivered_at
// NULL and bounced_at NULL, so a window inside 2025 divides a real numerator
// of zero by a real denominator and renders a confident 0% deliverability
// catastrophe that never happened. A real 0% still shows — a window where
// everything bounced is an answer.
function msgDeliveryRate(rows) {
  const t = msgTotals(rows);
  if (!t.recipients) return null;
  if (!t.delivered && !t.bounced) return null;
  return t.delivered / t.recipients * 100;
}

// The share of a window the platform cannot speak for. This is what turns the
// rate above from a number into a number you can argue with, so it is a tile
// of its own rather than a footnote.
function msgNoOutcomeShare(rows) {
  const t = msgTotals(rows);
  return t.recipients ? t.noOutcome / t.recipients * 100 : null;
}

// Recipients per day, on the SEND's own date in the ORG's timezone — the card
// converts before it emits, so nothing here parses an instant.
function msgDaily(rows) {
  const g = {};
  (rows || []).forEach(r => { const d = r && r['Sent Date']; if (d) g[d] = (g[d] || 0) + msgN(r, 'Recipients'); });
  return Object.entries(g).sort((a, b) => String(a[0]).localeCompare(String(b[0])));
}

/* AVERAGE SEGMENTS PER SMS — the number that converts a contract term.
   A carrier bills per 160-character SEGMENT, and `rate_cents` (3 on all 175
   orgs) is charged per segment despite the admin field reading "Rate per
   Message". Measured over every SMS on the platform — 17,850 messages,
   35,604 segments — the mean is 1.99 and nothing exceeds 3. So an org told it
   has "10,000 messages" really has about 5,000.

   Per RECIPIENT, not per send: a send to 1,600 people is 1,600 texts and 1,600
   texts' worth of segments. Dividing by sends would report a campaign's whole
   segment count as if one person received it.

   NULL when the window holds no SMS — never 0 and never 1. "This org sent no
   texts" and "this org's texts are one segment each" are different facts, and
   the second is the one that makes an allowance look twice as roomy as it is. */
function msgAvgSegments(rows) {
  const t = msgTotals(rows);
  if (!t.smsRecipients || !t.smsSegments) return null;
  return t.smsSegments / t.smsRecipients;
}

/* THE BUCKET IS A POSITION, NOT A FLOW — and that is why this reads two
   numbers. An org is given 10,000 or 15,000 segments ONCE at signup and is
   billed per segment after; nothing refills. So "how much of the bucket is
   gone" is an all-time question and cannot be answered by whatever the date
   picker happens to be showing.

   Watertown is the worked example: 6,863 segments all time against a 15,000
   bucket is 46% gone, while the SAME tile on a This-Month view holds 285. A
   percentage taken from the window would read 1.9% and look like an org that
   has barely started, which is the opposite of true. The window figure is
   still worth having — it is the burn rate — so the tile shows the window and
   names the all-time position underneath it.

   Presence, not value: an org with no bucket set gets null and the tile says
   so, rather than a confident "0% of 0" that reads as headroom. And `allTime`
   NULL means the all-time feed has not answered yet — deliberately different
   from 0, which would claim an untouched bucket. */
function msgSegmentUsage(rows, thresholds, allTime) {
  const t = msgTotals(rows);
  const limit = thresholds && thresholds.smsSegmentLimit != null ? thresholds.smsSegmentLimit : null;
  const used = allTime && typeof allTime.segments === 'number' ? allTime.segments : null;
  return {
    windowSegments: t.smsSegments,
    // Kept for callers that only care about the window.
    segments: t.smsSegments,
    limit,
    used,
    usedMessages: allTime && typeof allTime.messages === 'number' ? allTime.messages : null,
    pct: (limit && used != null) ? (used / limit) * 100 : null,
    remaining: (limit && used != null) ? Math.max(0, limit - used) : null,
    over: (limit && used != null) ? used >= limit : false,
  };
}

// SENDS per segment, not recipients — which is deliberately the same thing
// Rec's own Segments page counts in its Usage column, so the two agree. It
// also sidesteps a real ambiguity: a send targeting two segments reaches one
// audience, and adding its recipients to both would total more people than
// the org has.
function msgBySegment(rows) {
  const g = {};
  (rows || []).forEach(r => { msgSegmentNames(r).forEach(n => { g[n] = (g[n] || 0) + 1; }); });
  return Object.entries(g).sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
}

   the org uuid is already on the page as orgMeta.recOrgId, the same value

   WHITELISTED BY NAME, NOT A FREE PATH. The org uuid is ours and the path is
   ours; handing an arbitrary string to a URL builder is how a typo becomes a
   confident 404 on somebody else's admin — the lesson already paid for by
   recPage() in the sibling repo. A section not in this map gets no link, which
   is the right failure. */
const REC_PAGES = { 'marketing-messages': 'marketing/messages' };
const SECTION_REC_PAGE = { messaging: 'marketing-messages' };
function recPageUrl(orgId, pageName) {

/* Sections that cannot be drawn until the server can serve their feed. Only
   sections listed here are gated — a blanket rule would hide every section for
   the beat between mount and the org-meta fetch resolving.

   GATING THE FETCH AND NOT ONLY THE RENDER IS THE LOAD-BEARING HALF. The gate
   is folded into `dataKey`, so a hidden section is not requested either.
   Gating only the render still fires the request, gets a 404 and raises the
   dashboard's own failure banner naming a report the org never asked for — a
   louder version of exactly the confident zero this is here to prevent. That
   half IS reachable and the render check catches it.

   UNKNOWN ALSO COUNTS AS MISSING, and that half is DEFENSIVE rather than
   load-bearing — said plainly because the mutation testing showed it. Today
   `availableReports` and `config` are set from one response in one handler,
   so there is no state where config exists and the map has not answered; the
   mutation that treats an empty map as "present" changes nothing anybody can
   observe, and claiming the guard catches it would be claiming a guard that
   is not doing the work. It stays because the two arriving together is a
   property of one fetch handler rather than a rule, and the day the map is
   fetched separately the other reading is a doomed request on every load. */
const SECTION_REQUIRES_FEED = { messaging: 'messaging' };
function sectionFeedMissing(sectionId, availableReports) {
  const rt = SECTION_REQUIRES_FEED[sectionId];
  if (!rt) return false;
  return !(availableReports && availableReports[rt]);
}
// ONE funnel, three readers: the data fetch, the comparison fetch and the
// render all go through this, so a section can never be drawn from a feed
// nobody asked for or asked for without being drawn.
function sectionsWithFeeds(sections, availableReports) {
  return (sections || []).filter(s => !sectionFeedMissing(s.id, availableReports));
}

  'ft-top-sections': { label: 'Top Fast Tracked Sections', description: 'Sections by FT signup volume', note: 'Sections with the most pre-registered demand, against their capacity', section: 'fasttrack',
    reportType: 'fasttrack', size: 'md', icon: '\uD83C\uDFAF', component: 'bar',
    // SECTION grain, deliberately not program grain. 'Top FT Programs' already
    // exists and a program HIDES its sections: at Watertown "Adult Pickleball
    // Open Play" is the tallest program bar because it aggregates several
    // sessions, while one intermediate session holds 67 of those signups on its
    // own. The section is also the thing that actually opens and fills, so it is
    // the level a capacity decision is made at.
    transform: rows => {
      const sec = rows.filter(r => (r['Row Type'] || 'section') === 'section');
      const s = sec.map(r => ({
          name: r['Section'] || r['Program'] || 'Unknown',
          ft: parseInt(r['FT Total']) || 0,
          cap: parseInt(r['Capacity']) || 0,
        }))
        .filter(x => x.ft > 0)
        .sort((a, b) => b.ft - a.ft)
        .slice(0, 10);
      // Capacity rides in the label, because 36 signups against 200 seats and 14
      // against 8 are the same bar height and opposite situations.
      return { labels: s.map(x => x.cap > 0 ? x.name + ' \u00B7 ' + x.ft + '/' + x.cap : x.name),
               values: s.map(x => x.ft) };
    }},

  'ft-money': { label: 'Fast Track Money', description: 'Earned, awaiting checkout, and blocked by capacity', note: 'What Fast Track earned, and the demand that has not turned into money yet', section: 'fasttrack',
    reportType: 'fasttrack', size: 'md', icon: '\uD83D\uDCB0', component: 'table',
    // THREE POTS, AND THEY HAVE DIFFERENT LEVERS. This is the whole reason the
    // widget is a table rather than three metrics: an amount with no action
    // attached invites the wrong one.
    //
    // Measured on card 17300 (watertown, 2026-08-27), exact on all 338 sections:
    //   Left on Table === FT Pending * Section Price
    // So it is the value of holds that have NOT converted — NOT demand that
    // exceeded capacity. Of the 138 sections carrying it, only 2 are
    // oversubscribed and 100 STILL HAVE EMPTY SEATS. Adding capacity there
    // captures nothing; those families already had a seat and did not finish.
    //
    // The genuine "add a few more spots" money is Over Demand $ — $1,170 across
    // one section at Watertown. Small here, and the figure that grows at the
    // oversubscribed orgs. Conflating the two would send someone to add seats to
    // sections that are already half empty.
    transform: rows => {
      const sec = rows.filter(r => (r['Row Type'] || 'section') === 'section');
      const n = v => { const x = parseFloat(String(v == null ? 0 : v).replace(/[$,]/g, '')); return isFinite(x) ? x : 0; };
      let earned = 0, holds = 0, blocked = 0, holdSecs = 0, blockedSecs = 0, holdSeats = 0, holdPeople = 0;
      sec.forEach(r => {
        earned  += n(r['FT Revenue']);
        const lot = n(r['Left on Table']);
        const ov  = n(r['Over Demand $']);
        holds   += lot;
        blocked += ov;
        if (lot > 0) {
          holdSecs++;
          holdPeople += parseInt(r['FT Pending']) || 0;
          // Seats still free in the sections where money is waiting — the fact
          // that turns "add capacity" into "chase the checkout".
          const free = (parseInt(r['Capacity']) || 0) - (parseInt(r['Total Enrolled']) || 0);
          if (free > 0) holdSeats++;
        }
        if (ov > 0) blockedSecs++;
      });
      const money = v => '$' + Math.round(v).toLocaleString();
      return {
        columns: ['', 'Amount', 'Where', 'What moves it'],
        data: [
          ['Earned', money(earned), sec.filter(r => n(r['FT Revenue']) > 0).length + ' sections', 'Already collected'],
          ['Awaiting checkout', money(holds), holdSecs + ' sections \u00B7 ' + holdPeople + ' families',
            holdSeats > 0 ? 'Follow-up \u2014 ' + holdSeats + ' of these still have seats free' : 'Follow-up with the families holding'],
          ['Blocked by capacity', money(blocked), blockedSecs + (blockedSecs === 1 ? ' section' : ' sections'),
            blocked > 0 ? 'Add spots \u2014 demand exceeded seats' : 'Nothing blocked on seats'],
        ],
      };
    }},

  'mem-mrr': { label: 'Monthly Recurring', description: 'Auto-renew revenue per month', note: 'Each charge converted to a monthly figure using its plan’s own cycle', section: 'memberships',
    reportType: 'memberships', size: 'sm', icon: '💵', component: 'metric', reportTab: 'autorenew',
    transform: rows => {
      if (!mbHasPeriod(rows)) return { value: null, format:'currency', sub:'billing cycle not in this feed yet' };
      const cycles = mbPlanCycles(rows);
      const book = mbBook(rows);
      // ONE POPULATION. A total over every auto-renewer beside a monthly figure
      // over only those with a known cycle is two correct sums that do not
      // reconcile, which is how a reader stops trusting either.
      let monthly = 0, known = 0, unknown = 0;
      book.forEach(r => {
        const mv = mbMonthlyValue(mbPrice(r), cycles[mbPlanKey(r)]);
        if (mv == null) { unknown++; return; }
        monthly += mv; known++;
      });
      return { value: known ? monthly : null, format:'currency', colorClass:'metric-green',
               sub: known

                 : 'no readable billing cycle here' };
    } },
  'mem-churn': { label: 'Churn Per Renewal', description: 'Share of renewal opportunities ending in a cancellation', note: 'A rate per renewal, NOT the lifetime share who have ever cancelled', section: 'memberships',
    reportType: 'memberships', size: 'sm', icon: '📉', component: 'metric', reportTab: 'autorenew',
    deltaGoodWhenDown: true,
    transform: rows => {
      if (!mbHasPeriod(rows)) return { value: null, format:'percent', sub:'renewal dates not in this feed yet' };
      // The rate must be taken over rows of EVERY status. A view that hides
      // cancellations makes this structurally 0.0% for every org forever, and
      // reads as a healthy book rather than a broken number.
      const cycles = mbPlanCycles(rows);
      const book = mbBook(rows);
      let renewals = 0, canceled = 0;
      book.forEach(r => {
        if (mbIsCanceled(r)) { canceled++; return; }
        const n = mbRenewalsSoFar(r, cycles[mbPlanKey(r)]);
        if (n != null) renewals += n;
      });
      const churn = mbChurnPerCycle(renewals, canceled);
      // NO PERIOD LABEL on the book-level rate, deliberately: a book of weekly,
      // monthly and annual plans has no single cadence, so "per month" would be
      // false for part of it. "Per renewal" is unit-free and true whatever the mix.
      return { value: churn == null ? null : churn * 100, format:'percent',
               colorClass: churn != null && churn > 0.1 ? 'metric-red' : '',
               sub: churn == null ? 'no renewal history to derive' : canceled.toLocaleString() + ' cancellations over ' + (renewals + canceled).toLocaleString() + ' renewal opportunities' };
    } },

                 : 'nobody has cancelled ahead' };

  'tbl-mem-autorenew': { label: 'Auto-Renew By Plan', description: 'Every plan somebody is actually on auto-renew for', note: 'Listed only where on > 0 — an eligible-but-unenrolled plan is a candidate, not a book entry', section: 'memberships',
    reportType: 'memberships', size: 'lg', icon: '🔁', component: 'table', reportTab: 'autorenew',
    transform: rows => {
      const cycles = mbPlanCycles(rows);
      const g = {};
      mbBook(rows).forEach(r => {
        const k = mbPlanKey(r);
        if (!g[k]) g[k] = { n: 0, revenue: 0, renewals: 0, canceled: 0 };
        g[k].n++;
        g[k].revenue += mbPrice(r);
        if (mbIsCanceled(r)) { g[k].canceled++; return; }
        const n = mbRenewalsSoFar(r, cycles[k]);
        if (n != null) g[k].renewals += n;
      });
      const rowsOut = Object.entries(g)
        .sort((a, b) => b[1].revenue - a[1].revenue)
        .slice(0, 12)
        .map(([plan, v]) => {
          const churn = mbChurnPerCycle(v.renewals, v.canceled);
          // EVERY per-plan rate carries its cadence. A weekly plan losing 5% a
          // week and a monthly plan losing 5% a month are not the same thing,
          // and a bare column invites ranking them against each other.
          const cad = mbCadence(cycles[plan]);
          return [plan, v.n.toLocaleString(),
                  '$' + Math.round(v.revenue).toLocaleString(),
                  v.renewals.toLocaleString(),
                  churn == null ? '—' : (churn * 100).toFixed(1) + '%' + (cad ? ' ' + cad : '')];
        });
      // TableWidget takes { columns, data } — a { headers, rows } shape reads
      // `data.data.length` off undefined and unmounts the WHOLE dashboard, not
      // just this tile. Caught by the render check; every spec passed on it.
      return { columns: ['Plan', 'On auto-renew', 'Per cycle', 'Renewals', 'Churn'], data: rowsOut };
    } },

const dataStore = {};
// Failed feeds, keyed by report type. A fetch failure must be visibly
// different from an empty dataset — the 2026-08-10 all-orgs outage rendered
// as $0 everywhere because errors were silently coerced to [].
const fetchFailures = {};
async function fetchReportData(rt, dr) {
  const key = `${rt}:${dr.start}:${dr.end}`;
  if (dataStore[key]) return dataStore[key];
  const qs = new URLSearchParams({ start: dr.start, end: dr.end });
  const url = IS_SHARE
    ? `/share/${SHARE_TOKEN}/data/${rt}?${qs}`
    : `/${ORG_SLUG}/api/data/${rt}?token=${TOKEN}&${qs}`;
  const resp = await fetch(url);
  if (!resp.ok) {
    let detail = `HTTP ${resp.status}`;
    try { const j = await resp.json(); if (j && (j.detail || j.error)) detail = j.detail || j.error; } catch (e) {}
    fetchFailures[rt] = detail;
    return null;  // caller renders empty, but the failure banner names the feed
  }
  const json = await resp.json();
  delete fetchFailures[rt];
  dataStore[key] = json.rows || [];
  return dataStore[key];
}
function clearDataStore() {
  Object.keys(dataStore).forEach(k => delete dataStore[k]);
  Object.keys(fetchFailures).forEach(k => delete fetchFailures[k]);
}

//  EVENT TRACKING
// ═══════════════════════════════════════════════════════
const eventQueue = [];
let flushTimer = null;

// A visit opened from the admin page's "Open Dashboard" link is US, not the
// org — that link carries ?via=admin, and every event from this tab says so,
// so the admin usage metrics can count it apart instead of as adoption.
// Remembered for the tab, because the dashboard rewrites its own URL.
var TRACK_VIA = (function () {
  try {
    if (new URLSearchParams(location.search).get('via') === 'admin') sessionStorage.setItem('rd-via', 'admin');
    return sessionStorage.getItem('rd-via') || null;
  } catch (e) { return null; }
})();

function track(event, props = {}) {
  eventQueue.push({ event, ...props, ...(TRACK_VIA ? { via: TRACK_VIA } : {}), clientTs: new Date().toISOString() });
  if (!flushTimer) {
    flushTimer = setTimeout(flushEvents, 2000); // batch every 2s
  }
}

function flushEvents() {
  flushTimer = null;
  if (!eventQueue.length) return;
  const batch = eventQueue.splice(0);
  fetch(`/${ORG_SLUG}/api/events?token=${TOKEN}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(batch)
  }).catch(() => {}); // fire and forget
}

// Flush on page unload
window.addEventListener('beforeunload', flushEvents);

// ── Click-throughs: which cards send people OUT to a report or to Rec ──
// Records WHERE they went (the report type, or the Rec admin page) and never
// the URL itself: a report link carries the org's access token.
var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function outboundTarget(href) {
  var u; try { u = new URL(href, location.href); } catch (e) { return null; }
  var segs = u.pathname.split('/').filter(Boolean);
  var base = (window._orgMeta && window._orgMeta.reportingBaseUrl) || '';
  var rptHost = ''; try { rptHost = base ? new URL(base).host : ''; } catch (e) {}
  if (rptHost && u.host === rptHost) return { event: 'report_link_clicked', target: segs[1] || '(org landing)' };
  if (/(^|\.)rec\.us$/.test(u.hostname)) {
    return { event: 'rec_link_clicked', target: segs.filter(function (x) { return !UUID_RE.test(x) && x !== 'admin' && x !== 'o'; }).slice(0, 2).join('/') || '(home)' };
  }
  return null;
}
function trackOutbound(href, el) {
  var t = outboundTarget(href); if (!t) return;
  var sec = el && el.closest ? el.closest('[data-section]') : null;
  track(t.event, { target: t.target, section: sec ? sec.getAttribute('data-section') : null });
  flushEvents(); // they are leaving for another tab; do not wait out the 2s batch
}
function openTracked(href, el) { trackOutbound(href, el); window.open(href, '_blank'); }
document.addEventListener('click', function (e) {
  var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
  if (a) trackOutbound(a.getAttribute('href'), a);
}, true);

function ProgressRing({ pct, size = 68 }) {
  const clamped = Math.min(100, Math.max(0, pct));
  const color = clamped >= 66 ? 'var(--green)' : clamped >= 33 ? 'var(--amber)' : 'var(--red)';
  const r = 15.9155;
  const circ = 2 * Math.PI * r;
  return (
    <svg className="progress-ring" viewBox="0 0 36 36" width={size} height={size}>
      <circle cx="18" cy="18" r={r} fill="none" stroke="var(--border)" strokeWidth="3" />
      <circle cx="18" cy="18" r={r} fill="none" stroke={color} strokeWidth="3"
        strokeDasharray={`${clamped} ${100 - clamped}`} strokeDashoffset="25"
        strokeLinecap="round" style={{transition:'stroke-dasharray 0.5s ease'}} />
      <text x="18" y="19.5" textAnchor="middle" fontSize="8" fontWeight="700"
        fontFamily="DM Sans,sans-serif" fill="var(--text-primary)">{Math.round(clamped)}%</text>
    </svg>
  );
}

// ── Prior-period comparison ────────────────────────────────────────
// Prior window mirrors the dashboard's selected timeframe: whole calendar
// month(s) compare to the previous calendar month(s) ("July" vs "June");
// anything else compares to the immediately preceding equal-length window.
function priorWindow(dr) {
  if (!dr || !dr.start || !dr.end) return null;
  try {
    const s = new Date(dr.start + 'T12:00:00'), e = new Date(dr.end + 'T12:00:00');
    if (isNaN(s) || isNaN(e) || e < s) return null;
    const iso = d => d.toISOString().split('T')[0];
    const isMonthStart = s.getDate() === 1;
    const isMonthEnd = e.getDate() === new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate();
    if (isMonthStart && isMonthEnd) {
      const span = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) + 1;
      return { start: iso(new Date(s.getFullYear(), s.getMonth() - span, 1, 12)), end: iso(new Date(s.getFullYear(), s.getMonth(), 0, 12)) };
    }
    const days = Math.round((e - s) / 86400000) + 1;
    const pe = new Date(s); pe.setDate(pe.getDate() - 1);
    const ps = new Date(pe); ps.setDate(ps.getDate() - (days - 1));
    return { start: iso(ps), end: iso(pe) };
  } catch (e) { return null; }
}

function fmtRangeShort(dr) {
  try {
    const s = new Date(dr.start + 'T12:00:00'), e = new Date(dr.end + 'T12:00:00');
    const sm = s.toLocaleDateString('en-US', { month: 'short' }), em = e.toLocaleDateString('en-US', { month: 'short' });
    if (sm === em && s.getFullYear() === e.getFullYear()) return sm + ' ' + s.getDate() + '\u2013' + e.getDate();
    return sm + ' ' + s.getDate() + ' \u2013 ' + em + ' ' + e.getDate();
  } catch (e) { return 'prior period'; }
}

// Window one calendar quarter (3 months) before the current selection.
// A whole-month selection snaps to whole months so a quarter maps cleanly onto
// the previous quarter (Apr 1-Jun 30 -> Jan 1-Mar 31); an arbitrary range just
// shifts back three months preserving the day.
function priorQuarterWindow(dr) {
  if (!dr || !dr.start || !dr.end) return null;
  try {
    const s = new Date(dr.start + 'T12:00:00'), e = new Date(dr.end + 'T12:00:00');
    if (isNaN(s) || isNaN(e) || e < s) return null;
    const iso = d => d.toISOString().split('T')[0];
    const isMonthStart = s.getDate() === 1;
    const isMonthEnd = e.getDate() === new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate();
    if (isMonthStart && isMonthEnd) {
      return { start: iso(new Date(s.getFullYear(), s.getMonth() - 3, 1, 12)),
               end: iso(new Date(e.getFullYear(), e.getMonth() - 2, 0, 12)) };
    }
    return { start: iso(new Date(s.getFullYear(), s.getMonth() - 3, s.getDate(), 12)),
             end: iso(new Date(e.getFullYear(), e.getMonth() - 3, e.getDate(), 12)) };
  } catch (e) { return null; }
}

// Resolve a "Compare To" mode to the window its deltas are measured against.
// 'none' -> no comparison; 'prior-period' -> the immediately preceding
// equal-length window; 'prior-quarter' -> the quarter before.
function comparisonWindow(dr, mode) {
  if (!dr || mode === 'none' || !mode) return null;
  if (mode === 'prior-quarter') return priorQuarterWindow(dr);
  return priorWindow(dr); // 'prior-period' and default
}

// "Q1 2026" when the window is exactly a calendar quarter, else a short range.
function quarterLabel(dr) {
  try {
    const s = new Date(dr.start + 'T12:00:00'), e = new Date(dr.end + 'T12:00:00');
    const isMonthEnd = e.getDate() === new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate();
    const span = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) + 1;
    if (s.getDate() === 1 && s.getMonth() % 3 === 0 && isMonthEnd && span === 3) {
      return 'Q' + (s.getMonth() / 3 + 1) + ' ' + s.getFullYear();
    }
  } catch (e) {}
  return fmtRangeShort(dr);
}

function comparisonLabel(win, mode) {
  if (!win) return '';
  return mode === 'prior-quarter' ? quarterLabel(win) : fmtRangeShort(win);
}

// Delta pill vs the prior window. goodWhenDown flips the color logic for
// metrics where a decrease is the win (refunds).
function DeltaPill({ cur, prev, goodWhenDown, label }) {
  if (prev == null || cur == null || (prev === 0 && cur === 0)) return null;
  const diff = cur - prev;
  if (diff === 0) return <span className="delta-pill flat">{'\u2014'} 0% <span className="dvs">{label}</span></span>;
  const up = diff > 0;
  const pct = prev !== 0 ? Math.round(Math.abs(diff) / Math.abs(prev) * 100) : null;
  const txt = (pct != null && pct <= 999) ? pct + '%' : Math.abs(diff).toLocaleString();
  const good = goodWhenDown ? !up : up;
  return (
    <span className={'delta-pill ' + (good ? 'good' : 'bad')}>
      {up ? '\u25B2 +' : '\u25BC \u2212'}{txt} <span className="dvs">{label}</span>
    </span>
  );
}

function MetricCard({ data, target, prior }) {
  if (!data) return <div className="skeleton skeleton-metric" />;
  const hasTarget = target != null && target > 0;
  const pct = hasTarget ? (data.value / target) * 100 : 0;

  if (hasTarget) {
    return (
      <div className="metric-with-target">
        <div className="metric-left">
          <div className={`metric-value ${data.colorClass || ''}`} style={{fontSize:30}}>{fmt(data.value, data.format)}</div>
          <div className="target-sub">{Math.round(pct)}% of {fmt(target, data.format)} target</div>
          {data.sub && <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>{data.sub}</div>}
          {prior && <div><DeltaPill cur={data.value} prev={prior.value} goodWhenDown={prior.goodWhenDown} label={prior.label} /></div>}
        </div>
        <ProgressRing pct={pct} />
      </div>
    );
  }

  return <div>
    <div className={`metric-value ${data.colorClass || ''}`}>{fmt(data.value, data.format)}</div>
    {data.sub && <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>{data.sub}</div>}
    {prior && <div><DeltaPill cur={data.value} prev={prior.value} goodWhenDown={prior.goodWhenDown} label={prior.label} /></div>}
  </div>;
}

function BarChartWidget({ data, onBarClick }) {
  const ref = useRef(null), chart = useRef(null);
  useEffect(() => {
    if (chart.current) chart.current.destroy();
    if (!ref.current || !data) return;
    const horiz = data.labels.length > 5;
    chart.current = new Chart(ref.current, { type: 'bar',
      data: { labels: data.labels, datasets: [{ data: data.values, backgroundColor: CHART_COLORS.slice(0, data.values.length), borderRadius: 4, maxBarThickness: 40 }] },
      options: { indexAxis: horiz?'y':'x', responsive: true, maintainAspectRatio: false,
        onClick: onBarClick ? (evt, elements) => { if (elements.length > 0) { onBarClick(data.labels[elements[0].index]); } } : undefined,
        onHover: onBarClick ? (evt, elements) => { evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default'; } : undefined,
        plugins: { tooltip: { callbacks: { label: ctx => fmtTooltip(ctx.raw, data.format) + (onBarClick ? '  \u2197 View details' : '') } } },
        // Currency formatting belongs to the VALUE axis only — on a category
        // axis Chart.js passes the tick's index, so formatting it printed
        // "$0"/"$1" instead of GL account names. Thousands keep one decimal
        // ($1.2k) so adjacent ticks never collapse into duplicate labels.
        scales: { x: { grid: { display: !horiz }, ticks: horiz ? { callback: v => data.format==='currency' ? fmtAxisCurrency(v) : v } : {} },
                  y: { grid: { display: horiz }, ticks: horiz ? {} : { callback: v => data.format==='currency' ? fmtAxisCurrency(v) : v } } } }
    });
    return () => { if (chart.current) chart.current.destroy(); };
  }, [data, onBarClick]);
  if (!data) return <div className="skeleton skeleton-chart" />;
  return <div className="chart-container"><canvas ref={ref} /></div>;
}

// ═══════════════════════════════════════════════════════
//  MAP WIDGET (Leaflet)
// ═══════════════════════════════════════════════════════
const geoCache = {};
async function geocode(query) {
  const fullQuery = query.includes(',') ? query : (window._orgGeo ? query + ', ' + window._orgGeo : query);
  if (geoCache[fullQuery]) return geoCache[fullQuery];
  try {
    const resp = await fetch(`/${ORG_SLUG}/api/geocode?token=${TOKEN}&q=${encodeURIComponent(fullQuery)}`);
    const data = await resp.json();
    if (data.lat != null && data.lng != null) { geoCache[fullQuery] = data; return data; }
  } catch(e) { console.warn('[GEO] Error:', fullQuery, e); }
  return null;
}

function MapWidget({ data }) {
  const mapRef = useRef(null);
  const mapInst = useRef(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if (!mapRef.current || !data?.points?.length) return;
    if (mapInst.current) { mapInst.current.remove(); mapInst.current = null; }
    setReady(false);

    const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    // OpenStreetMap tiles: free, no key, and what every rental-report map
    // uses. CARTO's basemaps started demanding an API key (2026-09) and serve
    // an "API KEY REQUIRED" watermark without one. OSM has no dark style, so
    // dark mode inverts the light tiles in CSS (.map-tiles-dark) — the
    // circles sit in a different pane and keep their real colours.
    const map = L.map(mapRef.current, { scrollWheelZoom: false }).setView([39.5, -98.5], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '\u00A9 OpenStreetMap', maxZoom: 18,
      className: isDark ? 'map-tiles-dark' : '',
    }).addTo(map);
    mapInst.current = map;

    (async () => {
      const bounds = [];
      for (let i = 0; i < Math.min(data.points.length, 20); i++) {
        const pt = data.points[i];
        const geo = await geocode(pt.query);
        if (geo) {
          const radius = Math.max(6, Math.min(30, Math.sqrt(pt.count) * 2.5));
          L.circleMarker([geo.lat, geo.lng], {
            radius, fillColor: '#f59e0b', fillOpacity: 0.7, color: '#f59e0b', weight: 1, opacity: 0.9
          }).bindTooltip('<strong>' + pt.label + '</strong><br>' + pt.count.toLocaleString() + ' ' + (data.unit || 'users')).addTo(map);
          bounds.push([geo.lat, geo.lng]);
        }
        if (i < data.points.length - 1) await new Promise(r => setTimeout(r, 500));
      }
      if (bounds.length > 1) map.fitBounds(bounds, { padding: [30, 30] });
      else if (bounds.length === 1) map.setView(bounds[0], 10);
      setReady(true);
      setTimeout(() => map.invalidateSize(), 100);
    })();

    return () => { if (mapInst.current) { mapInst.current.remove(); mapInst.current = null; } };
  }, [data]);

  if (!data) return <div className="skeleton skeleton-chart" />;
  return <div>
    <div ref={mapRef} className="map-container" />
    {!ready && <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4,textAlign:'center'}}>Geocoding locations...</div>}
  </div>;
}

function HeatmapWidget({ data }) {
  if (!data?.grid) return <div className="skeleton skeleton-chart" />;
  const { rows, cols, grid, maxVal } = data;
  const colCount = cols.length + 1; // +1 for row labels
  return (
    <div style={{overflowX:'auto'}}>
      <div className="heatmap-grid" style={{gridTemplateColumns:`50px repeat(${cols.length}, 1fr)`}}>
        <div />
        {cols.map((c,i) => <div key={i} className="heatmap-col-label">{c}</div>)}
        {rows.map((row, ri) => (
          <React.Fragment key={ri}>
            <div className="heatmap-label">{row}</div>
            {grid[ri].map((val, ci) => {
              const intensity = maxVal > 0 ? val / maxVal : 0;
              const bg = val === 0 ? 'var(--bg-surface)' : `rgba(245,158,11,${0.1 + intensity * 0.8})`;
              return <div key={ci} className="heatmap-cell" style={{background:bg}}>{val || ''}</div>;
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

function StreamsChart({ data }) {
  if (!data || !data.streams || !data.streams.length) return <div style={{color:'var(--text-muted)',fontSize:12,padding:16,textAlign:'center'}}>No revenue data for this period</div>;
  var maxAmt = Math.max.apply(null, data.streams.map(function(s){ return s.amount; }).concat([1]));
  var total = data.total || data.streams.reduce(function(s,x){ return s + x.amount; }, 0);
  var baseUrl = (window._orgMeta && window._orgMeta.reportingBaseUrl) || '';
  var hasLinks = baseUrl && window._orgMeta && window._orgMeta.toggles && window._orgMeta.toggles.reportLinks;
  return (
    <div className="streams-wrap">
      {data.streams.map(function(s, i) {
        var pct = total > 0 ? Math.round(s.amount / total * 100) : 0;
        var barW = maxAmt > 0 ? Math.round(s.amount / maxAmt * 100) : 0;
        var href = hasLinks ? baseUrl + '/' + ORG_SLUG + '/' + s.report + '?token=' + TOKEN : null;
        return (
          <div key={i} className="streams-row" onClick={href ? function(e){ openTracked(href, e.currentTarget); } : undefined} title={href ? 'View full ' + s.type + ' report' : s.type}>
            <div className="streams-name">
              <div className="streams-swatch" style={{background:s.color}} />
              {s.type}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div className="streams-bar-track">
                <div className="streams-bar-fill" style={{width:barW+'%',background:s.color,opacity:0.8}} />
              </div>
              <span className="streams-pct">{pct}%</span>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <div className="streams-amt">{'$' + Math.round(s.amount).toLocaleString()}</div>
              {href && <a onClick={function(e){ e.stopPropagation(); openTracked(href, e.currentTarget); }} style={{fontSize:10,fontWeight:600,color:s.color,cursor:'pointer',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:3,textDecoration:'none',opacity:0.85,padding:'2px 6px',borderRadius:4,border:'1px solid ' + s.color + '33',background:s.color + '0d'}}>View →</a>}
            </div>
          </div>
        );
      })}
      <div className="streams-total">
        <div className="streams-total-label">Total</div>
        <div />
        <div className="streams-total-amt">{'$' + Math.round(total).toLocaleString()}</div>
      </div>
    </div>
  );
}

const COMP = {
  streams: StreamsChart, metric: MetricCard, bar: BarChartWidget, donut: DonutChartWidget, line: LineChartWidget, table: TableWidget, map: MapWidget, heatmap: HeatmapWidget };

// Report types arrive one at a time (see the progressive fetch in DashboardApp),
// so a widget is only renderable once every source it reads has landed.
// Multi-source widgets are the reason this isn't just a truthiness check on the
// primary report type — rendering "Revenue by Stream" with three of its five
// feeds in would flash a wrong split before correcting itself.
function widgetReady(def, reportData) {
  if (!reportData[def.reportType]) return false;
  if (def._extraReportTypes) {
    for (const rt of def._extraReportTypes) if (!reportData[rt]) return false;
  }
  return true;
}

// True once every source this widget reads has been refreshed by the current
// batch. Anything still showing last batch's numbers gets dimmed.
function widgetFresh(def, freshRts) {
  if (!freshRts) return true;
  if (!freshRts[def.reportType]) return false;
  if (def._extraReportTypes) {
    for (const rt of def._extraReportTypes) if (!freshRts[rt]) return false;
  }
  return true;
}

// ── Smart cards ──────────────────────────────────────────────────────
// Chart widgets whose transform emits { labels, values, format } can be
// rendered as any of these interchangeably, so the user can flip between them.
// (metric / table / map / heatmap / streams are NOT interchangeable.)
const SWITCHABLE_CHARTS = ['bar', 'donut', 'line'];
const CHART_TYPE_LABEL = { bar: 'Bar', donut: 'Pie', line: 'Line' };
function VizIcon({ type }) {
  if (type === 'bar') return (
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <rect x="2" y="7" width="3" height="7" rx="0.5" /><rect x="6.5" y="3.5" width="3" height="10.5" rx="0.5" /><rect x="11" y="9.5" width="3" height="4.5" rx="0.5" />
    </svg>);
  if (type === 'donut') return (
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5" /><path d="M8 8 L8 2.5 A5.5 5.5 0 0 1 12.9 5.4 Z" fill="currentColor" stroke="none" />
    </svg>);
  return (
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <polyline points="2,12 6,7 9,9.5 14,3.5" />
    </svg>);
}
function VizSwitcher({ current, onSelect }) {
  return (
    <div className="viz-switch" onClick={e => e.stopPropagation()}>
      {SWITCHABLE_CHARTS.map(t => (
        <button key={t} type="button" className={'viz-btn' + (current === t ? ' active' : '')}
          title={CHART_TYPE_LABEL[t] + ' chart'} aria-label={CHART_TYPE_LABEL[t] + ' chart'} aria-pressed={current === t}
          onClick={() => onSelect(t)}>
          <VizIcon type={t} />
        </button>
      ))}
    </div>
  );
}

function WidgetCard({ widgetId, reportData, loading, freshRts, target, onTargetChange, chartType, onChartTypeChange, dateRange, reportingBaseUrl, priorReportData }) {
  const def = W[widgetId]; if (!def) return null;
  // Smart card: a switchable chart widget may be overridden to another chart type.
  const switchable = !!onChartTypeChange && SWITCHABLE_CHARTS.includes(def.component);
  const effComponent = (switchable && chartType && COMP[chartType]) ? chartType : def.component;
  const Comp = COMP[effComponent]; if (!Comp) return null;
  const ready = widgetReady(def, reportData);
  const raw = ready ? reportData[def.reportType] : null;
  const stale = loading && ready && !widgetFresh(def, freshRts);
  // Prior-period value for delta-flagged metric tiles (lazy — appears when
  // the prior window's data arrives; hidden for all-time reports).
  let prior = null;
  if (def.delta && def.component === 'metric' && priorReportData && priorReportData._window && priorReportData[def.reportType] && !ALL_TIME_REPORTS.has(def.reportType)) {
    try {
      const pv = def.transform(priorReportData[def.reportType]);
      if (pv && pv.value != null) prior = { value: pv.value, goodWhenDown: !!def.deltaGoodWhenDown, label: 'vs ' + (priorReportData._label || fmtRangeShort(priorReportData._window)) };
    } catch (e) {}
  }
  // Bespoke period comparison for all-time metrics (e.g. Users & Demographics):
  // the generic path above needs a prior-window fetch that all-time reports
  // don't have, so these tiles compute the prior value from created_at instead.
  if (!prior && def.delta && def.priorValue && def.component === 'metric' && raw) {
    try {
      const pv = def.priorValue(raw);
      if (pv != null && !isNaN(pv)) prior = { value: pv, goodWhenDown: !!def.deltaGoodWhenDown, label: def.deltaLabel || 'vs prior 30d' };
    } catch (e) {}
  }
  const data = raw ? (def._multiSource ? def.transform(raw, reportData) : def.transform(raw)) : null;
  const sizeClass = def.size==='sm'?'widget-sm':def.size==='lg'?'widget-lg':'widget-md';
  const isMetric = def.component === 'metric';
  const [editingTarget, setEditingTarget] = useState(false);
  const [targetInput, setTargetInput] = useState(target || '');

  function saveTarget() {
    const val = parseFloat(targetInput);
    onTargetChange(widgetId, isNaN(val) || val <= 0 ? null : val);
    setEditingTarget(false);
  }
  function clearTarget() { onTargetChange(widgetId, null); setTargetInput(''); setEditingTarget(false); }

  /* The widget's own id on the card below. Added because every `absent:` case
     in the render check that named a data-widget-id was VACUOUS without it — a
     selector that can never match passes on any page, including one still
     rendering the thing it claims is gone. That is the oldest trap in these
     two repos and it was already live here, in the retired-support case. */
  return (
    <div className={`widget-card ${sizeClass}${stale ? ' widget-stale' : ''}`} data-widget-id={widgetId}>
      <div className="widget-header">
        <div>
          <span className="widget-label">{def.label}</span>
          <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2,fontWeight:400}}>
            <span style={{background: ALL_TIME_REPORTS.has(def.reportType) ? '#eff6ff' : '#fffbeb', color: ALL_TIME_REPORTS.has(def.reportType) ? '#2563eb' : '#d97706', padding:'1px 5px',borderRadius:3,fontWeight:600,fontSize:9,marginRight:4}}>{ALL_TIME_REPORTS.has(def.reportType) ? 'All time' : dateRange ? (() => { const f = d => { const p = d.split('-'); return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }; return f(dateRange.start) + ' – ' + f(dateRange.end); })() : ''}</span>
            {def.note}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:4}}>
          {switchable && <VizSwitcher current={effComponent} onSelect={t => onChartTypeChange(widgetId, t)} />}
          {/* A TILE'S DEEP LINK GOES TO THE TAB IT WAS COMPUTED FROM. The
              section header already links to the report, but it lands on the
              report's own default tab — so "Churn Per Renewal" sent a reader to
              a membership list with no churn on it, and they had to know which
              tab to click. Built through RPT_SLUG/RPT_TOKEN, never ORG_SLUG or
              TOKEN: those are THIS dashboard's names for the org and are exactly
              what drifted when Shrewsbury was renamed. */}
          {def.reportTab && reportingBaseUrl && SECTION_REPORT_MAP[def.section] && (
            <a className="widget-report-link"
               href={`${reportingBaseUrl}/${RPT_SLUG()}/${SECTION_REPORT_MAP[def.section]}?token=${RPT_TOKEN()}&tab=${def.reportTab}`}
               target="_blank" rel="noopener noreferrer"
               data-report-tab={def.reportTab}
               title={`Open this in the ${SECTIONS[def.section] ? SECTIONS[def.section].label : ''} report`}>{'\u2197'}</a>
          )}
          {isMetric && <button className="gear-btn" onClick={()=>{setEditingTarget(!editingTarget);setTargetInput(target||'');}} title="Set target">{'\u2699'}</button>}
          <span className="widget-icon">{def.icon}</span>
        </div>
      </div>
      {editingTarget && (
        <div className="target-editor">
          <span className="te-label">Target:</span>
          <input type="number" value={targetInput} onChange={e=>setTargetInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter')saveTarget();}} placeholder="e.g. 50000" autoFocus />
          <button className="btn btn-sm btn-amber" onClick={saveTarget}>Save</button>
          {target && <button className="btn btn-sm" style={{color:'var(--red)'}} onClick={clearTarget}>Clear</button>}
        </div>
      )}
      {loading && !data ? <div className={isMetric?'skeleton skeleton-metric':'skeleton skeleton-chart'} />
        : isMetric ? <MetricCard data={data} target={target} prior={prior} /> : <Comp data={data} onBarClick={
          (effComponent === 'bar' || def.component === 'table') && def.reportType === 'programs' && reportingBaseUrl
            ? (label) => { var u = reportingBaseUrl + '/' + RPT_SLUG() + '/programs?token=' + RPT_TOKEN() + '&tab=revenue&program=' + encodeURIComponent(label); if (dateRange) { u += '&start_date=' + dateRange.start + '&end_date=' + dateRange.end; } openTracked(u, null); }
            : undefined
        } />}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  LIVE WIDGETS
// ═══════════════════════════════════════════════════════
/* "Laurel's Coffee Chart", named for Laurel Rossiter at Shrewsbury, whose
   feedback produced it: "registration day opens and I can literally watch
   people register for stuff and keep track... I don't have that umbrella
   viewpoint that I'm used to having, and I miss it."

   THE DESIGN IS THE RESTRAINT. What she already had was a Metabase card with
   four columns, newest first, no filters and no date range — and it beat a
   seven-tab report for the one question she asks daily. So this widget offers
   a Pause and nothing else. Every instinct to add a filter here should be
   resisted: the reports exist for analysis, this is the thing you leave open.

   IT COUNTS "TODAY" FROM THE FEED, NOT FROM THE BROWSER. The card stamps each
   signup in the ORG's timezone; a viewer in another zone (or a laptop with a
   wrong clock) must not be told a different number from the person sitting in
   the rec centre. The newest row's own date is the day being counted. */
const LIVE_POLL_MS = 60000;
const LIVE_FLASH_MS = 10000;
/* HOW LONG A MEMBER'S FACE STAYS LIT after they scan. Its own constant, not a
   bigger LIVE_FLASH_MS, because that one also governs the registration row
   highlight, the money pop and the timeline marks — and the ask was about the
   faces. MUST EQUAL the `liveFaceIn` duration in the stylesheet: the class is
   removed on this timer, so a shorter value cuts the fade off mid-way and a
   longer one leaves a ring sitting there after the animation has finished.
   Two numbers for one duration in two places is exactly how that drifts, so
   the spec reads the CSS and pins them together. */
const LIVE_FACE_FLASH_MS = 30000;
const LIVE_ROWS = 8;
/* THE PROGRAMS CARD SHOWS MORE THAN THE REGISTRATION LIST, deliberately. Dan:
   "We need to show more programs on the program revenue card, I'd expect to see
   the top, say 10 or so programs." Each row there is a whole program rather
   than one signup, so ten of them is a leaderboard while ten registrations
   would be a wall. */
const LIVE_PROG_ROWS = 10;
const LIVE_DAYS    = 7;

/* THE CHA-CHING. Dan: "every time a person enrolls and pays, play a 'cha-ching'
   sound. mute by default, but add a 'mute' checkbox on the card... Maybe the
   super mario bros coin sound" — then, with a link to it: "this is it".

   IT IS SYNTHESISED, NOT SAMPLED, and that is a decision rather than a
   shortcut. The Artifact/CSP rules aside, an audio FILE here would be a
   redistributed copy of Nintendo's recording sitting in a public repo, and it
   would be one more asset that can 404 on a dashboard people leave open all
   day. The coin is two square-wave notes — B5 then E6, the second held and
   decaying — so the synth IS the sound rather than an impression of it.

   NINE TO PICK FROM, because Dan asked to hear a few and then for five more —
   "a car horn, chicken, cow mooing, sheep baying and foghorn". `coin` is the
   default since he named it; choosing one in the menu plays it, so the menu is
   its own preview and there is no second button that does nothing else. */
const LIVE_CHIMES = [
  ['coin',     'Coin'],
  ['chaching', 'Cha-ching'],
  ['arcade',   'Arcade'],
  ['bell',     'Bell'],
  ['airhorn',  'Airhorn'],
];
const LIVE_CHIME_DEFAULT = 'coin';
/* HOW MANY RING FOR ONE BATCH — AND WHY IT IS NOT THREE ANY MORE. Dan, on a
   registration day: "When an org has a big registration day, I want it to
   sound like a las vegas casino." The cap was three on the argument that a
   dozen overlapping coins is noise. That argument was about LOUDNESS and it is
   answered below by ducking the burst rather than by truncating it — a morning
   where sixty people register is the one morning this card is worth having on,
   and a card that rings three times for it says nothing about the size of the
   day.

   FORTY, and the cap is still real. The point of a constant gap rather than a
   fitted one is that the LENGTH of the ringing is what says how big the batch
   was: one arrival is instant, six is half a second, a full forty is nearly
   four seconds of continuous coins. A cadence that stretched to fill the poll
   window would make four arrivals ring for as long as forty and sound sparse
   doing it. Forty is where it stops: about 200 audio nodes, well under the
   60-second poll, and past it nobody is counting anyway.

   JITTER, because an exactly even stagger is a machine gun and reads as one
   effect rather than as many arrivals. The first ring is deliberately NOT
   jittered: it is the one a person actually reacts to, and delaying it by up
   to 45ms for nothing would only make the card feel less immediate. */
const LIVE_CHIME_MAX = 40;
const LIVE_CHIME_GAP_MS = 90;
const LIVE_CHIME_JITTER_MS = 45;
/* HOW A BURST STAYS AUDIBLE INSTEAD OF CLIPPING. Rings at full gain sum past
   1.0 and the browser hard-clips, which crackles — it sounds broken, not loud.
   Equal perceived loudness would be n^-0.5; this ducks slightly less than that
   ON PURPOSE, so a bigger burst really is a bit louder, which is the whole
   thing being asked for. A batch of ONE is exactly 1.0, so the common case
   sounds identical to before.

   THE `n` IS THE OVERLAP, NOT THE BATCH SIZE, and getting that wrong is what
   makes a big burst inaudible. Forty rings 90ms apart do NOT play together:
   each lasts about 0.7s, so only about eight are ever sounding at once and the
   rest are strictly later. Ducking by forty would divide by five times the
   loudness that is actually there — the biggest morning of the year would ring
   the quietest. So the duck saturates: past the overlap point a longer burst
   is longer, not quieter, which is exactly the relationship wanted.

   AND THE DETUNE IS NOT DECORATION. Identical simultaneous copies of the same
   waveform sum coherently — forty coins scheduled together sound like one
   louder coin, not like forty. Spreading them a few cents apart is what makes
   a burst read as a crowd. A four-step run that resets, and 75 cents at the
   top: under a semitone, so the coin's own interval still sounds in tune. */
const LIVE_CHIME_RING_MS = 700;
const LIVE_CHIME_DUCK = 0.4;
const LIVE_CHIME_DETUNE_STEP = 25;
const LIVE_CHIME_DETUNE_STEPS = 4;
/* ONE MUTE AND ONE SOUND PER CARD, keyed by the card. Dan: "make the
   mute/unmute toggles separate for each widget, some might want to hear sounds
   for a widget and not the others", and then "Ideally I'd be able to set a
   separate sound for each, and hear them going off like it's a las vegas
   casino during busy times".

   THE OLD SINGLE-KEY PREFERENCES ARE DELIBERATELY NOT MIGRATED. They were
   `rec-dash-live-muted` and `rec-dash-live-chime`; carrying them across would
   mean guessing which of three cards the old choice was about, and the value
   in question is "silent", which is also the default every card starts on. So
   the worst case of not migrating is that somebody who had unmuted has to
   untick one box again. */
const LIVE_MUTE_KEY  = card => 'rec-dash-live-muted:' + card;
const LIVE_CHIME_KEY = card => 'rec-dash-live-chime:' + card;

/* ONE AudioContext, built on first use and never before. Constructing one at
   module scope starts a suspended context on every dashboard load including
   every muted one, and some browsers log about it. */
let _liveAudio = null;
function liveAudioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!_liveAudio) { try { _liveAudio = new AC(); } catch (e) { return null; } }
  return _liveAudio;
}
/* THE UNMUTE IS THE GESTURE. Browsers keep a context suspended until the user
   has interacted, so without this the first arrival after unmuting is silent
   and the checkbox reads as broken. Called again on the first pointer or key
   event, because the mute choice persists and a reload arrives with no gesture
   behind it. */
function liveAudioWake() {
  const ctx = liveAudioCtx();
  if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
}
let _liveWokeOnce = false;
function liveAudioWakeOnFirstGesture() {
  if (_liveWokeOnce) return;
  _liveWokeOnce = true;
  const go = () => { liveAudioWake(); };
  window.addEventListener('pointerdown', go, { once: true, passive: true });
  window.addEventListener('keydown', go, { once: true });
}

// A note. Square for the chiptune voices, sine for the bell partials.
/* WHERE A RING GOES, AND HOW FAR IT IS BENT. Both are swapped in around one
   synchronous `play()` call in liveChime and put back afterwards — scheduling
   a voice only queues nodes, it never awaits, so nothing else can run in
   between and the swap cannot leak into another ring. The alternative was a
   third argument threaded through all three primitives and all nine voices,
   for a value every one of them would only ever pass along. */
let _liveOut = null;
let _liveDetune = 0;
function liveOut(ctx) { return _liveOut || ctx.destination; }

function liveTone(ctx, { type, freq, at, dur, gain, decay }) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, at);
  if (_liveDetune) o.detune.setValueAtTime(_liveDetune, at);
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(gain, at + 0.006);
  if (decay) g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  else { g.gain.setValueAtTime(gain, at + dur - 0.01); g.gain.linearRampToValueAtTime(0, at + dur); }
  o.connect(g); g.connect(liveOut(ctx));
  o.start(at); o.stop(at + dur + 0.02);
}

/* ONLY FOUR SOUNDS, and the five that were here are gone. Dan asked for a car
   horn, a chicken, a cow, a sheep and a foghorn, heard them, and asked for them
   out again. The synthesis they needed went with them — a glide, a lowpass, an
   LFO, parallel formant bandpasses and a noise buffer — because none of the
   four chiptune sounds uses any of it and a helper with no callers is the dead
   code this file keeps writing down. `git log` has it if an animal is ever
   wanted back. */
const LIVE_CHIME_VOICES = {
  /* THE COIN. B5 for a beat, then E6 held and decaying — the interval is what
     makes it recognisable, so neither note may be tuned by feel. */
  coin(ctx, t) {
    liveTone(ctx, { type: 'square', freq: 987.77,  at: t,         dur: 0.075, gain: 0.15 });
    liveTone(ctx, { type: 'square', freq: 1318.51, at: t + 0.075, dur: 0.62,  gain: 0.15, decay: true });
  },
  // A till: two bright partials over a short, harder strike.
  chaching(ctx, t) {
    liveTone(ctx, { type: 'square',   freq: 1046.5, at: t,         dur: 0.09, gain: 0.16 });
    liveTone(ctx, { type: 'triangle', freq: 1568.0, at: t + 0.05,  dur: 0.45, gain: 0.14, decay: true });
    liveTone(ctx, { type: 'triangle', freq: 2093.0, at: t + 0.06,  dur: 0.40, gain: 0.07, decay: true });
  },
  arcade(ctx, t) {
    liveTone(ctx, { type: 'triangle', freq: 1046.5, at: t,        dur: 0.08, gain: 0.15 });
    liveTone(ctx, { type: 'triangle', freq: 1318.5, at: t + 0.08, dur: 0.08, gain: 0.15 });
    liveTone(ctx, { type: 'triangle', freq: 1568.0, at: t + 0.16, dur: 0.30, gain: 0.15, decay: true });
  },
  bell(ctx, t) {
    liveTone(ctx, { type: 'sine', freq: 1318.5, at: t, dur: 0.70, gain: 0.18, decay: true });
    liveTone(ctx, { type: 'sine', freq: 2637.0, at: t, dur: 0.35, gain: 0.05, decay: true });
  },
  /* AN AIRHORN. Dan: "add an airhorn sound too."
     
     BUILT FROM THE SAME PRIMITIVE AS THE OTHER FOUR, deliberately. The glide,
     lowpass and noise buffer a "proper" horn would want were deleted from this
     file when the animal sounds went, and reinstating three helpers for one
     voice is how dead code comes back. Stacked SAWTOOTHS get there instead:
     a saw is already a full harmonic series, which is the buzz.
     
     A TWO-TONE HORN IS A MINOR THIRD, and that interval is what makes it read
     as an airhorn rather than as a rude noise — Bb3 against Db4, with the
     octave above adding the cut that carries. Tuned, not felt, for the same
     reason the coin's B5/E6 is.
     
     NO `decay`, unlike the bell: a horn holds flat and stops. An exponential
     tail would make it a synth pad. And the gains are deliberately low — three
     sawtooths sum to far more harmonic energy than two sines, so matching the
     others' 0.15 by eye would make this one voice roughly twice as loud as the
     rest and blow the burst ducking's assumptions. */
  airhorn(ctx, t) {
    liveTone(ctx, { type: 'sawtooth', freq: 233.08, at: t,        dur: 0.52, gain: 0.075 });
    liveTone(ctx, { type: 'sawtooth', freq: 277.18, at: t + 0.02, dur: 0.50, gain: 0.070 });
    liveTone(ctx, { type: 'sawtooth', freq: 466.16, at: t + 0.02, dur: 0.50, gain: 0.045 });
  },
};


/* RING ONCE. Counted on `window.__liveChimeRings` because a browser check has
   no ears and no audio device: "a mute box rendered" passes just as happily on
   a chime wired to the wrong condition, so the render cases assert the COUNT
   moves on a paid arrival and does not move on an unpaid one or under a ticked
   box. */
function liveChime(kind, shape) {
  window.__liveChimeRings = (window.__liveChimeRings || 0) + 1;
  const ctx = liveAudioCtx();
  if (!ctx) return;
  liveAudioWake();
  /* AN UNKNOWN NAME RINGS THE DEFAULT rather than nothing. The choice persists
     in localStorage, so a sound removed from the menu later would otherwise
     leave whoever had it selected with a card that silently never rings — the
     hardest kind of broken to notice, since the whole point is that you are not
     looking at it. */
  const play = LIVE_CHIME_VOICES[kind] || LIVE_CHIME_VOICES[LIVE_CHIME_DEFAULT];
  /* THE LEVEL IS A NODE, NOT A NUMBER PASSED DOWN. Every voice bakes its own
     per-partial gains — the coin's two notes, the foghorn's sub-octave — and
     scaling a burst has to preserve those against each other, so it belongs
     one stage later, on the sum. `finally` puts the bus back even if a voice
     throws, or one broken sound would mute every ring after it. */
  const level = shape && typeof shape.level === 'number' ? shape.level : 1;
  let bus = null;
  if (level !== 1) {
    bus = ctx.createGain();
    bus.gain.setValueAtTime(level, ctx.currentTime);
    bus.connect(ctx.destination);
  }
  _liveOut = bus;
  _liveDetune = (shape && shape.detune) || 0;
  try { play(ctx, ctx.currentTime + 0.01); }
  finally { _liveOut = null; _liveDetune = 0; }
  /* COUNTED ONLY ONCE THE VOICE HAS RETURNED, and this second counter exists
     because the first one cannot do this job. __liveChimeRings is bumped at the
     TOP, before any audio, so the mute and paid-arrival cases hold on a machine
     that can play nothing at all — but that also means a voice which THROWS
     still counts, and a case built on it passes on a broken sound. Found by
     mutation: a deliberately broken `cow` left the ring count at nine and the
     case green. This one only moves when the synthesis actually ran. */
  window.__liveChimeVoiced = (window.__liveChimeVoiced || 0) + 1;
}

/* THE SHAPE OF A BURST, as data — delay, level and detune per ring — so a spec
   can RUN it rather than regex over a forEach that schedules timers. A browser
   has no ears in CI, so the only checkable claim about a burst is its schedule.

   `rnd` is injected for the same reason: a jitter read off Math.random cannot
   be asserted about, and a spec that seeds it can pin the jitter's BOUND
   without pinning a value that will differ every run. */
function liveChimeBurst(n, rnd) {
  const r = typeof rnd === 'function' ? rnd : Math.random;
  const count = Math.max(0, Math.min(n | 0, LIVE_CHIME_MAX));
  if (!count) return [];
  const overlap = Math.min(count, Math.max(1, Math.round(LIVE_CHIME_RING_MS / LIVE_CHIME_GAP_MS)));
  const level = Math.pow(overlap, -LIVE_CHIME_DUCK);
  const out = [];
  for (let i = 0; i < count; i++) {
    // The lead ring is exact and untuned: it is the one somebody reacts to.
    const jitter = i === 0 ? 0 : Math.round((r() * 2 - 1) * LIVE_CHIME_JITTER_MS);
    out.push({
      delay: Math.max(0, i * LIVE_CHIME_GAP_MS + jitter),
      level: level,
      detune: (i % LIVE_CHIME_DETUNE_STEPS) * LIVE_CHIME_DETUNE_STEP,
    });
  }
  return out;
}

/* WHAT RINGS. "enrolls AND PAYS" — so a registration whose money has not
   arrived is silent, which is the same predicate the price colour and the
   revenue figure already read. A cha-ching for an unpaid hold would claim money
   that is not there, out loud. */
function liveChimeWorthy(r) {
  if (liveMarkState(r) === 'unpaid') return false;
  /* A PLAN THAT HAS COLLECTED NOTHING YET IS SILENT. v4 turned those rows
     orange, and keying the chime on the colour would have quietly started
     ringing for registrations where no money arrived. The cha-ching claims
     money OUT LOUD, so it stays on money — the same reason an unpaid hold has
     always been silent. */
  if (!(Number(r['Paid']) > 0) && livePlanOn(r)) return false;
  return true;
}

// Local calendar dates, built from PARTS. `new Date("2026-09-03")` is UTC
// midnight and lands on the previous day west of UTC — the bug this codebase
// and its sibling have both been bitten by.
function liveWindow(days) {
  const t = new Date();
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const end = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - (days - 1));
  return { start: iso(start), end: iso(end) };
}

// The card emits a bare local wall-clock string already converted to the org's
// timezone ("2026-09-03T14:41:48"), so it is READ, never parsed as a Date and
// reformatted — that would re-apply the viewer's zone and shift an evening
// signup onto the wrong day.
function liveDay(ts)  { return String(ts || '').slice(0, 10); }

/* WHICH DAY THE CARD IS SHOWING. It used to be the day of the NEWEST ROW, which
   is right for most of a busy afternoon and wrong every single morning: the feed
   holds seven days, so before the first registration of the day the newest row
   is yesterday evening's, and the card labelled 26 of YESTERDAY's signups
   "signups today". Dan, on Clarkstown at 9:18am: "these enrollments are all from
   YESTERDAY. I should only be seeing today's enrollments."

   SO THE DAY IS THE CALENDAR DAY, from the viewer's own clock and built from
   PARTS — `toISOString()` is UTC and is already tomorrow through the evening
   west of it. The one correction applied: if the feed carries a stamp LATER than
   that, the org is genuinely ahead of the viewer (the card stamps every row in
   the ORG's timezone), and the feed's day wins. A row dated past the viewer's
   today is proof of that; the reverse is not proof of anything, so nothing is
   inferred in the other direction.

   THAT RESIDUAL GAP IS NOW CLOSED ON THE LIGHT FEEDS. It was written down here
   rather than guessed at — a viewer WEST of the org, late in their own day, was
   shown an org-tomorrow that had barely started — and the fix was always going
   to be the card emitting `(NOW() AT TIME ZONE cfg.tz)::date`. Cards 21550 and
   21552 do exactly that, as `Org Today` on every row, so where it is present it
   is the ANSWER and none of the reasoning below applies: Postgres decided the
   day in the org's own timezone and no clock on this machine is consulted.

   The derivation survives underneath it for the wide feeds, which carry no such
   column — and for the case no column can help with, a day whose rows are all
   still to come: an empty feed has nothing to carry `Org Today` on, so the
   viewer's calendar day labels a figure that is zero either way. */
function liveTodayFor(rows, key) {
