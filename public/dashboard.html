<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/public/favicon.ico" type="image/x-icon">
<title>rec.us Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-page: #0a0a0a; --bg-card: #141414; --bg-card-hover: #1a1a1a;
  --bg-surface: #1e1e1e; --bg-modal: #111111;
  --border: #262626; --border-subtle: #1e1e1e;
  --text-primary: #f0f0f0; --text-secondary: #888888; --text-muted: #555555;
  --amber: #f59e0b; --amber-glow: rgba(245,158,11,0.08);
  --blue: #3b82f6; --green: #22c55e; --red: #ef4444; --purple: #8b5cf6;
  --pink: #ec4899; --cyan: #06b6d4;
  --chart-grid: #262626; --chart-text: #888;
  /* The live cards sit in the same grid as everything else and were washed out
     against it (Dan: "they look a bit washed out and don't stand out"). A warm
     tint separates them from the date-filtered cards without a second border
     style — and it is a TOKEN, so the dark and light versions are one decision
     rather than two literals scattered through the rules below. */
  --live-bg: #191510; --live-border: #33291a;
  --font-display: 'DM Sans', sans-serif; --font-body: 'Inter', sans-serif;
}
[data-theme="light"] {
  --bg-page: #f3f4f6; --bg-card: #ffffff; --bg-card-hover: #fafafa;
  --bg-surface: #ffffff; --bg-modal: #ffffff;
  --border: #d4d4d4; --border-subtle: #e8e8e8;
  --text-primary: #111111; --text-secondary: #555555; --text-muted: #999999;
  --amber: #d97706; --amber-glow: rgba(217,119,6,0.08);
  --blue: #2563eb; --green: #16a34a; --red: #dc2626; --purple: #7c3aed;
  --pink: #db2777; --cyan: #0891b2;
  --chart-grid: #e5e5e5; --chart-text: #666;
  --live-bg: #fdf6e8; --live-border: #e7d9b8;
}
[data-theme="light"] .btn { background: #fff; border-color: #d4d4d4; color: #333; }
[data-theme="light"] .btn:hover { background: #f5f5f5; border-color: #bbb; }
[data-theme="light"] .btn-amber { background: #d97706; color: #fff; border-color: #d97706; }
[data-theme="light"] .btn-amber:hover { background: #b45309; }
[data-theme="light"] .btn-quick { background: #fff; border-color: #d4d4d4; color: #666; }
[data-theme="light"] .btn-quick:hover, [data-theme="light"] .btn-quick.active { background: #fffbeb; border-color: #d97706; color: #d97706; }
[data-theme="light"] .date-input { background: #fff; border-color: #d4d4d4; color: #333; }
[data-theme="light"] .dash-header { background: #fff; border-color: #e5e5e5; }
[data-theme="light"] .settings-bar { border-color: #e5e5e5; }
[data-theme="light"] .modal-panel { border-color: #e5e5e5; }
[data-theme="light"] .edit-section-header { background: #f9f9f9; }
[data-theme="light"] .edit-section-header:hover { background: #f0f0f0; }
body { font-family: var(--font-body); background: var(--bg-page); color: var(--text-primary); min-height: 100vh; }

/* Header */
.dash-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px;
  border-bottom: 1px solid var(--border); background: var(--bg-card); position: sticky; top: 0; z-index: 50; }
.dash-header-left { display: flex; align-items: center; gap: 14px; }
.dash-logo { height: 36px; width: auto; max-width: 180px; border-radius: 6px; object-fit: contain; }
.dash-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.dash-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
.dash-header-center { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dash-header-right { display: flex; align-items: center; gap: 8px; }

/* Buttons */
.btn { font-family: var(--font-body); font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); cursor: pointer; transition: all 0.15s; }
.btn:hover { background: #252525; border-color: #333; }
.btn-amber { background: var(--amber); color: #000; border-color: var(--amber); font-weight: 600; }
.btn-amber:hover { background: #d97706; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-quick { background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
  padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; }
.btn-quick:hover, .btn-quick.active { border-color: var(--amber); color: var(--amber); background: var(--amber-glow); }
.date-input { font-family: var(--font-body); font-size: 13px; padding: 6px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); outline: none; }
.date-input:focus { border-color: var(--amber); }

/* Compare To dropdown */
.cmp-dd { position: relative; display: inline-block; }
.cmp-dd-menu { position: absolute; top: calc(100% + 5px); left: 0; z-index: 60; min-width: 230px;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.35); }
.cmp-dd-item { display: block; width: 100%; text-align: left; background: transparent; border: none;
  color: var(--text-primary); padding: 8px 26px 8px 10px; border-radius: 6px; cursor: pointer; position: relative; }
.cmp-dd-item:hover:not(.disabled) { background: var(--amber-glow); }
.cmp-dd-item.active .cmp-dd-item-label { color: var(--amber); }
.cmp-dd-item.disabled { opacity: 0.45; cursor: not-allowed; }
.cmp-dd-item-label { display: block; font-size: 13px; font-weight: 600; }
.cmp-dd-item-sub { display: block; font-size: 10px; color: var(--text-muted); margin-top: 1px; }
.cmp-dd-check { position: absolute; right: 9px; top: 9px; color: var(--amber); font-size: 12px; }

/* Section */
.dashboard-section { padding: 0 24px; margin-bottom: 8px; }
.section-header { display: flex; align-items: center; gap: 12px; padding: 20px 0 12px 0; }
.section-icon { font-size: 22px; }
.section-label { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.section-line { flex: 1; height: 1px; background: var(--border); }
.section-badge { font-size: 10px; color: var(--text-muted); padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; }
/* The count doubles as the way into this section's widget list. It has to LOOK
   like a control at rest — a hover-only affordance is the reason the pencil on
   the Fast Track report went unnoticed for a release. */
.section-badge-btn { font-family: var(--font-body); background: var(--bg-surface); cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px; transition: color .15s, border-color .15s, background .15s; }
.section-badge-btn .sb-pencil { opacity: .75; font-size: 9px; }
.section-badge-btn:hover { color: var(--text-primary); border-color: var(--text-muted); background: var(--bg-elevated, var(--bg-surface)); }
.section-badge-btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Widget Grid */

.kpi-strip { display: flex; gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
.kpi-strip-item { flex: 1; background: var(--bg-surface); padding: 14px 18px; text-align: center; min-width: 0; }
.kpi-strip-item:first-child { border-radius: 10px 0 0 10px; }
.kpi-strip-item:last-child { border-radius: 0 10px 10px 0; }
.kpi-strip-value { display: block; font-size: 26px; font-weight: 700; color: var(--text-primary); font-family: var(--font-display); letter-spacing: -0.02em; }
.kpi-strip-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
.kpi-strip-note { display: block; font-size: 10px; color: var(--text-muted); margin-top: 2px; }
@media (max-width: 600px) { .kpi-strip { flex-wrap: wrap; } .kpi-strip-item { flex: 1 1 45%; } .kpi-strip-value { font-size: 20px; } }
@media print { .kpi-strip { break-inside: avoid; } }
.widget-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
/* ── Live Widgets ────────────────────────────────────────────────────────
   Everything here is themed through the same tokens as the rest of the
   dashboard, so the card reads the same in light and dark. The one literal
   colour is the live green, which has to mean "live" in both. */
/* THE TINT NEEDS THE COMPOUND SELECTOR, and this is a cascade collision, not a
   style preference: `.widget-card` sets `background: var(--bg-card)` a hundred
   lines BELOW this block, and at equal specificity the later rule wins — so a
   bare `.live-card` background is silently overridden and the cards render
   exactly as washed-out as before. `.widget-card.live-card` (0,2,0) outranks it
   whatever the order. Caught by the render check comparing the two computed
   backgrounds; no source assertion would have noticed. */
.live-card { display: flex; flex-direction: column; }
.widget-card.live-card { background: var(--live-bg); border-color: var(--live-border); }
.widget-card.live-card:hover { border-color: var(--live-border); }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #16a34a;
            box-shadow: 0 0 0 3px rgba(22,163,74,.16); margin-right: 5px; vertical-align: middle; }
@media (prefers-reduced-motion: no-preference) {
  .live-dot { animation: livePulse 2.4s ease-in-out infinite; }
  @keyframes livePulse { 0%,100% { box-shadow: 0 0 0 3px rgba(22,163,74,.16); } 50% { box-shadow: 0 0 0 6px rgba(22,163,74,.05); } }
}
.live-chip { background: rgba(22,163,74,.12); color: #16a34a; padding: 1px 5px; border-radius: 3px;
             font-weight: 600; font-size: 9px; margin-right: 4px; }
.live-pause { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-muted); cursor: pointer; }
.live-controls { display: flex; align-items: center; gap: 8px; }
.live-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; font-weight: 400; }
/* REFRESH NOW. Dan: "add a manual refresh button on both these live cards in
   case I don't want to wait every minute." It is the SAME fetch the poll runs,
   so both cards move together — there is one feed, and a button that refreshed
   half the pair would be the two-cards-disagree bug this section was built to
   avoid. Disabled while a fetch is in flight, so an impatient double-click
   cannot queue two. */
.live-refresh { background: transparent; border: 1px solid var(--border); color: var(--text-muted);
                border-radius: 5px; width: 20px; height: 20px; line-height: 1; font-size: 12px;
                cursor: pointer; padding: 0; display: inline-flex; align-items: center;
                justify-content: center; transition: color .15s, border-color .15s; }
.live-refresh:hover:not(:disabled) { color: var(--green); border-color: var(--green); }
.live-refresh:disabled { opacity: .45; cursor: default; }
/* THE SOUND MENU. Styled explicitly rather than left as a native select,
   because a default control renders with the OS chrome and the OS's own light
   background — which on the dark theme is a white box in a tinted card, the
   same collision the season menu in the reporting project shipped with. */
.live-chime-pick { background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);
                   border-radius: 5px; height: 20px; font-size: 10px; font-family: inherit;
                   padding: 0 4px; cursor: pointer; max-width: 96px; }
.live-chime-pick:hover { color: var(--green); border-color: var(--green); }
@media (prefers-reduced-motion: no-preference) {
  .live-refresh:disabled { animation: liveSpin 0.9s linear infinite; }
  @keyframes liveSpin { to { transform: rotate(360deg); } }
}
/* THE BIG LINE HAD NO RULE AT ALL, which is why it read "9across 5" — two
   inline elements with nothing between them. Dan: "fix the spacing". A flex
   gap, not a literal space in the markup, so the number and its caption cannot
   drift apart again. */
.live-big { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 6px; flex-wrap: wrap; }
.live-big strong { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1;
                   color: var(--text-primary); font-variant-numeric: tabular-nums; }
.live-big span { font-size: 11px; color: var(--text-muted); }
.live-count { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 2px; }
.live-count .live-n { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1;
                      color: var(--text-primary); font-variant-numeric: tabular-nums; }
.live-count .live-u { font-size: 11px; color: var(--text-muted); }
/* THE TIMELINE. One lane across the last seven days; every mark is one
   registration at its own minute, and a paid one carries a $. Marks are
   absolutely placed, so adding one costs no layout anywhere else on the card. */
.live-timeline { position: relative; height: 42px; margin: 10px 0 22px;
                 border-bottom: 1px solid var(--border); }
.live-timeline .lt-day { position: absolute; top: 0; bottom: 0; }
.live-timeline .lt-day i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border-subtle); }
.live-timeline .lt-day em { position: absolute; bottom: -14px; left: 3px; font-style: normal;
                            font-size: 8.5px; letter-spacing: .04em; color: var(--text-muted); white-space: nowrap; }
.live-timeline .lt-day.today em { color: #16a34a; font-weight: 700; }
/* NOW is a real edge on this card, so it is drawn. Without it the last day
   reads as empty rather than as not-yet-happened. */
.live-timeline .lt-now { position: absolute; top: 0; bottom: 0; width: 1px; background: #16a34a; opacity: .5; }
/* THREE PAYMENT STATES, AS DOTS. Dan: "change the dollar signs (yeah I loved
   it too) to a green dot for paid, and an orange dot for a partial
   payment/payment plan (you had a grey dot right now)". Colour is the only
   difference, so all three keep the same size and shape — a dot that also
   changed shape would read as a different KIND of thing rather than the same
   registration at a different stage. The legend under the lane names them,
   because a three-colour code with nothing explaining it is a puzzle. */
.live-timeline .lt-mark { position: absolute; width: 9px; height: 9px; margin-left: -4px;
                          border-radius: 50%; background: var(--border); }
.live-timeline .lt-mark.paid { background: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,.18); }
.live-timeline .lt-mark.part { background: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.20); }
/* THE LEGEND SITS BELOW THE HOUR LABELS, not on top of them. The tick labels
   are absolutely placed at `bottom: -14px` — OUTSIDE the timeline's own box —
   so a legend pulled up under it lands in the same 14 pixels and the two read
   as one cramped row (Dan: "Some spacing issues on the chat legend"). The
   timeline reserves that space in its margin now and the legend starts after
   it. */
.live-legend { display: flex; gap: 14px; align-items: center; font-size: 9.5px;
               color: var(--text-muted); margin: 0 0 12px; }
.live-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
                 margin-right: 4px; vertical-align: middle; background: var(--border); }
.live-legend .lg-paid i { background: #16a34a; }
.live-legend .lg-part i { background: #f59e0b; }
@media (prefers-reduced-motion: no-preference) {
  .live-timeline .lt-mark.fresh { animation: liveMarkIn 10s ease-out both; }
  @keyframes liveMarkIn {
    0%   { transform: scale(2.2); }
    8%   { transform: scale(1); }
    100% { transform: scale(1); }
  }
}
/* FIXED COLUMNS. The rows change under the reader every minute, so natural
   widths meant every poll re-measured the table and the columns jumped. Only
   the section flexes; everything else is a fixed track. */
.live-table { width: 100%; table-layout: fixed; border-collapse: collapse; margin-top: 4px; }
.live-table th { text-align: left; font-size: 9px; font-weight: 700; letter-spacing: .06em;
                 text-transform: uppercase; color: var(--text-muted);
                 padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
.live-table td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--border-subtle);
                 font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-table tr:last-child td { border-bottom: 0; }
.live-table .lt { width: 72px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.live-table .ln { width: 27%; font-weight: 600; color: var(--text-primary); }
.live-table .lp { width: 24%; color: var(--text-secondary); }
.live-table .ls { color: var(--text-secondary); }
.live-table .lm { width: 62px; padding-right: 0; text-align: right;
                  font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-primary); }
/* Paid green, part-paid orange — the same two colours as the dots in the lane,
   because they are saying the same thing about the same registration. */
.live-table .lm.live-paid { color: #16a34a; }
.live-table .lm.live-part { color: #f59e0b; }
.live-table th.lm { text-align: right; }
/* THE PROGRAMS CARD REUSES THIS TABLE WITH A MUCH LONGER MONEY COLUMN, and 62px
   was sized for the registrations card's bare price. Dan: "look at the
   alignment on the headers and revenue section" — with `table-layout: fixed`
   the declared width is honoured, so a 15-character nowrap header ("PROGRAM
   REVENUE") simply overflowed the card's right edge, and the "of $X charged"
   sub-line was clipped at 62px. Widening it here rather than on `.live-table`
   leaves the registrations card, whose column really is that narrow, alone. */
.live-table-progs .lm { width: 116px; }
.live-table-progs .lm .lm-sub { font-size: 9px; color: #f59e0b; font-weight: 400;
                                white-space: nowrap; line-height: 1.35; margin-top: 1px; }

/* A NEW REGISTRATION ANNOUNCES ITSELF, then stops. Dan: "the new one(s) pop on
   the top, highlighted, then the highlighting fades after 10 seconds or so."
   The fade is the ANIMATION's job and the class comes off on a timer, so a
   later re-render cannot replay it on a row that is no longer news. */
@media (prefers-reduced-motion: no-preference) {
  .live-table tr.live-new td { animation: liveArrive 10s ease-out both; }
  @keyframes liveArrive {
    0%   { background: rgba(22,163,74,.28); transform: translateY(-4px); }
    6%   { background: rgba(22,163,74,.28); transform: translateY(0); }
    100% { background: rgba(22,163,74,0);   transform: translateY(0); }
  }
}
/* Reduced motion still gets the signal, just without the movement. */
@media (prefers-reduced-motion: reduce) {
  .live-table tr.live-new td { background: rgba(22,163,74,.16); }
}

/* THE BOLT HAS A PULSE. Dan: "animate the lightning bolt or something, make it
   seem more 'alive'. Doesn't feel like it's doing anything." It is the only
   thing on the card that moves between registrations, so it is what says the
   widget is still watching. Slow and low-contrast on purpose — this sits on a
   dashboard somebody leaves open, and a hard blink at 60-second intervals is
   an irritation, not a signal. */
.live-bolt { display: inline-block; transform-origin: 50% 60%; }
@media (prefers-reduced-motion: no-preference) {
  .live-bolt { animation: liveBolt 2.8s ease-in-out infinite; }
  @keyframes liveBolt {
    /* Never fully at rest. It used to sit at .55 for two of every three
       seconds, so a still frame — or a glance — read as a dead icon: Dan saw
       one bolt bright and the other faint and reported the second as not
       animating. Both were running; the flat stretch is what made it look
       otherwise, so the baseline now drifts and the flicker is stronger. */
    0%, 100%      { opacity: .62; transform: scale(1); }
    30%           { opacity: .78; transform: scale(1.04); }
    62%           { opacity: .62; transform: scale(1); }
    68%           { opacity: 1;   transform: scale(1.22); }
    74%           { opacity: .72; transform: scale(1.02); }
    80%           { opacity: 1;   transform: scale(1.12); }
    88%           { opacity: .7;  transform: scale(1); }
  }
}
/* MONEY LANDING IS THE EVENT on the programs card, so the figure itself moves
   and says how much arrived. Dan: "the card on the right pulses with more
   revenue for that program." The delta comes from the same arrival diff the
   row highlight uses, so the two cannot disagree about what just happened. */
.live-bump { display: inline-block; margin-left: 5px; font-size: 9px; font-weight: 700; color: #16a34a; }
/* +N: this row covers more sections than the one its link opens. */
.live-more { display: inline-block; margin-left: 4px; font-size: 9px; font-weight: 700;
             color: var(--text-muted); vertical-align: 1px; }
@media (prefers-reduced-motion: no-preference) {
  /* THE POP MOVES THE FIGURE; IT DOES NOT RECOLOUR IT. It used to animate
     `color` to green, which overrode the payment-state ink for ten seconds —
     so a brand-new UNPAID price rendered green, saying the money had arrived
     when it had not. Caught by the render case that reads the computed colour
     of each state. Scale only now. */
  .live-table tr.live-new .lm { animation: liveMoneyPop 10s ease-out both; }
  @keyframes liveMoneyPop {
    0%  { transform: scale(1.28); }
    7%  { transform: scale(1); }
    100%{ transform: scale(1); }
  }
}

/* A link into Rec. Underlined on hover only: a column of eight underlined
   names reads as a wall of links rather than a list of people. */
.live-table tr.live-daybreak td { border-top: 1px solid var(--border); }
.live-link { color: inherit; text-decoration: none; }
.live-link:hover { text-decoration: underline; color: var(--amber); }
.live-table .ls .live-link:hover { color: var(--amber); }
.live-foot { margin-top: 8px; font-size: 10px; color: var(--text-muted); }
@media (max-width: 1100px) { .widget-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 800px) { .widget-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .widget-grid { grid-template-columns: 1fr; } }

/* Widget Cards */
.widget-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px;
  padding: 20px; position: relative; transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s; }
.widget-card:hover { transform: translateY(-2px); border-color: var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.widget-sm { grid-column: span 1; }
.widget-md { grid-column: span 2; min-height: 300px; }
.widget-lg { grid-column: span 4; min-height: 200px; }
@media (max-width: 500px) { .widget-md, .widget-lg { grid-column: span 1; } }

/* Table widget */
.widget-table { overflow-x: auto; max-height: 320px; overflow-y: auto; }
.widget-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
.widget-table th { text-align: left; padding: 6px 10px; font-size: 10px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-card); }
.widget-table td { padding: 5px 10px; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); }
.widget-table tr:hover td { background: var(--bg-card-hover); }
.widget-table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* Target / Goal */
.metric-with-target { display: flex; align-items: center; gap: 16px; }
.metric-with-target .metric-left { flex: 1; }
.progress-ring { width: 68px; height: 68px; flex-shrink: 0; }
.target-pct { font-family: var(--font-display); font-size: 14px; font-weight: 700; }
.target-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.target-editor { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; padding: 8px 10px;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; }
.target-editor input { font-family: var(--font-body); font-size: 13px; width: 100px; padding: 4px 8px;
  border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--text-primary); outline: none; }
.target-editor input:focus { border-color: var(--amber); }
.target-editor .te-label { font-size: 11px; color: var(--text-secondary); }
.gear-btn { background: none; border: none; cursor: pointer; font-size: 13px; opacity: 0.3; padding: 2px;
  transition: opacity 0.15s; color: var(--text-secondary); }
.gear-btn:hover { opacity: 0.8; }
.widget-card:hover .gear-btn { opacity: 0.5; }
/* The tile's own link into the report tab it was computed from. Deliberately
   NOT hover-only: a control nobody can find is a control that does not exist,
   and the bug report for it arrives as a feature request. */
.widget-report-link { text-decoration: none; font-size: 12px; opacity: 0.45; padding: 2px;
  transition: opacity 0.15s; color: var(--text-secondary); line-height: 1; }
.widget-report-link:hover { opacity: 1; }
.widget-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.widget-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; letter-spacing: 0.02em; }
.widget-icon { font-size: 16px; opacity: 0.7; }
/* Smart-card visualization switcher — lets a chart widget flip between bar/pie/line.
   Low-opacity until card hover (same discoverability pattern as .gear-btn). */
.viz-switch { display: inline-flex; gap: 2px; opacity: 0.4; transition: opacity 0.15s; }
.widget-card:hover .viz-switch, .viz-switch:focus-within { opacity: 1; }
.viz-btn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 20px;
  padding: 0; border: none; background: none; border-radius: 4px; cursor: pointer; color: var(--text-muted, #94a3b8); }
.viz-btn:hover { color: var(--text-secondary, #334155); background: rgba(127,127,127,0.14); }
.viz-btn.active { color: var(--amber, #f59e0b); background: rgba(245,158,11,0.14); }
.viz-btn svg { width: 14px; height: 14px; display: block; }

/* Metric */
.metric-value { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1.1; margin-top: 8px; letter-spacing: -0.02em; }
.metric-green { color: var(--green); }
.metric-red { color: var(--red); }
.metric-amber { color: var(--amber); }
/* ── Prior-period delta pill ── */
.delta-pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; animation: pillIn .25s ease; }
.delta-pill.good { background: rgba(34,197,94,.14); color: var(--green); }
.delta-pill.bad  { background: rgba(239,68,68,.13); color: var(--red); }
.delta-pill.flat { background: rgba(148,163,184,.15); color: var(--text-muted); }
.delta-pill .dvs { font-weight: 500; opacity: .75; }
@keyframes pillIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

/* ── Tabs (format borrowed from rental-report's g-tabs) ── */
.g-tabs { display: flex; gap: 0; margin: 0; padding: 0 24px; border-bottom: 2px solid var(--border); flex-wrap: wrap; }
.g-tab { padding: 11px 20px; font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer;
  border: none; border-bottom: 2px solid transparent; margin-bottom: -2px; background: none;
  font-family: var(--font-body); display: flex; align-items: center; gap: 7px; transition: color 0.15s; }
.g-tab:hover { color: var(--text-primary); }
.g-tab.active { color: var(--amber); border-bottom-color: var(--amber); }
.g-tab .tab-count { font-size: 10px; font-weight: 700; background: var(--amber); color: #000; border-radius: 9px; padding: 1px 7px; }
.g-tab .tab-alert { font-size: 10px; font-weight: 800; background: #ef4444; color: #fff; border-radius: 9px;
  min-width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
  box-shadow: 0 0 0 2px var(--bg-main, transparent); }

/* ── Support Inbox ── */
.inbox-wrap { display: grid; grid-template-columns: 340px 1fr; gap: 14px; min-height: 480px; }
@media (max-width: 900px) { .inbox-wrap { grid-template-columns: 1fr; } }
.inbox-list { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; overflow-y: auto; max-height: 640px; }
.inbox-item { padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: background 0.12s; }
.inbox-item:hover { background: var(--bg-hover, rgba(128,128,128,0.06)); }
.inbox-item.selected { background: var(--amber-glow); border-left: 3px solid var(--amber); padding-left: 11px; }
.inbox-item .ii-top { display: flex; align-items: center; gap: 6px; }
.inbox-item .ii-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.inbox-item .ii-name { font-size: 12.5px; font-weight: 700; color: var(--text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inbox-item .ii-time { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
.inbox-item .ii-subject { font-size: 12px; font-weight: 600; color: var(--text-primary); margin: 3px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inbox-item .ii-preview { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inbox-item .ii-chips { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.ii-chip { font-size: 9.5px; font-weight: 600; padding: 1.5px 7px; border-radius: 8px; background: rgba(128,128,128,0.12); color: var(--text-secondary); }
.ii-chip.ai { background: rgba(20,184,166,0.15); color: #14b8a6; }
.ii-chip.esc { background: rgba(245,158,11,0.15); color: var(--amber); }
.ii-chip.org { background: rgba(59,130,246,0.15); color: #3b82f6; }
.ii-chip.done { background: rgba(34,197,94,0.15); color: var(--green); }
.status-menu { position: absolute; top: 100%; right: 0; margin-top: 6px; background: var(--bg-modal); border: 1px solid var(--border);
  border-radius: 10px; padding: 6px; width: 250px; z-index: 60; box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
.status-menu button { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; background: none; border: none;
  border-radius: 7px; padding: 9px 10px; cursor: pointer; font-family: var(--font-body); color: var(--text-primary); font-size: 12px; }
.status-menu button:hover { background: rgba(128,128,128,0.1); }
.status-menu .sm-sub { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
.inbox-thread { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; display: flex; flex-direction: column; max-height: 640px; }
.thread-head { padding: 14px 18px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: flex-start; gap: 12px; }
.thread-head .th-subject { font-size: 15px; font-weight: 700; color: var(--text-primary); }
.thread-head .th-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.thread-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
.msg { max-width: 82%; margin-bottom: 14px; }
.msg .msg-meta { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
.msg .msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 12.5px; line-height: 1.55; color: var(--text-primary); white-space: pre-wrap; word-break: break-word; }
.msg.resident .msg-bubble { background: rgba(128,128,128,0.10); border: 1px solid var(--border-subtle); border-top-left-radius: 4px; }
.msg.ai { margin-left: auto; }
.msg.ai .msg-meta { justify-content: flex-end; }
.msg.ai .msg-bubble { background: rgba(20,184,166,0.10); border: 1px solid rgba(20,184,166,0.25); border-top-right-radius: 4px; }
.msg.agent { margin-left: auto; }
.msg.agent .msg-meta { justify-content: flex-end; }
.msg.agent .msg-bubble { background: var(--amber-glow); border: 1px solid rgba(245,158,11,0.3); border-top-right-radius: 4px; }
.msg.note { margin-left: auto; }
.msg.note .msg-meta { justify-content: flex-end; }
.msg.note .msg-bubble { background: transparent; border: 1.5px dashed var(--border); color: var(--text-secondary); font-style: italic; }
.msg-role-badge { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 1px 6px; border-radius: 6px; }
.msg-role-badge.ai { background: rgba(20,184,166,0.15); color: #14b8a6; }
.msg-role-badge.agent { background: var(--amber-glow); color: var(--amber); }
.msg-role-badge.note { background: rgba(128,128,128,0.15); color: var(--text-muted); }
/* Fixed height (not % of card): a %-height canvas inside an auto-sized grid row
   creates a resize feedback loop with Chart.js and the row grows unbounded. */
.chart-container { position: relative; width: 100%; height: 240px; }

/* Skeleton */
.skeleton { background: linear-gradient(90deg, var(--bg-surface) 25%, #222 50%, var(--bg-surface) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
[data-theme="light"] .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%); background-size: 200% 100%; }
[data-theme="light"] .widget-card.widget-stale { opacity: 0.5; }
.skeleton-metric { height: 48px; width: 140px; margin-top: 12px; }
.skeleton-chart { height: 200px; width: 100%; margin-top: 12px; }

/* Stale-data dim on date change. Applied per widget, not to the whole board:
   report types land one at a time, so a widget stops being dimmed as soon as
   its own data is refreshed rather than waiting on the slowest query. */
.widget-card.widget-stale { opacity: 0.4; pointer-events: none; transition: opacity 0.2s; }
.loading-bar { height: 3px; background: var(--bg-surface); overflow: hidden; }
.loading-bar.active .loading-bar-inner { animation: loadSlide 1.2s ease-in-out infinite; }
/* THE INNER BAR ONLY EXISTS WHILE LOADING. It carried a background and a 30%
   width unconditionally and only the ANIMATION was gated, so once a load
   finished the page kept a static amber stub sitting under the header — which
   reads as a progress bar stuck at 30%. Dan: "spinning forever, top bar never
   stops." It had already stopped; that was the problem. */
.loading-bar-inner { height: 100%; width: 30%; background: var(--amber); border-radius: 2px; display: none; }
.loading-bar.active .loading-bar-inner { display: block; }
@keyframes loadSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(430%); } }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
  display: flex; justify-content: flex-end; backdrop-filter: blur(2px); }
.modal-panel { width: 560px; max-width: 92vw; background: var(--bg-modal); border-left: 1px solid var(--border);
  height: 100vh; overflow-y: auto; animation: slideIn 0.2s ease-out; }
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-modal); z-index: 5; }
.modal-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.modal-close { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 20px; padding: 4px; }
.modal-close:hover { color: var(--text-primary); }
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px;
  justify-content: flex-end; position: sticky; bottom: 0; background: var(--bg-modal); }

/* Modal section blocks */
.edit-section { margin-bottom: 20px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.edit-section-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  background: var(--bg-surface); cursor: pointer; user-select: none; }
.edit-section-header:hover { background: #252525; }
.edit-section-title { font-size: 14px; font-weight: 600; flex: 1; }
.edit-section-body { padding: 10px 14px; }
.widget-list-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border-subtle); margin-bottom: 5px; background: var(--bg-card); }
.widget-list-item:hover { border-color: var(--border); }
.widget-list-icon { font-size: 16px; flex-shrink: 0; }
.widget-list-info { flex: 1; min-width: 0; }
.widget-list-name { font-size: 13px; font-weight: 500; }
.widget-list-desc { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.add-section-btn { display: flex; align-items: center; gap: 10px; padding: 14px; border: 2px dashed var(--border);
  border-radius: 10px; cursor: pointer; width: 100%; background: transparent; color: var(--text-secondary);
  font-size: 13px; font-family: var(--font-body); transition: all 0.15s; }
.add-section-btn:hover { border-color: var(--amber); color: var(--amber); }
.mini-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.08em; margin: 10px 0 6px; }

/* Template Chooser */
.template-overlay { position: fixed; inset: 0; background: var(--bg-page); z-index: 200;
  display: flex; align-items: center; justify-content: center; }
.template-container { max-width: 900px; width: 90%; text-align: center; }
.template-heading { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.template-sub { color: var(--text-secondary); margin-bottom: 40px; font-size: 15px; }
.template-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 700px) { .template-grid { grid-template-columns: 1fr; } }
.template-card { background: var(--bg-card); border: 2px solid var(--border); border-radius: 14px;
  padding: 28px 20px; cursor: pointer; transition: all 0.2s; text-align: center; }
.template-card:hover { border-color: var(--amber); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
.template-card-icon { font-size: 36px; margin-bottom: 12px; }
.template-card-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.template-card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

.settings-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 24px;
  font-size: 11px; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle); }
.cache-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
/* Map widget */
.map-container { height: 280px; border-radius: 8px; overflow: hidden; z-index: 1; position: relative; }
.map-container .leaflet-control-attribution { font-size: 9px; }

/* Heatmap widget */
.heatmap-grid { display: grid; gap: 2px; font-size: 10px; }
.heatmap-cell { border-radius: 3px; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: var(--text-muted); transition: all 0.15s; min-height: 24px; }
.heatmap-cell:hover { color: var(--text-primary); transform: scale(1.08); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.heatmap-label { font-size: 10px; color: var(--text-muted); display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; }
.heatmap-col-label { font-size: 9px; color: var(--text-muted); text-align: center; }
@keyframes spin { to { transform: rotate(360deg); } }
@media print {
  body { background: #fff !important; color: #000 !important; }
  .dash-header { position: static !important; border: none !important; }
  .settings-bar, .loading-bar, .section-badge, .btn, .btn-quick, .date-input { display: none !important; }
  .widget-card { break-inside: avoid; box-shadow: none !important; border: 1px solid #ddd !important; }
  .dashboard-section { break-inside: avoid; }
}
.print-header .dash-header-center, .print-header .dash-header-right { display: none !important; }
/* ── Revenue Streams Widget ── */
.streams-wrap { border-radius: 8px; padding: 0; }
.streams-row { display: grid; grid-template-columns: 140px 1fr 120px; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
.streams-row:hover { background: var(--hover); }
.streams-row:last-of-type { border-bottom: none; }
.streams-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.streams-name { font-size: 12px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.streams-bar-track { flex: 1; height: 18px; background: var(--border); border-radius: 3px; overflow: hidden; }
.streams-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.streams-pct { font-size: 11px; color: var(--text-muted); min-width: 32px; text-align: right; }
.streams-amt { font-size: 13px; font-weight: 600; color: var(--text-primary); text-align: right; font-variant-numeric: tabular-nums; }
.streams-total { display: grid; grid-template-columns: 140px 1fr 120px; align-items: center; gap: 10px; padding: 8px 12px; border-top: 2px solid var(--text-muted); margin-top: 2px; }
.streams-total-label { font-size: 12px; font-weight: 600; color: var(--text-muted); padding-left: 18px; }
.streams-total-amt { font-size: 14px; font-weight: 700; color: var(--text-primary); text-align: right; font-variant-numeric: tabular-nums; }
.streams-link-icon { font-size: 11px; color: var(--text-muted); margin-left: auto; opacity: 0; transition: opacity 0.15s; }
.streams-row:hover .streams-link-icon { opacity: 1; }
</style>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token') || '';
const _pathParts = window.location.pathname.replace(/^\//, '').split('/');
const IS_SHARE = _pathParts[0] === 'share';
const SHARE_TOKEN = IS_SHARE ? _pathParts[1] : null;
const ORG_SLUG = IS_SHARE ? '' : _pathParts[0];
/* ORG_SLUG and TOKEN are this dashboard's names for the organisation. rental-report
 * has its own, and they can drift — Shrewsbury was `town-of-shrewsbury` here and
 * `shrewsbury` there for five weeks, so every report link 404'd. The server
 * reconciles the two on the organisation UUID and hands the answer down in
 * _orgMeta; these are the ONLY values a rental-report URL may be built from.
 * They fall back to ours, which is what the page did before and is correct for
 * every org that has not drifted. */
function RPT_SLUG(){ return (window._orgMeta && window._orgMeta.reportingSlug) || ORG_SLUG; }
function RPT_TOKEN(){ return (window._orgMeta && window._orgMeta.reportingToken) || TOKEN; }
const IS_PRINT = params.get('_print') === '1';
const PRINT_SECTIONS = params.get('sections') ? params.get('sections').split(',') : null;
const CHART_COLORS = ['#f59e0b','#3b82f6','#22c55e','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16','#14b8a6','#f97316'];
const pf = v => parseFloat(v) || 0;
// Signup timestamp (ms) for a user row, or null. Powers the period-comparison
// pills on the all-time Users & Demographics tiles (computed from created_at
// rather than a prior-window fetch, which all-time reports don't have).
const userCreatedMs = r => { const d = r['created_at'] || r['Created At'] || r['signup_date'] || r['Signup Date'] || r['Created'] || ''; const t = d ? new Date(d).getTime() : NaN; return isNaN(t) ? null : t; };
const DAY_MS = 86400000;

function fmt(val, format) {
  if (val == null || isNaN(val)) return '\u2014';
  if (format === 'currency') return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  if (format === 'currency2') return '$' + Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (format === 'percent') return Number(val).toFixed(1) + '%';
  return Number(val).toLocaleString('en-US');
}
function fmtTooltip(v, format) { return format==='currency' ? '$'+Number(v).toLocaleString('en-US',{maximumFractionDigits:0}) : Number(v).toLocaleString('en-US'); }
// Value-axis currency ticks: one decimal on thousands ($1.2k) so adjacent
// ticks never round into duplicate labels ($2k, $2k, $1k, $1k…).
function fmtAxisCurrency(v) { return '$' + (v >= 1000 ? (v/1000).toFixed(1).replace(/\.0$/,'') + 'k' : v); }
// Did any GL revenue land in the selected window? Used by the program tiles
// to caption registration-season zero states.
function glHasRevenue(all) {
  const gl = all && all.gl;
  return Array.isArray(gl) && gl.reduce((s,r) => s + pf(r['Total Payments']), 0) > 0;
}
function shortDate(iso) { if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function getMonthRange(offset = 0) {
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth() + offset;
  const start = new Date(y, m, 1), end = new Date(y, m + 1, 0);
  return { start: start.toISOString().split('T')[0], end: end.toISOString().split('T')[0] };
}

// ═══════════════════════════════════════════════════════
//  MEMBERSHIP BOOK HELPERS
// ═══════════════════════════════════════════════════════
// These are a deliberate MIRROR of the module-scope helpers in
// rental-report's public/memberships.html, and they carry the same names on
// purpose so a grep finds both copies. Card 17301 is SHARED between the two
// projects (f4496307-… here, SHARED_UUIDS.memberships there), so a rule about
// what a row MEANS has to be the same in both or the dashboard and the report
// it links to will disagree about the same org on the same day.
//
// They are at module scope, not inside a transform, so a spec can RUN them
// rather than regex over them.
//
// THE THREE THINGS THAT ARE EASY TO GET WRONG, all measured against prod
// during the report work and all reproduced here:
//
//   1. A PASS IS NOT A MEMBERSHIP. Norman's feed is 20,341 rows of which
//      16,940 are passes — including 4,518 "$5 League Tournament Gate Adult"
//      admissions. Counting those as members inflates every membership figure
//      on this section, and it is why 'Active Members' needed a pass gate.
//   2. A BILLING CYCLE IS A PROPERTY OF THE PLAN, NOT OF ONE ROW. Dividing by
//      each row's own (Next Renewal − Period Start) reads the time REMAINING
//      in the period on a membership whose renewal is imminent: at Apex, 8
//      rows had a gap under a day (smallest 15 minutes) and one derived
//      44,665 renewals. The median across a plan's members is unmoved by a
//      minority of corrupt rows.
//   3. PRESENCE, NOT COUNT. Feeds cache 4 hours, so a pre-v3/v4 response with
//      none of these columns is live alongside a current one. A widget that
//      renders 0 there says "this org has no auto-renew"; the truth is "this
//      feed cannot tell us". Every gate below tests whether the COLUMN is
//      present, never whether any row has a value.

function mbCol(r, name) { return r ? r[name] : undefined; }
function mbHasColumn(rows, name) {
  return Array.isArray(rows) && rows.length > 0 && rows.some(r => r && Object.prototype.hasOwnProperty.call(r, name));
}
function mbHasProductKind(rows) { return mbHasColumn(rows, 'Product Kind'); }
function mbHasAutoRenew(rows) { return mbHasColumn(rows, 'Auto Renew'); }
function mbHasCancelSchedule(rows) { return mbHasColumn(rows, 'Cancel Scheduled At'); }
function mbHasPeriod(rows) { return mbHasColumn(rows, 'Period Start'); }

function mbIsPass(r) { return String(mbCol(r, 'Product Kind') || '').toLowerCase() === 'pass'; }
function mbIsActive(r) { return String(mbCol(r, 'Status') || '').toLowerCase() === 'active'; }

// A membership is CANCELLED if it has a cancellation date; the status word is
// the fallback, not the test. Reading the word first misses a row whose status
// has moved on but which carries the date.
function mbIsCanceled(r) {
  if (!r) return false;
  if (mbCol(r, 'Canceled At')) return true;
  const st = String(mbCol(r, 'Status') || '').toLowerCase();
  return st === 'canceled' || st === 'cancelled';
}

// SCHEDULED to cancel is not CANCELLED — the membership is still live and
// still billing, it just will not renew. The !mbIsCanceled guard is what stops
// the two being added together the moment one becomes the other.
function mbCancelPending(r) {
  return !!(r && mbCol(r, 'Cancel Scheduled At') && !mbIsCanceled(r));
}

// `Auto Renew` is the truth (stripe_subscription_id IS NOT NULL). `Renewal
// Type` INFERS it from next_renewal_at and is a different test — it is the
// pre-v2 fallback only, so a warm 4-hour cache entry still resolves to the
// same answer rather than reading as nobody auto-renewing.
function mbIsAutoRenew(r) {
  if (!r) return false;
  const explicit = mbCol(r, 'Auto Renew');
  if (explicit != null && explicit !== '') {
    return explicit === true || String(explicit).toLowerCase() === 'true' || String(explicit) === '1';
  }
  return String(mbCol(r, 'Renewal Type') || '').toLowerCase().indexOf('auto') >= 0;
}

function mbPlanKey(r) {
  return (r && (mbCol(r, 'Group / Plan') || mbCol(r, 'Membership Type'))) || '—';
}

function mbDays(a, b) {
  const t0 = Date.parse(a), t1 = Date.parse(b);
  if (isNaN(t0) || isNaN(t1)) return null;
  return (t1 - t0) / 86400000;
}

// One ROW's gap. Only ever used as a vote toward its plan's median — see (2).
function mbRowGapDays(r) {
  const d = mbDays(mbCol(r, 'Period Start'), mbCol(r, 'Next Renewal'));
  return d == null || d <= 0 ? null : d;
}

// The plan's cycle is the MEDIAN of its members' gaps, with sub-day gaps
// excluded from the vote entirely: they are a renewal about to happen, not a
// cadence, and they are the input that produced 44,665.
function mbPlanCycles(rows) {
  const byPlan = {};
  (rows || []).forEach(r => {
    const g = mbRowGapDays(r);
    if (g == null || g < 1) return;
    const k = mbPlanKey(r);
    (byPlan[k] = byPlan[k] || []).push(g);
  });
  const out = {};
  Object.keys(byPlan).forEach(k => {
    const v = byPlan[k].sort((a, b) => a - b);
    out[k] = v[Math.floor(v.length / 2)];
  });
  return out;
}

function mbCadence(days) {
  if (days == null) return null;
  if (days <= 10) return 'per week';
  if (days <= 45) return 'per month';
  if (days <= 120) return 'per quarter';
  return 'per year';
}

// THERE IS NO RENEWAL-EVENT HISTORY ANYWHERE — `membership` keeps only the
// CURRENT period — so renewals are derived: elapsed time divided by the plan's
// cycle. Verified by remainder at Norman (weekly exact, monthly 0.06 off a
// whole number, annual exact), which is why this is safe to state at all.
//
// NULL, never 0, when it cannot be derived: next_renewal_at is cleared on
// cancellation, so a member who renewed six times and then left would
// otherwise read as never having renewed — and would drag down the very plan
// that kept billing them longest. Above 600 the dates are wrong and a dash is
// more honest than a confident number.
function mbRenewalsSoFar(r, planCycle) {
  if (!r || !planCycle || planCycle < 1) return null;
  const d = mbDays(mbCol(r, 'Start Date'), mbCol(r, 'Period Start'));
  if (d == null || d < 0) return null;
  const n = Math.round(d / planCycle);
  return n <= 600 ? n : null;
}

// Churn as a HAZARD RATE: of all renewal opportunities, what share ended in a
// cancellation. The lifetime share of a four-year-old book having eventually
// cancelled is unremarkable; the same figure sitting in a KPI row reads as a
// monthly rate and looks like a fire. Dan: "always report the churn rate based
// on its renewal period."
function mbChurnPerCycle(renewals, canceled) {
  const opportunities = (renewals || 0) + (canceled || 0);
  if (!opportunities) return null;
  return canceled / opportunities;
}

// A per-cycle charge is only comparable across plans once it is per month.
// Measured: 50 memberships bill WEEKLY, so reading the charge as monthly
// understates them roughly fourfold.
function mbMonthlyValue(price, cycleDays) {
  if (cycleDays == null || cycleDays < 1) return null;
  return price * (30.44 / cycleDays);
}

function mbPrice(r) {
  return pf(mbCol(r, 'Net Collected') || mbCol(r, 'Paid') || mbCol(r, 'Price'));
}

// The auto-renew BOOK: the rows somebody is actually on auto-renew for. Dan,
// after two rounds of narrowing a denominator instead: "the memberships showing
// up in the auto renew tab should be those that are setup for auto renew."
// That one rule subsumes every exclusion argued for separately — a pass, a
// season plan and a desk-paid cash plan all have nobody enrolled and fall out
// together instead of as three special cases.
function mbBook(rows) {
  return (rows || []).filter(r => mbIsAutoRenew(r));
}

  'ft-top-sections': { label: 'Top Fast Tracked Sections', description: 'Sections by FT signup volume', note: 'Sections with the most pre-registered demand, against their capacity', section: 'fasttrack',
    reportType: 'fasttrack', size: 'md', icon: '\uD83C\uDFAF', component: 'bar',

    // exists and a program HIDES its sections: at Watertown "Adult Pickleball
    // Open Play" is the tallest program bar because it aggregates several
    // sessions, while one intermediate session holds 67 of those signups on its

    transform: rows => {

        }))
        .filter(x => x.ft > 0)
        .sort((a, b) => b.ft - a.ft)
        .slice(0, 10);
      // Capacity rides in the label, because 36 signups against 200 seats and 14

      return { labels: s.map(x => x.cap > 0 ? x.name + ' \u00B7 ' + x.ft + '/' + x.cap : x.name),

  'ft-money': { label: 'Fast Track Money', description: 'Earned, awaiting checkout, and blocked by capacity', note: 'What Fast Track earned, and the demand that has not turned into money yet', section: 'fasttrack',
    reportType: 'fasttrack', size: 'md', icon: '\uD83D\uDCB0', component: 'table',
    // THREE POTS, AND THEY HAVE DIFFERENT LEVERS. This is the whole reason the
    // widget is a table rather than three metrics: an amount with no action
    // attached invites the wrong one.
    //
    // Measured on card 17300 (watertown, 2026-08-27), exact on all 338 sections:
    //   Left on Table === FT Pending * Section Price
    // So it is the value of holds that have NOT converted — NOT demand that
    // exceeded capacity. Of the 138 sections carrying it, only 2 are
    // oversubscribed and 100 STILL HAVE EMPTY SEATS. Adding capacity there
    // captures nothing; those families already had a seat and did not finish.
    //
    // The genuine "add a few more spots" money is Over Demand $ — $1,170 across
    // one section at Watertown. Small here, and the figure that grows at the
    // oversubscribed orgs. Conflating the two would send someone to add seats to
    // sections that are already half empty.
    transform: rows => {
      const sec = rows.filter(r => (r['Row Type'] || 'section') === 'section');
      const n = v => { const x = parseFloat(String(v == null ? 0 : v).replace(/[$,]/g, '')); return isFinite(x) ? x : 0; };
      let earned = 0, holds = 0, blocked = 0, holdSecs = 0, blockedSecs = 0, holdSeats = 0, holdPeople = 0;
      sec.forEach(r => {
        earned  += n(r['FT Revenue']);
        const lot = n(r['Left on Table']);
        const ov  = n(r['Over Demand $']);
        holds   += lot;
        blocked += ov;
        if (lot > 0) {
          holdSecs++;
          holdPeople += parseInt(r['FT Pending']) || 0;
          // Seats still free in the sections where money is waiting — the fact
          // that turns "add capacity" into "chase the checkout".
          const free = (parseInt(r['Capacity']) || 0) - (parseInt(r['Total Enrolled']) || 0);
          if (free > 0) holdSeats++;
        }
        if (ov > 0) blockedSecs++;
      });
      const money = v => '$' + Math.round(v).toLocaleString();
      return {
        columns: ['', 'Amount', 'Where', 'What moves it'],
        data: [
          ['Earned', money(earned), sec.filter(r => n(r['FT Revenue']) > 0).length + ' sections', 'Already collected'],
          ['Awaiting checkout', money(holds), holdSecs + ' sections \u00B7 ' + holdPeople + ' families',
            holdSeats > 0 ? 'Follow-up \u2014 ' + holdSeats + ' of these still have seats free' : 'Follow-up with the families holding'],
          ['Blocked by capacity', money(blocked), blockedSecs + (blockedSecs === 1 ? ' section' : ' sections'),
            blocked > 0 ? 'Add spots \u2014 demand exceeded seats' : 'Nothing blocked on seats'],
        ],
      };
    }},

  'mem-mrr': { label: 'Monthly Recurring', description: 'Auto-renew revenue per month', note: 'Each charge converted to a monthly figure using its plan’s own cycle', section: 'memberships',
    reportType: 'memberships', size: 'sm', icon: '💵', component: 'metric', reportTab: 'autorenew',
    transform: rows => {
      if (!mbHasPeriod(rows)) return { value: null, format:'currency', sub:'billing cycle not in this feed yet' };
      const cycles = mbPlanCycles(rows);
      const book = mbBook(rows);
      // ONE POPULATION. A total over every auto-renewer beside a monthly figure
      // over only those with a known cycle is two correct sums that do not
      // reconcile, which is how a reader stops trusting either.
      let monthly = 0, known = 0, unknown = 0;
      book.forEach(r => {
        const mv = mbMonthlyValue(mbPrice(r), cycles[mbPlanKey(r)]);
        if (mv == null) { unknown++; return; }
        monthly += mv; known++;
      });
      return { value: known ? monthly : null, format:'currency', colorClass:'metric-green',
               sub: known
                 ? 'over ' + known.toLocaleString() + ' membership' + (known === 1 ? '' : 's')
                   + (unknown ? ' · ' + unknown + ' on a cycle this feed cannot read' : '')
                 : 'no readable billing cycle here' };
    } },
  'mem-churn': { label: 'Churn Per Renewal', description: 'Share of renewal opportunities ending in a cancellation', note: 'A rate per renewal, NOT the lifetime share who have ever cancelled', section: 'memberships',
    reportType: 'memberships', size: 'sm', icon: '📉', component: 'metric', reportTab: 'autorenew',
    deltaGoodWhenDown: true,
    transform: rows => {
      if (!mbHasPeriod(rows)) return { value: null, format:'percent', sub:'renewal dates not in this feed yet' };
      // The rate must be taken over rows of EVERY status. A view that hides
      // cancellations makes this structurally 0.0% for every org forever, and
      // reads as a healthy book rather than a broken number.
      const cycles = mbPlanCycles(rows);
      const book = mbBook(rows);
      let renewals = 0, canceled = 0;
      book.forEach(r => {
        if (mbIsCanceled(r)) { canceled++; return; }
        const n = mbRenewalsSoFar(r, cycles[mbPlanKey(r)]);
        if (n != null) renewals += n;
      });
      const churn = mbChurnPerCycle(renewals, canceled);
      // NO PERIOD LABEL on the book-level rate, deliberately: a book of weekly,
      // monthly and annual plans has no single cadence, so "per month" would be
      // false for part of it. "Per renewal" is unit-free and true whatever the mix.
      return { value: churn == null ? null : churn * 100, format:'percent',
               colorClass: churn != null && churn > 0.1 ? 'metric-red' : '',
               sub: churn == null ? 'no renewal history to derive' : canceled.toLocaleString() + ' cancellations over ' + (renewals + canceled).toLocaleString() + ' renewal opportunities' };
    } },
  'mem-leaving': { label: 'Leaving At Period End', description: 'Still billing, already cancelled for the end of the period', note: 'The only forward-looking churn signal the schema carries', section: 'memberships',

    deltaGoodWhenDown: true,
    transform: rows => {

      return { value: pending.length, format:'number',
               colorClass: pending.length ? 'metric-red' : '',
               sub: pending.length
                 ? '$' + Math.round(pending.reduce((s,r)=>s+mbPrice(r),0)).toLocaleString() + ' a cycle · open the tab for who'
                 : 'nobody has cancelled ahead' };

  'mem-kind-donut': { label: 'Memberships vs Passes', description: 'What this org actually sells', note: 'A pass has no subscription column, so the split decides what every other tile can mean', section: 'memberships',

  'tbl-mem-autorenew': { label: 'Auto-Renew By Plan', description: 'Every plan somebody is actually on auto-renew for', note: 'Listed only where on > 0 — an eligible-but-unenrolled plan is a candidate, not a book entry', section: 'memberships',
    reportType: 'memberships', size: 'lg', icon: '🔁', component: 'table', reportTab: 'autorenew',
    transform: rows => {
      const cycles = mbPlanCycles(rows);
      const g = {};
      mbBook(rows).forEach(r => {
        const k = mbPlanKey(r);
        if (!g[k]) g[k] = { n: 0, revenue: 0, renewals: 0, canceled: 0 };
        g[k].n++;
        g[k].revenue += mbPrice(r);
        if (mbIsCanceled(r)) { g[k].canceled++; return; }
        const n = mbRenewalsSoFar(r, cycles[k]);
        if (n != null) g[k].renewals += n;
      });
      const rowsOut = Object.entries(g)
        .sort((a, b) => b[1].revenue - a[1].revenue)
        .slice(0, 12)
        .map(([plan, v]) => {
          const churn = mbChurnPerCycle(v.renewals, v.canceled);
          // EVERY per-plan rate carries its cadence. A weekly plan losing 5% a
          // week and a monthly plan losing 5% a month are not the same thing,
          // and a bare column invites ranking them against each other.
          const cad = mbCadence(cycles[plan]);
          return [plan, v.n.toLocaleString(),
                  '$' + Math.round(v.revenue).toLocaleString(),
                  v.renewals.toLocaleString(),
                  churn == null ? '—' : (churn * 100).toFixed(1) + '%' + (cad ? ' ' + cad : '')];
        });
      // TableWidget takes { columns, data } — a { headers, rows } shape reads
      // `data.data.length` off undefined and unmounts the WHOLE dashboard, not
      // just this tile. Caught by the render check; every spec passed on it.
      return { columns: ['Plan', 'On auto-renew', 'Per cycle', 'Renewals', 'Churn'], data: rowsOut };
    } },

const dataStore = {};
// Failed feeds, keyed by report type. A fetch failure must be visibly
// different from an empty dataset — the 2026-08-10 all-orgs outage rendered
// as $0 everywhere because errors were silently coerced to [].
const fetchFailures = {};
async function fetchReportData(rt, dr) {
  const key = `${rt}:${dr.start}:${dr.end}`;
  if (dataStore[key]) return dataStore[key];
  const qs = new URLSearchParams({ start: dr.start, end: dr.end });
  const url = IS_SHARE
    ? `/share/${SHARE_TOKEN}/data/${rt}?${qs}`
    : `/${ORG_SLUG}/api/data/${rt}?token=${TOKEN}&${qs}`;
  const resp = await fetch(url);
  if (!resp.ok) {
    let detail = `HTTP ${resp.status}`;
    try { const j = await resp.json(); if (j && (j.detail || j.error)) detail = j.detail || j.error; } catch (e) {}
    fetchFailures[rt] = detail;
    return null;  // caller renders empty, but the failure banner names the feed
  }
  const json = await resp.json();
  delete fetchFailures[rt];
  dataStore[key] = json.rows || [];
  return dataStore[key];
}
function clearDataStore() {
  Object.keys(dataStore).forEach(k => delete dataStore[k]);
  Object.keys(fetchFailures).forEach(k => delete fetchFailures[k]);
}

const eventQueue = [];
let flushTimer = null;

function track(event, props = {}) {
  eventQueue.push({ event, ...props, clientTs: new Date().toISOString() });
  if (!flushTimer) {
    flushTimer = setTimeout(flushEvents, 2000); // batch every 2s
  }
}

function flushEvents() {
  flushTimer = null;
  if (!eventQueue.length) return;
  const batch = eventQueue.splice(0);
  fetch(`/${ORG_SLUG}/api/events?token=${TOKEN}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(batch)
  }).catch(() => {}); // fire and forget
}

// Flush on page unload
window.addEventListener('beforeunload', flushEvents);

function ProgressRing({ pct, size = 68 }) {
  const clamped = Math.min(100, Math.max(0, pct));
  const color = clamped >= 66 ? 'var(--green)' : clamped >= 33 ? 'var(--amber)' : 'var(--red)';
  const r = 15.9155;
  const circ = 2 * Math.PI * r;
  return (
    <svg className="progress-ring" viewBox="0 0 36 36" width={size} height={size}>
      <circle cx="18" cy="18" r={r} fill="none" stroke="var(--border)" strokeWidth="3" />
      <circle cx="18" cy="18" r={r} fill="none" stroke={color} strokeWidth="3"
        strokeDasharray={`${clamped} ${100 - clamped}`} strokeDashoffset="25"
        strokeLinecap="round" style={{transition:'stroke-dasharray 0.5s ease'}} />
      <text x="18" y="19.5" textAnchor="middle" fontSize="8" fontWeight="700"
        fontFamily="DM Sans,sans-serif" fill="var(--text-primary)">{Math.round(clamped)}%</text>
    </svg>
  );
}

// ── Prior-period comparison ────────────────────────────────────────
// Prior window mirrors the dashboard's selected timeframe: whole calendar
// month(s) compare to the previous calendar month(s) ("July" vs "June");
// anything else compares to the immediately preceding equal-length window.
function priorWindow(dr) {
  if (!dr || !dr.start || !dr.end) return null;
  try {
    const s = new Date(dr.start + 'T12:00:00'), e = new Date(dr.end + 'T12:00:00');
    if (isNaN(s) || isNaN(e) || e < s) return null;
    const iso = d => d.toISOString().split('T')[0];
    const isMonthStart = s.getDate() === 1;
    const isMonthEnd = e.getDate() === new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate();
    if (isMonthStart && isMonthEnd) {
      const span = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) + 1;
      return { start: iso(new Date(s.getFullYear(), s.getMonth() - span, 1, 12)), end: iso(new Date(s.getFullYear(), s.getMonth(), 0, 12)) };
    }
    const days = Math.round((e - s) / 86400000) + 1;
    const pe = new Date(s); pe.setDate(pe.getDate() - 1);
    const ps = new Date(pe); ps.setDate(ps.getDate() - (days - 1));
    return { start: iso(ps), end: iso(pe) };
  } catch (e) { return null; }
}

function fmtRangeShort(dr) {
  try {
    const s = new Date(dr.start + 'T12:00:00'), e = new Date(dr.end + 'T12:00:00');
    const sm = s.toLocaleDateString('en-US', { month: 'short' }), em = e.toLocaleDateString('en-US', { month: 'short' });
    if (sm === em && s.getFullYear() === e.getFullYear()) return sm + ' ' + s.getDate() + '\u2013' + e.getDate();
    return sm + ' ' + s.getDate() + ' \u2013 ' + em + ' ' + e.getDate();
  } catch (e) { return 'prior period'; }
}

// Window one calendar quarter (3 months) before the current selection.
// A whole-month selection snaps to whole months so a quarter maps cleanly onto
// the previous quarter (Apr 1-Jun 30 -> Jan 1-Mar 31); an arbitrary range just
// shifts back three months preserving the day.
function priorQuarterWindow(dr) {
  if (!dr || !dr.start || !dr.end) return null;
  try {
    const s = new Date(dr.start + 'T12:00:00'), e = new Date(dr.end + 'T12:00:00');
    if (isNaN(s) || isNaN(e) || e < s) return null;
    const iso = d => d.toISOString().split('T')[0];
    const isMonthStart = s.getDate() === 1;
    const isMonthEnd = e.getDate() === new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate();
    if (isMonthStart && isMonthEnd) {
      return { start: iso(new Date(s.getFullYear(), s.getMonth() - 3, 1, 12)),
               end: iso(new Date(e.getFullYear(), e.getMonth() - 2, 0, 12)) };
    }
    return { start: iso(new Date(s.getFullYear(), s.getMonth() - 3, s.getDate(), 12)),
             end: iso(new Date(e.getFullYear(), e.getMonth() - 3, e.getDate(), 12)) };
  } catch (e) { return null; }
}

// Resolve a "Compare To" mode to the window its deltas are measured against.
// 'none' -> no comparison; 'prior-period' -> the immediately preceding
// equal-length window; 'prior-quarter' -> the quarter before.
function comparisonWindow(dr, mode) {
  if (!dr || mode === 'none' || !mode) return null;
  if (mode === 'prior-quarter') return priorQuarterWindow(dr);
  return priorWindow(dr); // 'prior-period' and default
}

// "Q1 2026" when the window is exactly a calendar quarter, else a short range.
function quarterLabel(dr) {
  try {
    const s = new Date(dr.start + 'T12:00:00'), e = new Date(dr.end + 'T12:00:00');
    const isMonthEnd = e.getDate() === new Date(e.getFullYear(), e.getMonth() + 1, 0).getDate();
    const span = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) + 1;
    if (s.getDate() === 1 && s.getMonth() % 3 === 0 && isMonthEnd && span === 3) {
      return 'Q' + (s.getMonth() / 3 + 1) + ' ' + s.getFullYear();
    }
  } catch (e) {}
  return fmtRangeShort(dr);
}

function comparisonLabel(win, mode) {
  if (!win) return '';
  return mode === 'prior-quarter' ? quarterLabel(win) : fmtRangeShort(win);
}

// Delta pill vs the prior window. goodWhenDown flips the color logic for
// metrics where a decrease is the win (refunds).
function DeltaPill({ cur, prev, goodWhenDown, label }) {
  if (prev == null || cur == null || (prev === 0 && cur === 0)) return null;
  const diff = cur - prev;
  if (diff === 0) return <span className="delta-pill flat">{'\u2014'} 0% <span className="dvs">{label}</span></span>;
  const up = diff > 0;
  const pct = prev !== 0 ? Math.round(Math.abs(diff) / Math.abs(prev) * 100) : null;
  const txt = (pct != null && pct <= 999) ? pct + '%' : Math.abs(diff).toLocaleString();
  const good = goodWhenDown ? !up : up;
  return (
    <span className={'delta-pill ' + (good ? 'good' : 'bad')}>
      {up ? '\u25B2 +' : '\u25BC \u2212'}{txt} <span className="dvs">{label}</span>
    </span>
  );
}

function MetricCard({ data, target, prior }) {
  if (!data) return <div className="skeleton skeleton-metric" />;
  const hasTarget = target != null && target > 0;
  const pct = hasTarget ? (data.value / target) * 100 : 0;

  if (hasTarget) {
    return (
      <div className="metric-with-target">
        <div className="metric-left">
          <div className={`metric-value ${data.colorClass || ''}`} style={{fontSize:30}}>{fmt(data.value, data.format)}</div>
          <div className="target-sub">{Math.round(pct)}% of {fmt(target, data.format)} target</div>
          {data.sub && <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>{data.sub}</div>}
          {prior && <div><DeltaPill cur={data.value} prev={prior.value} goodWhenDown={prior.goodWhenDown} label={prior.label} /></div>}
        </div>
        <ProgressRing pct={pct} />
      </div>
    );
  }

  return <div>
    <div className={`metric-value ${data.colorClass || ''}`}>{fmt(data.value, data.format)}</div>
    {data.sub && <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>{data.sub}</div>}
    {prior && <div><DeltaPill cur={data.value} prev={prior.value} goodWhenDown={prior.goodWhenDown} label={prior.label} /></div>}
  </div>;
}

function BarChartWidget({ data, onBarClick }) {
  const ref = useRef(null), chart = useRef(null);
  useEffect(() => {
    if (chart.current) chart.current.destroy();
    if (!ref.current || !data) return;
    const horiz = data.labels.length > 5;
    chart.current = new Chart(ref.current, { type: 'bar',
      data: { labels: data.labels, datasets: [{ data: data.values, backgroundColor: CHART_COLORS.slice(0, data.values.length), borderRadius: 4, maxBarThickness: 40 }] },
      options: { indexAxis: horiz?'y':'x', responsive: true, maintainAspectRatio: false,
        onClick: onBarClick ? (evt, elements) => { if (elements.length > 0) { onBarClick(data.labels[elements[0].index]); } } : undefined,
        onHover: onBarClick ? (evt, elements) => { evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default'; } : undefined,
        plugins: { tooltip: { callbacks: { label: ctx => fmtTooltip(ctx.raw, data.format) + (onBarClick ? '  \u2197 View details' : '') } } },
        // Currency formatting belongs to the VALUE axis only — on a category
        // axis Chart.js passes the tick's index, so formatting it printed
        // "$0"/"$1" instead of GL account names. Thousands keep one decimal
        // ($1.2k) so adjacent ticks never collapse into duplicate labels.
        scales: { x: { grid: { display: !horiz }, ticks: horiz ? { callback: v => data.format==='currency' ? fmtAxisCurrency(v) : v } : {} },
                  y: { grid: { display: horiz }, ticks: horiz ? {} : { callback: v => data.format==='currency' ? fmtAxisCurrency(v) : v } } } }
    });
    return () => { if (chart.current) chart.current.destroy(); };
  }, [data, onBarClick]);
  if (!data) return <div className="skeleton skeleton-chart" />;
  return <div className="chart-container"><canvas ref={ref} /></div>;
}

//  MAP WIDGET (Leaflet)
// ═══════════════════════════════════════════════════════
const geoCache = {};
async function geocode(query) {
  const fullQuery = query.includes(',') ? query : (window._orgGeo ? query + ', ' + window._orgGeo : query);
  if (geoCache[fullQuery]) return geoCache[fullQuery];
  try {
    const resp = await fetch(`/${ORG_SLUG}/api/geocode?token=${TOKEN}&q=${encodeURIComponent(fullQuery)}`);
    const data = await resp.json();
    if (data.lat != null && data.lng != null) { geoCache[fullQuery] = data; return data; }
  } catch(e) { console.warn('[GEO] Error:', fullQuery, e); }
  return null;
}

function MapWidget({ data }) {
  const mapRef = useRef(null);
  const mapInst = useRef(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    if (!mapRef.current || !data?.points?.length) return;
    if (mapInst.current) { mapInst.current.remove(); mapInst.current = null; }
    setReady(false);

    const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    const tiles = isDark
      ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
      : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';

    const map = L.map(mapRef.current, { scrollWheelZoom: false }).setView([39.5, -98.5], 4);
    L.tileLayer(tiles, { attribution: '\u00A9 OSM \u00A9 CARTO', maxZoom: 18 }).addTo(map);
    mapInst.current = map;

    (async () => {
      const bounds = [];
      for (let i = 0; i < Math.min(data.points.length, 20); i++) {
        const pt = data.points[i];
        const geo = await geocode(pt.query);
        if (geo) {
          const radius = Math.max(6, Math.min(30, Math.sqrt(pt.count) * 2.5));
          L.circleMarker([geo.lat, geo.lng], {
            radius, fillColor: '#f59e0b', fillOpacity: 0.7, color: '#f59e0b', weight: 1, opacity: 0.9
          }).bindTooltip('<strong>' + pt.label + '</strong><br>' + pt.count.toLocaleString() + ' ' + (data.unit || 'users')).addTo(map);
          bounds.push([geo.lat, geo.lng]);
        }
        if (i < data.points.length - 1) await new Promise(r => setTimeout(r, 500));
      }
      if (bounds.length > 1) map.fitBounds(bounds, { padding: [30, 30] });
      else if (bounds.length === 1) map.setView(bounds[0], 10);
      setReady(true);
      setTimeout(() => map.invalidateSize(), 100);
    })();

    return () => { if (mapInst.current) { mapInst.current.remove(); mapInst.current = null; } };
  }, [data]);

  if (!data) return <div className="skeleton skeleton-chart" />;
  return <div>
    <div ref={mapRef} className="map-container" />
    {!ready && <div style={{fontSize:11,color:'var(--text-muted)',marginTop:4,textAlign:'center'}}>Geocoding locations...</div>}
  </div>;
}

function HeatmapWidget({ data }) {
  if (!data?.grid) return <div className="skeleton skeleton-chart" />;
  const { rows, cols, grid, maxVal } = data;
  const colCount = cols.length + 1; // +1 for row labels
  return (
    <div style={{overflowX:'auto'}}>
      <div className="heatmap-grid" style={{gridTemplateColumns:`50px repeat(${cols.length}, 1fr)`}}>
        <div />
        {cols.map((c,i) => <div key={i} className="heatmap-col-label">{c}</div>)}
        {rows.map((row, ri) => (
          <React.Fragment key={ri}>
            <div className="heatmap-label">{row}</div>
            {grid[ri].map((val, ci) => {
              const intensity = maxVal > 0 ? val / maxVal : 0;
              const bg = val === 0 ? 'var(--bg-surface)' : `rgba(245,158,11,${0.1 + intensity * 0.8})`;
              return <div key={ci} className="heatmap-cell" style={{background:bg}}>{val || ''}</div>;
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

function StreamsChart({ data }) {
  if (!data || !data.streams || !data.streams.length) return <div style={{color:'var(--text-muted)',fontSize:12,padding:16,textAlign:'center'}}>No revenue data for this period</div>;

const COMP = {
  streams: StreamsChart, metric: MetricCard, bar: BarChartWidget, donut: DonutChartWidget, line: LineChartWidget, table: TableWidget, map: MapWidget, heatmap: HeatmapWidget };

// Report types arrive one at a time (see the progressive fetch in DashboardApp),
// so a widget is only renderable once every source it reads has landed.
// Multi-source widgets are the reason this isn't just a truthiness check on the
// primary report type — rendering "Revenue by Stream" with three of its five
// feeds in would flash a wrong split before correcting itself.
function widgetReady(def, reportData) {
  if (!reportData[def.reportType]) return false;
  if (def._extraReportTypes) {
    for (const rt of def._extraReportTypes) if (!reportData[rt]) return false;
  }
  return true;
}

// True once every source this widget reads has been refreshed by the current
// batch. Anything still showing last batch's numbers gets dimmed.
function widgetFresh(def, freshRts) {
  if (!freshRts) return true;
  if (!freshRts[def.reportType]) return false;
  if (def._extraReportTypes) {
    for (const rt of def._extraReportTypes) if (!freshRts[rt]) return false;
  }
  return true;
}

// ── Smart cards ──────────────────────────────────────────────────────
// Chart widgets whose transform emits { labels, values, format } can be
// rendered as any of these interchangeably, so the user can flip between them.
// (metric / table / map / heatmap / streams are NOT interchangeable.)
const SWITCHABLE_CHARTS = ['bar', 'donut', 'line'];
const CHART_TYPE_LABEL = { bar: 'Bar', donut: 'Pie', line: 'Line' };
function VizIcon({ type }) {
  if (type === 'bar') return (
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <rect x="2" y="7" width="3" height="7" rx="0.5" /><rect x="6.5" y="3.5" width="3" height="10.5" rx="0.5" /><rect x="11" y="9.5" width="3" height="4.5" rx="0.5" />
    </svg>);
  if (type === 'donut') return (
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5" /><path d="M8 8 L8 2.5 A5.5 5.5 0 0 1 12.9 5.4 Z" fill="currentColor" stroke="none" />
