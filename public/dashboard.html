     which was the load, not a failure. A skeleton says "coming", the way every
     other widget on this dashboard already does; absence is reserved for the
     feed that could not answer at all. */
  if (!rows) {
    return (
      <div className="widget-card widget-md live-card" data-live-loading="1">
        <LiveCardHeader icon={'\u{1F4DD}'} title="Live Enrollments" feed={feed} card="enrollments" sound={sound}
                        sub={'Loading the last ' + LIVE_DAYS + ' days\u2026'} />
        <div className="skeleton skeleton-chart" />
      </div>
    );
  }

  const today   = liveTodayFor(rows, 'Signed Up At');
  const todayRows = rows.filter(r => liveDay(r['Signed Up At']) === today);
  const todayVal  = todayRows.reduce((n, r) => n + (Number(r['Price']) || 0), 0);

  const tl = liveTimeline(rows, today);

  /* TODAY, NOT SEVEN DAYS. Dan: "aren't the live enrollments just the CURRENT
     day? Not 7 days? I don't care about 7 days ago, I care about today, this
     is an open and watch what happens today. Programs can stay 7 days."

     THE FEED STILL FETCHES SEVEN, and that is deliberate rather than lazy: the
     Programs card beside this one is a leaderboard over the week and reads the
     SAME feed, so narrowing the query would break it while narrowing the CARD
     costs nothing. One query, two windows.

     WHICH day is `liveTodayFor`'s problem, and it is the calendar day — NOT the
     newest row's, which is what shipped and what showed a quiet morning
     yesterday's twenty-six signups under the word "today". */
  return (
    <div className="widget-card widget-md live-card" data-live-regs={String(todayRows.length)}>
      <LiveCardHeader icon={'\u{1F4DD}'} title="Live Enrollments" feed={feed} card="enrollments" sound={sound}
                      sub={'Enrollments as they happen \u00b7 today'} />

      <div className="live-count">
        <span className="live-n" data-live-today={String(todayRows.length)}>{todayRows.length}</span>
        <span className="live-u">{todayRows.length === 1 ? 'signup' : 'signups'} today{liveMoney(todayVal) ? ' \u00b7 ' + liveMoney(todayVal) : ''}</span>
      </div>

      {/* WHEN, not how many. One mark per registration at its own minute,
          coloured by what its money is doing. The right-hand edge is now. */}
      {/* FOUR STATES, STACKED PAID-FIRST when the day is busy enough to need
          columns: a 9am quarter-hour that took twenty registrations and
          collected on six is a different morning from one that collected on
          all twenty, and the stack is where that shows. */}
      <LiveLane tl={tl} flash={flash} prefix="live-" cls={st => st}
                states={LIVE_PAY_STATES}
                title="Every registration today, placed at the time it happened. Green paid, orange part-paid, grey not yet." />
      {/* A THREE-COLOUR CODE NEEDS NAMING. The dots' own titles say it on
          hover; the legend says it at a glance, which is how this card is
          read. */}
      <div className="live-legend" data-live-legend="1">
        <span className="lg-paid"><i />paid</span>
        <span className="lg-part"><i />part-paid / on a plan</span>
        <span className="lg-none"><i />not yet</span>
        <span className="lg-free"><i />free</span>
      </div>

      {/* FIXED COLUMNS, because the rows change under the reader. With natural
          widths every poll re-measured the table and the columns jumped — Dan:
          "it's a bit of a jumbled mess". `table-layout: fixed` means a new row
          slides in without moving the four already on screen. */}
      <table className="live-table">
        <thead>
          <tr>
            <th className="lt">Time</th>
            {/* ONE PERSON COLUMN. Dan: "remove the HH owner here and just keep
                the participant column. If the participant IS the HH owner, just
                have their name in this column." Two columns where one of them
                was blank on every adult registration was half a table saying
                nothing, and the name a reader wants is whoever is IN the class. */}
            <th className="lp">Participant</th>
            <th className="ls">Section</th>
            <th className="lm">Price</th>
          </tr>
        </thead>
        <tbody>
          {/* TODAY'S ROWS. The day-break rule that used to separate them went
              with the seven-day list: over one day it can never fire, and a
              class nothing can apply is what sends the next reader looking for
              the feature it belonged to. */}
          {/* NOTHING YET TODAY IS A REAL STATE NOW, and it was unreachable
              before: with `today` taken from the newest row there was always at
              least one row in it. An empty tbody under live headers reads as a
              broken card, so it says what is true — the feed answered, the day
              is young. */}
          {todayRows.length === 0 ? (
            <tr data-live-empty="1"><td className="lt" colSpan={4}>
              No signups yet today.
            </td></tr>
          ) : null}
          {todayRows.slice(0, LIVE_ROWS).map(r => {
            const k = liveKey(r);
            return (
              <tr key={k} className={flash.has(k) ? 'live-new' : ''} data-live-new={flash.has(k) ? '1' : undefined}>
                <td className="lt">{liveWhen(r['Signed Up At'], today)}</td>
                {(() => {
                  const p = liveParticipant(r);
                  const u = liveUserUrl(recOrgId, p.id);
                  return (
                    <td className="lp" title={p.title}>
                      {u ? <a className="live-link" href={u} target="_blank" rel="noopener noreferrer"
                              data-live-participant={String(p.id)}>{p.name}</a>
                         : p.name}
                    </td>
                  );
                })()}
                <td className="ls" title={(r['Section'] || '') + (r['Program'] && r['Program'] !== r['Section'] ? ' \u00b7 ' + r['Program'] : '')}>{(() => {
                  const u = liveSectionUrl(recOrgId, r['Section Id']);
                  return u ? <a className="live-link" href={u} target="_blank" rel="noopener noreferrer"
                               data-live-section={String(r['Section Id'])}>{r['Section']}</a>
                           : r['Section'];
                })()}</td>
                {/* THE PRICE IS COLOURED BY WHAT ITS MONEY IS DOING, matching
                    the dots above it (Dan: "Full payment the price is in
                    green, partial or installment plan, price is in orange to
                    match the legend"). Unpaid keeps the default ink rather
                    than a third colour: the grey dot already says it, and a
                    grey PRICE reads as disabled. */}
                {(() => { const cell = livePriceCell(r); return (
                <td className={'lm live-' + liveMarkState(r)} data-live-price={liveMarkState(r)}
                    data-live-paid={cell.paid}>
                  {cell.paid
                    ? <React.Fragment>{cell.paid}<span className="live-of">{' / ' + cell.price}</span></React.Fragment>
                    : cell.price}
                </td>); })()}
              </tr>
            );
          })}
        </tbody>
      </table>

      <div className="live-foot">
        {at ? 'Updated ' + liveClock(at.getFullYear() + '-01-01T' + String(at.getHours()).padStart(2,'0') + ':' + String(at.getMinutes()).padStart(2,'0')) : ''}
        {paused ? ' \u00b7 paused' : ' \u00b7 refreshes every minute'}
        {/* The list is the top of a feed, not the whole of it — say so rather
            than letting eight rows read as the day's total. */}
        {todayRows.length > LIVE_ROWS ? ' \u00b7 showing ' + LIVE_ROWS + ' of ' + todayRows.length : ''}
      </div>
    </div>
  );
}

function ProgramsLive({ feed, recOrgId }) {
  const sound = useLiveSound('programs', feed.freshRows, liveChimeWorthy);
  const { rows, rollup, err, at, paused, flash } = feed;

  // Same three states as the counter, and for the same reasons: absence is for
  // a feed that FAILED, a skeleton is for one that has not answered yet, and a
  // confident zero is never rendered for either.
  if (err) return null;
  if (!rows) {
    return (
      <div className="widget-card widget-md live-card" data-live-progloading="1">
        <LiveCardHeader icon={'\u{1F3AF}'} title="Programs Live" feed={feed} card="programs" sound={sound} sub={'Loading the last ' + LIVE_DAYS + ' days\u2026'} />
        <div className="skeleton skeleton-chart" />
      </div>
    );
  }

  /* SAME DAY RULE AS THE OTHER TWO CARDS. This one keeps its SEVEN-day
     leaderboard (Dan: "Programs can stay 7 days") but its per-program "today"
     count had the identical defect — on a quiet morning it counted yesterday's
     signups as today's, in a column headed today. */
  const today = liveTodayFor(rows, 'Signed Up At');
  const progs = liveBySection(rows, today, rollup);
  // A row is fresh if any registration behind it is one of the arrivals the
  // shared feed just diffed — so a program lights up when it takes a signup,
  // which is the whole point of watching this card.
  /* WHAT JUST LANDED, PER SECTION — one pass over the arrivals rather than a
     scan of every row per program, and it carries the MONEY as well as the
     fact, so the row can say "+$215" instead of merely lighting up. The delta
     is summed from the same `flash` set the registrations list highlights, so
     the two cards cannot disagree about what arrived in the last minute. */
  const freshBy = new Map();
  rows.forEach(r => {
    if (liveDay(r['Signed Up At']) !== today || !flash.has(liveKey(r))) return;
    /* KEYED BY SECTION, like the rows. It was keyed by PROGRAMME while the
       rows were programmes; leaving it that way after the grain changed would
       light up every section of a programme when one of them took a signup,
       and add that programme's whole bump to each of their money cells. */
    const key = liveSectionKey(r);
    const g = freshBy.get(key) || { n: 0, charged: 0 };
    g.n += 1;
    const pr = Number(r['Price']);
    if (Number.isFinite(pr)) g.charged += pr;
    freshBy.set(key, g);
  });
  const totalPaid    = progs.reduce((n, g) => n + (g.paid || 0), 0);
  const todaySignups = progs.reduce((n, g) => n + (g.todaySignups || 0), 0);
  const totalSignups = progs.reduce((n, g) => n + g.signups, 0);

  /* NOTHING TODAY IS A REAL ANSWER, and it is not the same as a broken feed.
     Before registration opens this card legitimately has nothing, and saying
     so beats an empty table that reads as a failure. */
  if (!progs.length) {
    return (
      <div className="widget-card widget-md live-card" data-live-progs="0">
        <LiveCardHeader icon={'\u{1F3AF}'} title="Programs Live" feed={feed} card="programs" sound={sound}
                        sub={'Top sections by money received \u00b7 last ' + LIVE_DAYS + ' days'} />
        <div style={{padding:'18px 4px',fontSize:12,color:'var(--text-muted)'}}>
          No enrollments in the last {LIVE_DAYS} days.
        </div>
      </div>
    );
  }

  return (
    <div className="widget-card widget-md live-card" data-live-progs={String(progs.length)}>
      <LiveCardHeader icon={'\u{1F3AF}'} title="Programs Live" feed={feed} card="programs" sound={sound}
                      sub={'Top sections by money received \u00b7 last ' + LIVE_DAYS + ' days'} />

      {/* A SPACE IN THE TEXT AS WELL AS A GAP IN THE LAYOUT. The flex gap fixes
          what it looks like; `textContent` is still "15across" without the
          space, which is what a screen reader says and what a copy-paste
          carries. Dan reported the look; both are the same bug. */}
      <div className="live-big" data-live-progtotal={String(totalSignups)}>
        <strong>{totalSignups}</strong>{' '}
        <span>across {progs.length} section{progs.length > 1 ? 's' : ''}
          {totalPaid > 0 ? ' \u00b7 ' + liveMoney(totalPaid) + ' received' : ''}
          {todaySignups > 0 ? ' \u00b7 ' + todaySignups + ' today' : ''}</span>
      </div>

      <table className="live-table live-table-progs">
        <thead>
          <tr>
            <th className="lt">Last</th>
            <th className="ls">Section</th>
            <th className="lp">Signups</th>
            <th className="lm">Section revenue</th>
          </tr>
        </thead>
        <tbody>
          {progs.slice(0, LIVE_PROG_ROWS).map(g => (
            <tr key={g.key} className={freshBy.has(g.key) ? 'live-new' : ''}
                data-live-prog={g.section} data-live-prog-program={g.program}
                data-live-prog-signups={String(g.signups)}>
              <td className="lt">{liveClock(g.lastAt)}</td>
              {/* THE SECTION IS THE ROW, AND THE LINK OPENS EXACTLY IT. There is
                  no "+N" here any more and no most-recent-of-several: the name,
                  the count, the money and the destination are one section, so
                  clicking a figure lands on a page showing that figure. The old
                  programme row summed five sections and opened one of them,
                  which is the 10x mismatch Dan hit.

                  The programme is the SUB-LINE, because "Compulsory 2 Practice"
                  alone does not say what it belongs to — but it is context, not
                  the identity, and it is not a link. Plain text when the feed
                  carried no section id: a link to nowhere is worse than none. */}
              <td className="ls" title={g.program ? g.section + ' \u00b7 ' + g.program : g.section}>
                {(() => {
                  const u = liveSectionUrl(recOrgId, g.sectionId);
                  return (
                    <React.Fragment>
                      {u ? <a className="live-link" href={u} target="_blank" rel="noopener noreferrer"
                              data-live-prog-section={g.sectionId}>{g.section}</a>
                         : g.section}
                      {g.program && g.program !== g.section
                        ? <span className="live-sub-prog">{g.program}</span> : null}
                    </React.Fragment>
                  );
                })()}
              </td>
              {/* THE COUNT, AND WHETHER IT IS STILL MOVING. The number alone
                  answers "how many"; the arrow answers "do I need to do
                  something about it", which is the decision this card exists
                  to support.

                  DOWN IS THE EMPHASISED ONE, deliberately. A programme filling
                  nicely needs nothing from the reader; one that has stopped
                  catching is the one to promote, so it carries the colour and
                  "up" stays quiet. That also keeps this column clear of the
                  green/orange the PRICE column uses for payment state — two
                  greens meaning two different things on one card is how a
                  status stops being readable.

                  ABSENT UNDER THE FLOOR, never a flat dash pretending to be a
                  measurement. */}
              <td className="lp" data-live-prog-trend={g.trend ? g.trend.dir : ''}>
                {g.signups}
                {g.trend ? (
                  <span className={'live-trend live-trend-' + g.trend.dir}
                        title={'Last ' + LIVE_TREND_DAYS + ' complete days: ' + g.trend.recent +
                               ' signup' + (g.trend.recent === 1 ? '' : 's') + ' vs ' + g.trend.prior +
                               ' the ' + LIVE_TREND_DAYS + ' before' +
                               (g.trend.pct == null ? ' (no signups to compare against)'
                                                    : ' \u00b7 ' + (g.trend.pct > 0 ? '+' : '') + g.trend.pct + '%') +
                               ' \u00b7 today is excluded, it is still filling'}>
                    {g.trend.dir === 'up' ? '\u25b2' : g.trend.dir === 'down' ? '\u25bc' : '\u2013'}
                    {g.trend.pct == null && g.trend.dir === 'up'
                      ? <span className="live-trend-new">new</span> : null}
                  </span>
                ) : null}
              </td>
              {/* PROGRAM REVENUE IS MONEY RECEIVED (Dan, 2026-09-04: "Change
                  'charged' on the programs live chart to 'Program Revenue'",
                  and "it needs to match ... Programs->Revenue"). That tab
                  counts payments RECEIVED, so this column counts the same
                  thing — `Paid`, what has actually succeeded — and the amount
                  charged is shown underneath only when the two differ, which
                  is a payment plan.

                  IT STILL WILL NOT EQUAL THAT TAB'S TOTAL, and no code here
                  can make it: card 17295 windows on SESSION dates, this feed
                  windows on the SIGNUP date. Measured at Watertown on
                  2026-09-04 — of 13 enrollments taking $1,082, NONE were for a
                  section running that day and only 4 ($270) for a section
                  running in September at all; the other 9 are fall and winter
                  programming, which lands in those months' windows over there.
                  Same money, filed by when the programme RUNS rather than when
                  it SOLD. The sub-line says which basis this is, and the two
                  agree on the INCREMENT — which is the thing you get from
                  watching it live.

                  No readable money on any row is a dash, never $0. */}
              <td className="lm" data-live-prog-charged={g.paid == null ? '' : String(g.paid)}>
                {g.paid == null ? '\u2014' : liveMoney(g.paid)}
                {/* THE INCREMENT, only while it is news. A total that grew by
                    $215 is a different thing to read than a total that is
                    $215, so the delta is signed and sits beside the figure
                    rather than replacing it. */}
                {(() => {
                  const f = freshBy.get(g.key);
                  return f && f.charged > 0
                    ? <span className="live-bump" data-live-bump={String(Math.round(f.charged))}>{'+' + liveMoney(f.charged)}</span>
                    : null;
                })()}
                {g.charged != null && g.paid != null && g.paid !== g.charged
                  ? <div className="lm-sub"
                         title="Charged in full at enrollment; the rest arrives on the payment plan.">
                      of {liveMoney(g.charged)} charged
                    </div>
                  : null}
              </td>
            </tr>
          ))}
        </tbody>
      </table>

      <div className="live-foot">
        {at ? 'Updated ' + liveClock(at.getFullYear() + '-01-01T' + String(at.getHours()).padStart(2,'0') + ':' + String(at.getMinutes()).padStart(2,'0')) : ''}
        {paused ? ' \u00b7 paused' : ' \u00b7 refreshes every minute'}
        {progs.length > LIVE_PROG_ROWS ? ' \u00b7 showing top ' + LIVE_PROG_ROWS + ' of ' + progs.length : ''}
      </div>
    </div>
  );
}

const LIVE_CHECKIN_ROWS = 12;
/* AND THE 2x CARD'S OWN CAP. Doubling the height without raising this would
   have moved the dead space rather than filled it — the card would be twice as
   tall with the same twelve faces and a "+25 more today" under them, which is
   the exact complaint the option exists to answer. Forty-eight roughly fills
   the taller card's list at the wider tile the detail lines need, and the
   remainder scrolls inside the card rather than growing the grid row. */
const LIVE_CHECKIN_ROWS_TALL = 48;

/* ITS OWN FEED AND ITS OWN POLL. Same cadence and the same two rules the
   registrations feed just had fixed — pause stops the clock, and coming back
   to the tab refetches, because a 60-second interval in a hidden tab is not a
   60-second interval. The spec requires BOTH hooks to carry those, which is
   the mechanical guard against the pair drifting.

   NO SOUND. The chime says "somebody just gave you money"; a beep every time
   the front desk scans a card would be unbearable in a busy gym and would
   train people to mute the whole section, taking the registrations chime with
   it. */
function useLiveCheckins(onAvailable, enabled, feed) {
  const [rows, setRows] = useState(null);
  const [err, setErr]   = useState(false);
  const [at, setAt]     = useState(null);
  const [paused, setPaused] = useState(false);
  const [loading, setLoading] = useState(true);
  const [flash, setFlash] = useState(new Set());
  const [freshRows, setFreshRows] = useState(null);
  const seenRef = React.useRef(null);
  const timerRef = React.useRef(null);
  const pausedRef = React.useRef(paused);

  const load = React.useCallback(() => {
    /* NO CARD, NO REQUEST. Without a public link the route 404s, and polling it
       every sixty seconds for every org that does not have it would be a
       self-inflicted error rate that looks exactly like a broken feed in the
       logs. The caller knows from `availableReports`; the hook is told. */
    if (!enabled) { setLoading(false); if (onAvailable) onAvailable(false); return; }
    /* TWO DAYS, NOT ONE, AND THE SECOND ONE IS NOT OPTIONAL. `liveWindow`
       builds dates in the VIEWER's zone; the card windows on the ORG's. So
       once it is tomorrow for the viewer and still today at the rec centre —
       every night from the org's midnight-in-viewer-time onwards, which for a
       Denver org read from Eastern is 22:00 to 00:00 daily and worse for a
       Pacific one — a one-day window asks for a date the org has not reached
       and the card comes back EMPTY.

       Measured against the live card while writing this: today's window
       returned 0 rows at apex and el-segundo, and the previous day returned
       1,150 and 198. An empty live card at 10pm is exactly the confident zero
       this widget was built not to render.

       Asking for yesterday too costs one more day of rows and fixes it for
       every zone, because `today` below is derived from the newest row's own
       org-timezone stamp rather than from the viewer's clock. Same shape as
       the registrations card, which absorbs this by asking for seven. */
    /* THE LIGHT PATH ASKS FOR NOTHING BUT THE ORG. Card 21552 resolves the
       org's own today in SQL, so the second day this hook used to ask for —
       whose only job was to let the page work out what that day WAS — is not
       needed at all. Measured at apex: 1,314 rows / 9.8s / 319KB for two days
       against 164 rows / 0.7s for one, every sixty seconds. */
    const light = feed === 'light';
    const report = light ? 'checkins-today' : 'checkins-live';
    const w = liveWindow(2);
    const qs = new URLSearchParams(light ? {} : { start: w.start, end: w.end });
    const url = IS_SHARE
      ? `/share/${SHARE_TOKEN}/data/${report}?${qs}`
      : `/${ORG_SLUG}/api/data/${report}?token=${TOKEN}&${qs}`;
    setLoading(true);
    fetch(url)
      .then(r => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
      .then(j => {
        if (!j || !Array.isArray(j.rows)) throw new Error('shape');
        const keys = j.rows.map(liveCheckinKey);
        const seen = seenRef.current;
        /* THE FIRST LOAD HIGHLIGHTS NOTHING, same rule as the registrations
           card: opening the dashboard mid-afternoon must not flash four
           hundred rows as though everyone just walked in. */
        if (seen) {
          const fresh = keys.filter(k => !seen.has(k));
          if (fresh.length) {
            setFlash(new Set(fresh));
            /* AND PUBLISH THEM, or the card is silent forever. This hook
               computed `fresh` for the highlight and never handed it over —
               so `useLiveSound('checkins', feed.freshRows, ...)` was called
               with undefined and bailed on its own guard every time. The
               enrollments hook had the line; this one did not, which is why
               only one of the two cards ever made a noise. */
            setFreshRows(fresh.map(k => j.rows[keys.indexOf(k)]).filter(Boolean));
            clearTimeout(timerRef.current);
            /* THE FACES HOLD LONGER THAN A ROW DOES — see LIVE_FACE_FLASH_MS.
               This card's highlight IS the face, so the class has to outlast
               the ring's fade rather than the ten seconds a table row gets. */
            timerRef.current = setTimeout(() => setFlash(new Set()), LIVE_FACE_FLASH_MS);
          }
        }
        seenRef.current = new Set(keys);
        setRows(j.rows); setErr(false); setAt(new Date()); setLoading(false);
        if (onAvailable) onAvailable(true);
      })
      .catch(() => { setErr(true); setLoading(false); if (onAvailable) onAvailable(false); });
  }, [onAvailable, enabled, feed]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const wasPaused = pausedRef.current;
    pausedRef.current = paused;
    if (paused || !enabled) return;
    if (wasPaused) load();
    const t = setInterval(load, LIVE_POLL_MS);
    return () => clearInterval(t);
  }, [load, paused, enabled]);
  useEffect(() => {
    const onVis = () => {
      if (document.visibilityState === 'visible' && !pausedRef.current) load();
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [load]);
  useEffect(() => () => clearTimeout(timerRef.current), []);

  return { rows, err, at, paused, setPaused, flash, freshRows, loading, refresh: load };
}

function MembershipCheckins({ feed, recOrgId, tall }) {
  /* AN ACCEPTED SCAN RINGS; A REFUSAL DOES NOT. A denial is not attendance, and
     a card that chimed when the desk turned somebody away would be announcing
     the opposite of what happened. */
  const sound = useLiveSound('checkins', feed.freshRows, r => liveCheckinState(r) === 'ok');
  const { rows, err, flash } = feed;

  /* ABSENT, NEVER A CONFIDENT ZERO. A feed that has not answered is not a desk
     nobody walked through — and "0 check-ins today" on a busy morning is the
     reading that had to be impossible. The section hides itself when its
     widgets do. */
  if (err) return null;
  if (!rows) {
    return (
      /* THE LOADING CARD CARRIES THE HEIGHT TOO, or the grid reflows the
         moment the first fetch lands and every card on the row jumps. */
      <div className={'widget-card widget-md live-card' + (tall ? ' widget-tall ci-tall' : '')}
           data-live-checkins="loading" data-live-ci-tall={tall ? '1' : '0'}>
        <LiveCardHeader icon={'\u{1F6C2}'} title="Membership Check-Ins" feed={feed} card="checkins" sound={sound}
                        sub={'Members and passes as they scan in \u00b7 today'} />
        <div className="live-empty">{'Loading\u2026'}</div>
      </div>
    );
  }

  const today = liveTodayFor(rows, 'Checked In At');
  const todayRows = rows.filter(r => liveDay(r['Checked In At']) === today);
  /* THE HEADLINE COUNTS ACCEPTED SCANS ONLY. A denial is not attendance. The
     refusals are still on screen — they are the interesting rows — but they
     are counted separately and said out loud rather than folded in. */
  const okRows   = todayRows.filter(r => liveCheckinState(r) === 'ok');
  const failed   = todayRows.length - okRows.length;
  const people   = new Set(okRows.map(r => r['User ID'] || r['Member'])).size;
  const tl = liveCheckinTimeline(rows, today);

  /* HOW MANY FACES. The taller card gets a bigger cap or the extra height is
     empty — see LIVE_CHECKIN_ROWS_TALL. */
  const cap = tall ? LIVE_CHECKIN_ROWS_TALL : LIVE_CHECKIN_ROWS;

  /* WHERE TODAY'S SCANS HAPPENED. Computed over ALL of today's rows rather
     than the capped slice, so the answer does not change as the day fills up
     and pushes rows past the cap.

     ONE PLACE IS SAID ONCE, NOT FORTY-FIVE TIMES. Measured over 30 days: eight
     orgs run exactly one desk — Piedmont 7,254 scans, Buffalo 2,126, Jurupa
     1,526 among them — so a per-face line there is the same string repeated
     down the whole card. It is hoisted into the header's own sub-line instead,
     where it is a scope note rather than a column of noise. Two or more and it
     goes per face, which is what apex's 23 desks and Clarkstown's six actually
     need. Same shape as the status pill row that only appears with two live
     statuses, one repo over. */
  const wheres    = Array.from(new Set(todayRows.map(liveCheckinWhere).filter(Boolean)));
  const showWhere = tall && wheres.length > 1;
  const oneWhere  = tall && wheres.length === 1 ? wheres[0] : '';
  const sub = 'Members and passes as they scan in \u00b7 today' + (oneWhere ? ' \u00b7 ' + oneWhere : '');

  return (
    <div className={'widget-card widget-md live-card' + (tall ? ' widget-tall ci-tall' : '') +
                    (showWhere ? ' ci-where' : '')}
         data-live-checkins={String(rows.length)} data-live-ci-tall={tall ? '1' : '0'}
         data-live-ci-wheres={String(wheres.length)}>
      <LiveCardHeader icon={'\u{1F6C2}'} title="Membership Check-Ins" feed={feed} card="checkins" sound={sound}
                      sub={sub} />

      <div className="live-count">
        <span className="live-n" data-live-ci-today={String(okRows.length)}>{okRows.length}</span>
        <span className="live-u">
          {okRows.length === 1 ? 'check-in' : 'check-ins'} today
          {people && people !== okRows.length ? ' \u00b7 ' + people + (people === 1 ? ' member' : ' members') : ''}
          {/* A REFUSAL COUNT WITH NO REASON BESIDE IT, because the log records
              none: attendance_event.side_effects is empty on all 58 denials
              platform-wide, and of 52 membership refusals only 5 had an
              expired, unstarted or cancelled membership. Inventing a "why"
              would be a confident sentence sitting beside real rows. */}
          {failed ? <span className="live-ci-fail" data-live-ci-failed={String(failed)}
                          title="Scans the desk turned away. The log records no reason, so none is shown."
                    >{' \u00b7 ' + failed + ' turned away'}</span> : null}
        </span>
      </div>

      {/* THE CARD THIS WAS BUILT FOR. Apex scans 468 members before three in
          the afternoon, all of them inside a third of the axis, so this lane
          is always over the threshold and always columns — and a refusal
          stacks on top of its quarter-hour rather than shortening it. */}
      <LiveLane tl={tl} flash={flash} prefix="live-ci-" cls={st => 'ci-' + st}
                states={LIVE_CI_STATES}
                title="Every scan today, placed at the time it happened. Green accepted, red turned away." />
      <div className="live-legend" data-live-ci-legend="1">
        <span className="lg-paid"><i />accepted</span>
        <span className="lg-fail"><i />turned away</span>
      </div>

      {/* WHO. The ask was for the people, not only the count — the same
          dead-end this repo keeps writing down, where a number has nowhere to
          go. Newest first, capped, and the cap SAYS SO rather than trailing
          off. */}
      {todayRows.length === 0 ? (
        <div className="live-empty">No membership or pass check-ins today yet.</div>
      ) : (
        <React.Fragment>
          {/* TODAY'S ROWS, the same set the headline counts. Reading `rows`
              here would put a scan from another day among the faces under a
              number that excluded it — one card disagreeing with itself. */}
          <div className="live-ci-people" data-live-ci-people={String(Math.min(todayRows.length, cap))}>
            {todayRows.slice(0, cap).map(r => {
              const st = liveCheckinState(r);
              const u  = liveUserUrl(recOrgId, r['User ID']);
              const nm = r['Member'] || '(no name)';
              const prod  = liveCheckinProduct(r);
              const where = liveCheckinWhere(r);
              const face = (
                <span className={'ci-face ci-' + st} data-live-ci-face={r['Photo'] ? 'photo' : 'initials'}>
                  {/* THE PHOTO IS A BONUS, NOT THE LAYOUT. Initials sit
                      underneath it, so a 2%-coverage org gets a full row of
                      faces rather than a row of holes — and a broken image URL
                      falls back to them rather than to a torn-page glyph. */}
                  {r['Photo']
                    ? <img src={r['Photo']} alt="" loading="lazy"
                           onError={e => { e.target.style.display = 'none'; }} />
                    : null}
                  <em>{liveInitials(nm)}</em>
                </span>
              );
              return (
                <span key={liveCheckinKey(r)}
                      className={'ci-person' + (flash.has(liveCheckinKey(r)) ? ' live-new' : '')}
                      data-live-ci-person={nm} data-live-ci-status={st}
                      title={liveClock(r['Checked In At']) + ' \u00b7 ' + nm + ' \u00b7 ' +
                             (r['Product'] || '') + ' \u00b7 ' + (r['Desk Location'] || '') +
                             (st === 'failed' ? ' \u00b7 turned away' : '')}>
                  {/* A LINK ONLY WHERE THERE IS AN ID. "User ID" is users.id,
                      the uuid the admin URL takes — never "Member ID", the
                      six-character desk code, which looks identical in a link
                      and 404s. No id, plain text: a link to nowhere is worse
                      than none. */}
                  {u ? <a href={u} target="_blank" rel="noopener noreferrer"
                          data-live-ci-link={r['User ID']}>{face}</a> : face}
                  <b>{nm.split(/\s+/)[0]}</b>
                  <i>{liveClock(r['Checked In At'])}</i>
                  {/* THE HOVER, PRINTED. Dan: "there's mouse hover data there
                      now, would like to show that under their profile photo in
                      the '2x height' view." Tall only — the short card has no
                      room and keeps exactly what it has today, which is what
                      he asked for. The title stays on the tile either way, so
                      a name or a place too long for 92px is still readable by
                      hovering rather than lost. Each line is dropped rather
                      than rendered empty, or a row with no product on file
                      would leave a gap that reads as a missing value. */}
                  {tall && prod ? <em data-live-ci-product={prod}>{prod}</em> : null}
                  {showWhere && where ? <u data-live-ci-where={where}>{where}</u> : null}
                </span>
              );
            })}
          </div>
          {todayRows.length > cap
            ? <div className="live-more" data-live-ci-more={String(todayRows.length - cap)}>
                {'+' + (todayRows.length - cap) + ' more today'}
              </div>
            : null}
        </React.Fragment>
      )}
    </div>
  );
}

/* HOW MANY BOOKINGS ARE LISTED. Fewer than the check-ins card's twelve faces
   because each row here carries a site, a customer and a schedule rather than
   a circle — and this card sits beside three others that all have to fit on
   one screen. */
const LIVE_FACILITY_ROWS = 7;

/* ONE DAY, ONE CARD, ONE POLL. Deliberately a separate hook rather than a
   fourth reader of the enrollments feed: this is its own Metabase question, so
   its failure must not take the other cards off the page — the same reason the
   check-ins card has its own. */
function useLiveFacility(onAvailable, enabled) {
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(false);
  const [at, setAt] = useState(null);
  const [paused, setPaused] = useState(false);
  const [flash, setFlash] = useState(new Set());
  const [freshRows, setFreshRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const seenRef = React.useRef(null);
  const timerRef = React.useRef(null);
  const pausedRef = React.useRef(false);

  const load = React.useCallback(() => {
    if (!enabled) { setLoading(false); return; }
    const url = IS_SHARE
      ? `/share/${SHARE_TOKEN}/data/facility-today`
      : `/${ORG_SLUG}/api/data/facility-today?token=${TOKEN}`;
    fetch(url)
      .then(r => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
      .then(j => {
        if (!j || !Array.isArray(j.rows)) throw new Error('shape');
        const keys = j.rows.map(liveFacilityKey);
        const seen = seenRef.current;
        /* THE FIRST LOAD HIGHLIGHTS NOTHING, same rule as the other three:
           opening the dashboard mid-afternoon must not flash a day's worth of
           bookings as though they had all just landed. */
        if (seen) {
          const fresh = keys.filter(k => !seen.has(k));
          if (fresh.length) {
            setFlash(new Set(fresh));
            setFreshRows(fresh.map(k => j.rows[keys.indexOf(k)]).filter(Boolean));
            clearTimeout(timerRef.current);
            timerRef.current = setTimeout(() => setFlash(new Set()), LIVE_FLASH_MS);
          }
        }
        seenRef.current = new Set(keys);
        setRows(j.rows); setErr(false); setAt(new Date()); setLoading(false);
        if (onAvailable) onAvailable(true);
      })
      .catch(() => { setErr(true); setLoading(false); if (onAvailable) onAvailable(false); });
  }, [onAvailable, enabled]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const wasPaused = pausedRef.current;
    pausedRef.current = paused;
    if (paused || !enabled) return;
    if (wasPaused) load();
    const t = setInterval(load, LIVE_POLL_MS);
    return () => clearInterval(t);
  }, [load, paused, enabled]);
  useEffect(() => {
    const onVis = () => {
      if (document.visibilityState === 'visible' && !pausedRef.current) load();
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [load]);
  useEffect(() => () => clearTimeout(timerRef.current), []);

  return { rows, err, at, paused, setPaused, flash, freshRows, loading, refresh: load };
}

function FacilityBookings({ feed, recOrgId }) {
  /* A BOOKING RINGS; A CANCELLATION DOES NOT. A card that chimed when somebody
     gave a court back would be announcing the opposite of what happened — the
     same judgement the check-ins card makes about a refused scan. */
  const sound = useLiveSound('facility', feed.freshRows, r => liveFacilityState(r) === 'booked');
  const { rows, err, flash } = feed;

  /* ABSENT, NEVER A CONFIDENT ZERO. A feed that has not answered is not a
     morning nobody booked anything. */
  if (err) return null;
  if (!rows) {
    return (
      <div className="widget-card widget-md live-card" data-live-facility="loading">
        <LiveCardHeader icon={'\u{1F3DF}'} title="Facility Bookings" feed={feed} card="facility" sound={sound}
                        sub={'Courts, fields and rooms as they book \u00b7 today'} />
        <div className="live-empty">{'Loading\u2026'}</div>
      </div>
    );
  }

  const today = liveTodayFor(rows, 'Booked At');
  const todayRows = rows.filter(r => liveDay(r['Booked At']) === today);
  /* THE HEADLINE COUNTS BOOKINGS THAT STAND. Cancellations are on the card and
     counted, exactly as refused scans are one card up, but they are not
     bookings and folding them in would overstate what is on the books. */
  const bookedRows = todayRows.filter(r => liveFacilityState(r) === 'booked');
  const canceled   = todayRows.length - bookedRows.length;
  const money  = bookedRows.reduce((a, r) => a + (Number(r['Price']) || 0), 0);
  const hours  = bookedRows.reduce((a, r) => a + (Number(r['Hours']) || 0), 0);
  /* SELF-SERVICE IS THE NUMBER WORTH WATCHING. 81% of rentals platform-wide are
     `instant` — somebody booking a court on their phone rather than a staff
     member typing it in — and that is the half a parks department is trying to
     grow. Absent rather than "0%" when nothing has booked yet: no bookings is
     not a self-service failure. */
  const instant = bookedRows.filter(r => r['Booking Type'] === 'Instant').length;
  const tl = liveFacilityTimeline(rows, today);

  return (
    <div className="widget-card widget-md live-card" data-live-facility={String(rows.length)}>
      <LiveCardHeader icon={'\u{1F3DF}'} title="Facility Bookings" feed={feed} card="facility" sound={sound}
                      sub={'Courts, fields and rooms as they book \u00b7 today'} />

      <div className="live-count">
        <span className="live-n" data-live-fac-today={String(bookedRows.length)}>{bookedRows.length}</span>
        <span className="live-u">
          {bookedRows.length === 1 ? 'booking' : 'bookings'} today
          {liveMoney(money) ? ' \u00b7 ' + liveMoney(money) : ''}
          {hours > 0 ? ' \u00b7 ' + (Math.round(hours * 10) / 10) + 'h' : ''}
          {canceled ? <span className="live-ci-fail" data-live-fac-canceled={String(canceled)}
                            title="Rentals cancelled today. Cancelling a rental cancels its slots, so these have no court or time left to show."
                      >{' \u00b7 ' + canceled + ' cancelled'}</span> : null}
        </span>
      </div>

      <LiveLane tl={tl} flash={flash} prefix="live-fac-" cls={st => 'fac-' + st}
                states={LIVE_FAC_STATES}
                title="Every booking made today, placed at the time it was made. Green stands, red cancelled." />
      <div className="live-legend" data-live-fac-legend="1">
        <span className="lg-paid"><i />booked</span>
        <span className="lg-fail"><i />cancelled</span>
        {/* SELF-SERVICE SHARE, in the legend rather than as a fourth KPI: it is
            a fact about the bookings beside it, not a headline of its own. */}
        {bookedRows.length
          ? <span className="lg-note" data-live-fac-instant={String(instant)}
                  title="Booked by the customer themselves rather than entered by staff. 81% of rentals platform-wide are self-service.">
              {instant + ' of ' + bookedRows.length + ' self-service'}
            </span>
          : null}
      </div>

      <table className="live-table live-table-fac">
        <thead>
          <tr>
            <th className="lt">Booked</th>
            <th className="lp">Who</th>
            <th className="ls">Site</th>
            <th className="lm">For</th>
          </tr>
        </thead>
        <tbody>
          {todayRows.length === 0 ? (
            <tr data-live-fac-empty="1"><td className="lt" colSpan={4}>
              No bookings yet today.
            </td></tr>
          ) : null}
          {todayRows.slice(0, LIVE_FACILITY_ROWS).map(r => {
            const k  = liveFacilityKey(r);
            const st = liveFacilityState(r);
            const who = liveFacilityWho(r);
            const u = liveUserUrl(recOrgId, who.id);
            /* A SITE THAT SPANS COURTS SAYS SO. A rental can carry more than
               one, and printing the first as though it were the whole booking
               is the confident half-truth this repo keeps recording. */
            const siteCount = Number(r['Site Count']) || 0;
            const site = r['Site'] ? (r['Site'] + (siteCount > 1 ? ' +' + (siteCount - 1) : '')) : '\u2014';
            return (
              <tr key={k} className={flash.has(k) ? 'live-new' : ''}
                  data-live-fac-row={st} data-live-new={flash.has(k) ? '1' : undefined}>
                <td className="lt">{liveWhen(r['Booked At'], today)}</td>
                <td className="lp" title={who.name + (r['Rental'] && r['Rental'] !== who.name ? ' \u00b7 ' + r['Rental'] : '')}>
                  {/* A LINK ONLY WHERE THERE IS AN ID — and a staff rental with
                      no customer account has none, so it renders as plain text
                      rather than as a link to nowhere. */}
                  {u ? <a className="live-link" href={u} target="_blank" rel="noopener noreferrer"
                          data-live-fac-user={who.id}>{who.name}</a>
                     : who.name}
                </td>
                <td className="ls" data-live-fac-site={r['Site'] || ''}
                    title={(r['Site'] || '') + (r['Location'] ? ' \u00b7 ' + r['Location'] : '')}>
                  {site}
                  {r['Location'] ? <span className="live-sub-prog">{r['Location']}</span> : null}
                </td>
                {/* WHAT WAS BOOKED, not what it cost: the money is already in
                    the headline, and "which court, when" is the question a
                    front desk is watching this card to answer. A cancellation
                    has no slot left, so it says that instead of an empty cell. */}
                <td className="lm" data-live-fac-when={st === 'canceled' ? 'canceled' : liveFacilityWhen(r)}
                    title={st === 'canceled' ? 'Cancelled — its slots went with it'
                                             : (r['First Slot'] || '') + ' \u00b7 ' + (r['Hours'] || 0) + 'h'}>
                  {st === 'canceled'
                    ? <span className="live-ci-fail">cancelled</span>
                    : liveFacilityWhen(r)}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      {todayRows.length > LIVE_FACILITY_ROWS
        ? <div className="live-more" data-live-fac-more={String(todayRows.length - LIVE_FACILITY_ROWS)}>
            {'+' + (todayRows.length - LIVE_FACILITY_ROWS) + ' more today'}
          </div>
        : null}
    </div>
  );
}

/* ONE DAY'S SCHEDULE, POLLED LIKE THE OTHERS. Its own hook and its own
   verdict, for the reason all five have their own: this is a separate
   Metabase question, and a schedule that cannot answer must not take the
   registrations counter off the page.

   NO ARRIVAL DIFF HERE, deliberately. The other four cards highlight rows
   that have just landed; today's schedule was already decided before anyone
   opened the dashboard, so there is nothing to announce and the green is
   about a session STARTING rather than about a row appearing. */
function useLiveHappening(onAvailable, enabled) {
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(false);
  const [at, setAt] = useState(null);
  const [paused, setPaused] = useState(false);
  const [loading, setLoading] = useState(true);
  const pausedRef = React.useRef(false);

  const load = React.useCallback(() => {
    if (!enabled) { setLoading(false); return; }
    const url = IS_SHARE
      ? `/share/${SHARE_TOKEN}/data/happening-today`
      : `/${ORG_SLUG}/api/data/happening-today?token=${TOKEN}`;
    fetch(url)
      .then(r => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
      .then(j => {
        if (!j || !Array.isArray(j.rows)) throw new Error('shape');
        setRows(j.rows); setErr(false); setAt(new Date()); setLoading(false);
        if (onAvailable) onAvailable(true);
      })
      .catch(() => { setErr(true); setLoading(false); if (onAvailable) onAvailable(false); });
  }, [onAvailable, enabled]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const wasPaused = pausedRef.current;
    pausedRef.current = paused;
    if (paused || !enabled) return;
    if (wasPaused) load();
    const t = setInterval(load, LIVE_POLL_MS);
    return () => clearInterval(t);
  }, [load, paused, enabled]);
  useEffect(() => {
    const onVis = () => {
      if (document.visibilityState === 'visible' && !pausedRef.current) load();
    };
    document.addEventListener('visibilitychange', onVis);
    return () => document.removeEventListener('visibilitychange', onVis);
  }, [load]);

  return { rows, err, at, paused, setPaused, loading, refresh: load };
}

function HappeningToday({ feed, recOrgId, tall }) {
  const { rows, err } = feed;

  /* ABSENT, NEVER THE CHEERFUL EMPTY STATE. A feed that could not answer is
     not a quiet day, and "enjoy the time off!" over a broken query is the one
     reading this card must never produce. */
  if (err) return null;
  if (!rows) {
    return (
      <div className={'widget-card widget-md live-card' + (tall ? ' widget-tall' : '')}
           data-live-happening="loading" data-live-ht-tall={tall ? '1' : '0'}>
        <LiveCardHeader icon={'\u{1F4C5}'} title="Happening Today" feed={feed} card="happening"
                        sub={'Every program running today'} />
        <div className="live-empty">{'Loading…'}</div>
      </div>
    );
  }

  const ahead = htVisible(rows);
  const liveN = ahead.filter(r => htState(r) === 'live').length;
  const done  = rows.length - ahead.length;
  /* THE ORG'S OWN ZONE, read off the rows — the row-level marker below is
     only drawn when a session's location disagrees with it. */
  const orgTz = (rows.find(r => r && r['Org Timezone']) || {})['Org Timezone'] || '';

  return (
    <div className={'widget-card widget-md live-card' + (tall ? ' widget-tall' : '')}
         data-live-ht-tall={tall ? '1' : '0'}
         data-live-happening={String(rows.length)} data-ht-orgtz={orgTz}>
      <LiveCardHeader icon={'\u{1F4C5}'} title="Happening Today" feed={feed} card="happening"
                      sub={'Every program running today'} />

      {/* THE HEADLINE COUNTS WHAT IS LEFT, and names what has gone. A list that
          shortens through the day with nothing saying why reads as a feed
          losing rows; "18 still to come, 22 finished" says it is working. */}
      <div className="live-count">
        <span className="live-n" data-ht-remaining={String(ahead.length)}>{ahead.length}</span>
        <span className="live-u">
          {' still to come'}
          {liveN ? <span data-ht-live={String(liveN)}>{' · ' + liveN + ' happening now'}</span> : null}
          {done ? <span data-ht-done={String(done)}>{' · ' + done + ' finished'}</span> : null}
        </span>
      </div>

      {/* TWO EMPTY STATES, because they are two different days. A day with
          nothing on it is Dan's line verbatim; a day whose programmes have all
          run is not the time off, it is the end of a busy one — and printing
          "enjoy the time off" at 9pm to a team that ran forty sessions reads
          as the card having lost them. */}
      {rows.length === 0 ? (
        <div className="live-empty" data-ht-empty="none">
          No programs happening today - enjoy the time off!
        </div>
      ) : ahead.length === 0 ? (
        <div className="live-empty" data-ht-empty="done">
          {'That’s a wrap — all ' + rows.length + (rows.length === 1 ? ' program' : ' programs')
            + ' today have finished.'}
        </div>
      ) : (
        <div className="ht-list" data-ht-rows={String(ahead.length)}>
          {ahead.map(r => {
            const st  = htState(r);
            const url = liveSectionUrl(recOrgId, r['Section Id']);
            const enr = Number(r['Enrolled']) || 0;
            /* NULL CAPACITY IS UNLIMITED, NOT ZERO. "11/0" is a number that
               cannot be true, and fmtNum(undefined) is how it gets printed. */
            const capRaw = r['Capacity'];
            const cap = capRaw === null || capRaw === undefined || capRaw === '' ? null : Number(capRaw);
            const full = cap !== null && cap > 0 && enr >= cap;
            /* A SESSION CAN HOLD MORE THAN ONE SITE — up to four, measured —
               so the card aggregates them and the row says how many rather
               than printing the first as though it were the whole booking. */
            const siteCount = Number(r['Site Count']) || 0;
            const site = r['Site'] ? (r['Site'] + (siteCount > 1 ? ' +' + (siteCount - 1) : '')) : '';
            /* WHOSE CLOCK, when it is not the org's. */
            const dtz = r['Display Timezone'] || '';
            const offZone = dtz && orgTz && dtz !== orgTz ? htZoneLabel(dtz) : '';
            const where = [site, r['Location']].filter(Boolean).join(' · ');
            const cancelled = r['Cancelled'] === true || r['Cancelled'] === 'true';
            const unpub = r['Published'] === false || r['Published'] === 'false';
            return (
              <div key={r['Session Id']}
                   className={'ht-row' + (st === 'live' ? ' ht-row-live' : '')
                              + (cancelled ? ' ht-row-cancel' : '')}
                   data-ht-row={st} data-ht-session={r['Session Id']}
                   title={(r['Section'] || '') + (r['Program'] ? ' · ' + r['Program'] : '')
                          + (where ? ' · ' + where : '')
                          + (unpub ? ' · section is not published' : '')}>
                <span className="ht-when" data-ht-when={htRange(r)}>{htRange(r)}</span>
                <span className="ht-what">
                  {/* THE LINK IS THE SECTION'S OWN admin page — Dan asked for a
                      click straight into Rec. Absent, not dead, where there is
                      no org id to build one from. */}
                  <span className="ht-name">
                    {url
                      ? <a className="live-link" href={url} target="_blank" rel="noopener noreferrer"
                           data-ht-link={r['Section Id']}>{r['Section'] || '—'}</a>
                      : (r['Section'] || '—')}
                    {cancelled
                      ? <span className="live-ci-fail ht-note" data-ht-cancelled="1">{' cancelled'}</span>
                      : null}
                  </span>
                  <span className="ht-where">
                    {where || '—'}
                    {offZone
                      ? <span data-ht-zone={dtz} title={'This session is at a location in ' + dtz + ', so its time is that clock rather than the org\'s. The list is ordered by the actual moment, which is why it can look out of order.'}>
                          {' · ' + offZone + ' time'}
                        </span>
                      : null}
                    {unpub ? <span className="ht-note" data-ht-unpublished="1">{' · unpublished'}</span> : null}
                  </span>
                </span>
                {/* "11/20", Dan's own example. */}
                <span className={'ht-enr' + (full ? ' ht-enr-full' : '')}
                      data-ht-enrolled={enr + '/' + (cap === null ? '—' : cap)}
                      title={cap === null ? 'No capacity set on this section — unlimited, not zero.'
                                          : enr + ' enrolled of ' + cap}>
                  {enr + '/' + (cap === null ? '—' : cap)}
                </span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* `cards` is the RESOLVED map from liveCardsResolved — on AND present — so
   this component never re-derives the decision. It gates the fetches as well
   as the render, because a card switched off must stop costing a query rather
   than merely stop being drawn. */
function LiveSection({ reportingBaseUrl, recOrgId, hasCheckins, hasFacility, hasHappening, availableReports, cards, tall }) {
  cards = cards || {};
  /* RESOLVED UPSTREAM AND HANDED DOWN, like `cards` — this component never
     re-derives the decision. */
  tall = tall || {};
  const sec = SECTIONS.live;
  /* THE SECTION HIDES WITH ITS WIDGETS. The counter renders nothing when the
     feed cannot answer — that is the absence rule — but a header and an empty
     grid left behind is its own dead end: a "Live Widgets" heading with a blank
     space under it reads as broken rather than as absent. Optimistic on mount
     so the section does not flash out and back in on a slow first fetch; it
     hides only once a fetch has actually FAILED. */
  const [alive, setAlive] = useState(true);
  /* TWO FEEDS, TWO VERDICTS. The check-ins card is a different card on a
     different Metabase question, so one of them failing must not take the
     other off the page — and the SECTION hides only when there is nothing left
     to show in it. Optimistic on mount for the same reason as above. */
  const [ciAlive, setCiAlive] = useState(!!hasCheckins);
  /* AND A THIRD, for the same reason. Each card is its own Metabase question,
     so three verdicts rather than one — a facility card that cannot answer
     must not take the registrations off the page. */
  const [facAlive, setFacAlive] = useState(!!hasFacility);
  /* AND A FOURTH VERDICT. Same argument a fourth time: the schedule is its own
     Metabase question, so it failing must not empty the section. */
  const [htAlive, setHtAlive] = useState(!!hasHappening);
  /* WHICH CARDS THIS ORG HAS. Resolved once, here, and handed down — so the
     two hooks and the leaderboard cannot end up on different opinions about
     which feed they are reading. */
  const choice = liveFeedChoice(availableReports);
  /* ONE FEED, TWO READERS. Live Enrollments and Programs Live are the same
     query, so it runs while EITHER is on and stops only when both are off.
     Gating it on the enrollments card alone would leave Programs Live drawing
     from a feed nobody fetched. */
  const wantEnroll = !!cards.enrollments || !!cards.programs;
  const feed   = useLiveEnrollments(setAlive, choice.enrollments, wantEnroll);
  const ciFeed = useLiveCheckins(setCiAlive, !!hasCheckins && !!cards.checkins, choice.checkins);
  const facFeed = useLiveFacility(setFacAlive, !!hasFacility && !!cards.facility);
  const htFeed = useLiveHappening(setHtAlive, !!hasHappening && !!cards.happening);
  const showEnroll = !!cards.enrollments && alive;
  const showProg   = !!cards.programs && alive;
  const showCi  = !!hasCheckins && !!cards.checkins && ciAlive;
  const showFac = !!hasFacility && !!cards.facility && facAlive;
  const showHt  = !!hasHappening && !!cards.happening && htAlive;
  /* THE SECTION HIDES WITH ITS WIDGETS, and now that each card can be switched
     off individually the emptiness test has to count the SWITCHES too — the
     old test asked only whether the feeds were alive, so an org that turned
     all four off would have kept a heading over an empty grid, which is the
     dead end the original comment above exists to prevent. */
  if (!showEnroll && !showProg && !showCi && !showFac && !showHt) return null;
  return (
    <div className="dashboard-section" data-live-section="1">
      <div className="section-header">
        <span className="section-icon">{sec.icon}</span>
        <span className="section-label">{sec.label}</span>
        <span className="section-badge" title={sec.description}>{'\u23F1'} not date-filtered</span>
        <div className="section-line" />
      </div>
      {/* THE ORDER IS THE LAYOUT. Dan's sketch: Happening Today double-height on
          the left, Check-Ins over Live Enrollment beside it, and Programs Live
          and Facility Bookings on a row underneath. On a four-column grid that
          falls straight out of source order — the tall card takes columns 1-2
          for two rows, the next two fill columns 3-4, and the last two wrap.
          So this list is not cosmetic and the two right-hand cards must stay in
          this order. */}
      <div className="widget-grid live-grid">
        {showHt ? <HappeningToday feed={htFeed} recOrgId={recOrgId} tall={!!tall.happening} /> : null}
        {showCi ? <MembershipCheckins feed={ciFeed} recOrgId={recOrgId} tall={!!tall.checkins} /> : null}
        {showEnroll ? <LiveRegistrations feed={feed} recOrgId={recOrgId} /> : null}
        {showProg ? <ProgramsLive feed={feed} recOrgId={recOrgId} /> : null}
        {showFac ? <FacilityBookings feed={facFeed} recOrgId={recOrgId} /> : null}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  AI EXECUTIVE BRIEFING SECTION
// ═══════════════════════════════════════════════════════
function BriefingSection({ reportData, loading, dateRange, briefingRef }) {
  const [briefing, setBriefing] = useState(null);
  const [briefingLoading, setBriefingLoading] = useState(false);
  const [traceId, setTraceId] = useState(null);
  const [fbSent, setFbSent] = useState(false);
  const [autoGenerated, setAutoGenerated] = useState(false);
  React.useEffect(function() { if (briefingRef) window._briefingRef = briefingRef; }, [briefingRef]);

  function buildFullSummary() {
    const bySec = {};
    Object.entries(W).forEach(([id, def]) => {
      if (def.component === 'table' || def.component === 'map') return;
      const raw = reportData[def.reportType];
      if (!raw) return;
      try {
        const data = def.transform(raw);
        const secLabel = SECTIONS[def.section]?.label || def.section;
        if (!bySec[secLabel]) bySec[secLabel] = [];
        if (def.component === 'metric' && data?.value != null) {
          bySec[secLabel].push(def.label + ': ' + fmt(data.value, data.format));
        } else if (data?.labels && data?.values) {
          const top3 = data.labels.slice(0, 3).map((l, i) => l + ': ' + (data.format === 'currency' ? fmt(data.values[i], 'currency') : data.values[i]));
          bySec[secLabel].push(def.label + ' (top 3): ' + top3.join(', '));
        }
      } catch(e) {}
    });
    return Object.entries(bySec).map(([sec, lines]) => '=== ' + sec + ' ===\n' + lines.join('\n')).join('\n\n');
  }

  async function generateBriefing() {
    setBriefingLoading(true);
    const summary = buildFullSummary();
    if (!summary) { setBriefing('Not enough data loaded yet. Try refreshing.'); setBriefingLoading(false); return; }
    const dr = dateRange ? dateRange.start + ' to ' + dateRange.end : 'current month';
    try {
      const insightUrl = IS_SHARE
        ? '/share/' + SHARE_TOKEN + '/insights/executive-briefing'
        : '/' + ORG_SLUG + '/api/insights/executive-briefing?token=' + TOKEN;
      const resp = await fetch(insightUrl, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ summary, dateRange: dr })
      });
      const json = await resp.json();
      setBriefing(json.insight || 'No briefing generated.');
      if (window._briefingRef) window._briefingRef.current = json.insight || null;
      setTraceId(json.traceId || null);
      setFbSent(false);
    } catch(e) { setBriefing('Failed to generate briefing.'); }
    setBriefingLoading(false);
    track('briefing_generated');
  }

  // Auto-generate when data loads
  useEffect(() => {
    if (!autoGenerated && !loading && Object.keys(reportData).length > 0) {
      setAutoGenerated(true);
      generateBriefing();
    }
  }, [loading, reportData]);

  function sendFeedback(score) {
    if (!traceId || IS_SHARE) return;
    fetch('/' + ORG_SLUG + '/api/insights/executive-briefing/score?token=' + TOKEN, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ traceId, score })
    }).catch(() => {});
    setFbSent(true);
    track('briefing_feedback', { score });
  }

  return (
    <div className="dashboard-section">
      <div className="section-header">
        <span className="section-icon">{'\u2728'}</span>
        <span className="section-label">AI Executive Briefing</span>
        <div className="section-line" />
        <button onClick={generateBriefing} className="btn btn-sm"
          style={{fontSize:11,opacity:briefingLoading?0.5:1}} disabled={briefingLoading}>
          {'\u21BB'} Regenerate
        </button>
      </div>
      <div style={{background:'linear-gradient(135deg, rgba(124,58,237,0.08), rgba(139,92,246,0.04))',
        border:'1px solid rgba(139,92,246,0.2)',borderRadius:12,padding:'20px 24px'}}>
        {briefingLoading ? (
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'4px 0'}}>
            <div style={{width:14,height:14,border:'2px solid var(--purple)',borderTopColor:'transparent',borderRadius:'50%',
              animation:'spin 0.8s linear infinite'}} />
            <span style={{color:'var(--text-muted)',fontSize:13}}>Analyzing dashboard data...</span>
          </div>
        ) : briefing ? (
          <div style={{fontSize:12,lineHeight:1.8,color:'var(--text-primary)',fontFamily:'var(--font-body)',
            letterSpacing:'0.01em'}}
            dangerouslySetInnerHTML={{__html: briefing
              .replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--amber);font-family:var(--font-body);font-weight:600">$1</strong>')
              .replace(/\n/g, '<br/>')}} />
        ) : null}
        {!briefingLoading && briefing && traceId && !IS_SHARE && (
          <div style={{marginTop:16,paddingTop:12,borderTop:'1px solid rgba(139,92,246,0.15)',display:'flex',alignItems:'center',gap:10}}>
            {fbSent ? (
              <span style={{fontSize:11,color:'var(--text-muted)',fontStyle:'italic'}}>{'\u2713'} Thanks for the feedback</span>
            ) : (
              <React.Fragment>
                <span style={{fontSize:11,color:'var(--text-muted)'}}>Helpful?</span>
                <button onClick={()=>sendFeedback(1)} title="Helpful"
                  style={{background:'transparent',border:'1px solid var(--border)',borderRadius:6,width:28,height:26,cursor:'pointer',
                    fontSize:13,lineHeight:1,transition:'all 0.15s'}}
                  onMouseOver={e=>{e.currentTarget.style.background='rgba(34,197,94,0.15)';e.currentTarget.style.borderColor='var(--green)';}}
                  onMouseOut={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='var(--border)';}}>
                  {'\uD83D\uDC4D'}</button>
                <button onClick={()=>sendFeedback(0)} title="Not helpful"
                  style={{background:'transparent',border:'1px solid var(--border)',borderRadius:6,width:28,height:26,cursor:'pointer',
                    fontSize:13,lineHeight:1,transition:'all 0.15s'}}
                  onMouseOver={e=>{e.currentTarget.style.background='rgba(239,68,68,0.15)';e.currentTarget.style.borderColor='var(--red)';}}
                  onMouseOut={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='var(--border)';}}>
                  {'\uD83D\uDC4E'}</button>
              </React.Fragment>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  SECTION BLOCK
// ═══════════════════════════════════════════════════════
function SectionBlock({ sectionId, widgetIds, reportData, loading, freshRts, targets, onTargetChange, chartTypes, onChartTypeChange, dateRange, aiEnabled, reportLinksEnabled, reportingBaseUrl, recOrgId, priorReportData, onCustomize }) {
  const sec = SECTIONS[sectionId]; if (!sec) return null;
  const [insight, setInsight] = useState(null);
  const [insightLoading, setInsightLoading] = useState(false);
  const [insightOpen, setInsightOpen] = useState(false);
  const [traceId, setTraceId] = useState(null);
  const [fbSent, setFbSent] = useState(false);
  const [fbMode, setFbMode] = useState(null); // null | 'comment'
  const [fbComment, setFbComment] = useState('');

  function sendFeedback(score) {
    if (!traceId) return;
    fetch(`/${ORG_SLUG}/api/insights/${sectionId}/score?token=${TOKEN}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ traceId, score, comment: score === 0 ? fbComment : '' })
    }).catch(() => {});
    setFbSent(true); setFbMode(null);
    track('insight_feedback', { section: sectionId, score });
  }

  async function generateInsight() {
    setInsightLoading(true); setInsightOpen(true);
    // Build summary from widget transforms
    const lines = [];
    widgetIds.forEach(id => {
      const def = W[id]; if (!def || def.component === 'table' || def.component === 'map') return;
      const raw = reportData[def.reportType];
      if (!raw) return;
      const data = def.transform(raw);
      if (def.component === 'metric' && data?.value != null) {
        lines.push(`${def.label}: ${fmt(data.value, data.format)}`);
      } else if (data?.labels && data?.values) {
        const top3 = data.labels.slice(0, 3).map((l, i) => `${l}: ${data.format === 'currency' ? fmt(data.values[i], 'currency') : data.values[i]}`);
        lines.push(`${def.label} (top 3): ${top3.join(', ')}`);
      }
    });
    const summary = lines.join('\n');
    const dr = dateRange ? `${dateRange.start} to ${dateRange.end}` : 'current month';
    try {
      const resp = await fetch(`/${ORG_SLUG}/api/insights/${sectionId}?token=${TOKEN}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ summary, dateRange: dr })
      });
      const json = await resp.json();
      setInsight(json.insight || json.error || 'No insights generated.');
      setTraceId(json.traceId || null);
      setFbSent(false); setFbMode(null); setFbComment('');
    } catch (e) { setInsight('Failed to generate insights.'); }
    setInsightLoading(false);
    track('insight_requested', { section: sectionId });
  }

  return (
    <div className="dashboard-section" data-section={sectionId}>
      <div className="section-header">
        <span className="section-icon">{sec.icon}</span>
        <span className="section-label">{sec.label}</span>
        <div className="section-line" />
        {aiEnabled && <button onClick={insightOpen ? () => setInsightOpen(false) : generateInsight}
          style={{background:insightOpen?'linear-gradient(135deg,#7c3aed,#6d28d9)':'linear-gradient(135deg,rgba(124,58,237,0.12),rgba(245,158,11,0.08))',
            border:insightOpen?'1px solid #7c3aed':'1px solid rgba(124,58,237,0.3)',borderRadius:8,padding:'5px 14px',cursor:'pointer',
            fontSize:12,fontWeight:600,color:insightOpen?'#fff':'var(--purple)',display:'flex',alignItems:'center',gap:5,
            fontFamily:'var(--font-body)',transition:'all 0.2s',boxShadow:insightOpen?'0 2px 12px rgba(124,58,237,0.3)':'none'}}
          onMouseOver={e=>{if(!insightOpen){e.currentTarget.style.background='linear-gradient(135deg,rgba(124,58,237,0.2),rgba(245,158,11,0.12))';e.currentTarget.style.borderColor='rgba(124,58,237,0.5)';}}}
          onMouseOut={e=>{if(!insightOpen){e.currentTarget.style.background='linear-gradient(135deg,rgba(124,58,237,0.12),rgba(245,158,11,0.08))';e.currentTarget.style.borderColor='rgba(124,58,237,0.3)';}}}>
          {'\u2728'} {insightLoading ? 'Analyzing...' : insightOpen ? 'Hide Insights' : 'Rec Insights'}
        </button>}
        {/* The widget count is the way IN to customising this section. Dan:
            "people don't see it at the top." Edit Dashboard stays where it was;
            this is a second door onto the SAME modal, focused on this section,
            so there is only one widget picker to keep correct.
            Read-only viewers keep the plain badge — there is nothing to open. */}
        {onCustomize
          ? <button className="section-badge section-badge-btn" data-customize={sectionId}
              onClick={() => onCustomize(sectionId)}
              title={'Add or remove ' + sec.label + ' widgets'}>
              {widgetIds.length} widgets <span className="sb-pencil">{'\u270E'}</span>
            </button>
          : <span className="section-badge">{widgetIds.length} widgets</span>}
        {reportLinksEnabled && SECTION_REPORT_MAP[sectionId] && reportingBaseUrl && (
          <a href={`${reportingBaseUrl}/${RPT_SLUG()}/${SECTION_REPORT_MAP[sectionId]}?token=${RPT_TOKEN()}`} target="_blank" rel="noopener noreferrer"
            style={{fontSize:11,fontWeight:600,color:sec.color||'var(--amber)',textDecoration:'none',
              padding:'4px 12px',borderRadius:6,border:`1px solid ${sec.color||'var(--amber)'}33`,
              background:`${sec.color||'var(--amber)'}0d`,transition:'all 0.2s',display:'flex',alignItems:'center',gap:4,
              fontFamily:'var(--font-body)',whiteSpace:'nowrap'}}
            onMouseOver={e=>{e.currentTarget.style.background=`${sec.color||'var(--amber)'}1a`;e.currentTarget.style.borderColor=`${sec.color||'var(--amber)'}66`;}}
            onMouseOut={e=>{e.currentTarget.style.background=`${sec.color||'var(--amber)'}0d`;e.currentTarget.style.borderColor=`${sec.color||'var(--amber)'}33`;}}>
            View Report {String.fromCharCode(8594)}
          </a>
        )}
        {/* The way OUT of a section whose numbers live in Rec rather than in a
            report. Dan: "Clicking into the section would take them to their
            CRM portal in Rec." Built through recPageUrl, which only knows a
            whitelist of pages — the org uuid is ours and so is the path, and
            handing a free string to a URL builder is how a typo becomes a
            confident 404 on somebody's admin. No uuid, no link. */}
        {recPageUrl(recOrgId, SECTION_REC_PAGE[sectionId]) && (
          <a href={recPageUrl(recOrgId, SECTION_REC_PAGE[sectionId])} target="_blank" rel="noopener noreferrer"
            data-rec-link={sectionId}
            style={{fontSize:11,fontWeight:600,color:sec.color||'var(--amber)',textDecoration:'none',
              padding:'4px 12px',borderRadius:6,border:`1px solid ${sec.color||'var(--amber)'}33`,
              background:`${sec.color||'var(--amber)'}0d`,transition:'all 0.2s',display:'flex',alignItems:'center',gap:4,
              fontFamily:'var(--font-body)',whiteSpace:'nowrap'}}
            onMouseOver={e=>{e.currentTarget.style.background=`${sec.color||'var(--amber)'}1a`;e.currentTarget.style.borderColor=`${sec.color||'var(--amber)'}66`;}}
            onMouseOut={e=>{e.currentTarget.style.background=`${sec.color||'var(--amber)'}0d`;e.currentTarget.style.borderColor=`${sec.color||'var(--amber)'}33`;}}>
            Open in Rec {String.fromCharCode(8594)}
          </a>
        )}
      </div>
      {insightOpen && (
        <div style={{background:'linear-gradient(135deg, rgba(139,92,246,0.1), rgba(245,158,11,0.06))',
          border:'1px solid rgba(139,92,246,0.2)',borderRadius:12,padding:'18px 22px',
          marginBottom:14,backdropFilter:'blur(4px)'}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--purple)',marginBottom:10,display:'flex',alignItems:'center',gap:6,
            textTransform:'uppercase',letterSpacing:'0.06em'}}>
            {'\u2728'} Rec Insights
          </div>
          {insightLoading ? (
            <div style={{color:'var(--text-muted)',fontSize:12,fontStyle:'italic'}}>Analyzing {sec.label.toLowerCase()} data...</div>
          ) : (
            <div style={{fontSize:12,color:'var(--text-secondary)',lineHeight:1.8}}
              dangerouslySetInnerHTML={{__html: (insight||'').replace(/\*\*([^*]+)\*\*/g,'<strong style="color:var(--text-primary)">$1</strong>').replace(/^[•\-]\s*/gm,'').replace(/\n/g,'<br/>')}} />
          )}
          {!insightLoading && insight && traceId && (
            <div style={{marginTop:14,paddingTop:12,borderTop:'1px solid rgba(139,92,246,0.15)',display:'flex',alignItems:'center',gap:10}}>
              {fbSent ? (
                <span style={{fontSize:11,color:'var(--text-muted)',fontStyle:'italic'}}>{'\u2713'} Thanks for the feedback</span>
              ) : fbMode === 'comment' ? (
                <div style={{display:'flex',alignItems:'center',gap:8,flex:1}}>
                  <input type="text" value={fbComment} onChange={e=>setFbComment(e.target.value)}
                    placeholder="What was off? (optional)" autoFocus
                    onKeyDown={e=>{if(e.key==='Enter')sendFeedback(0);}}
                    style={{flex:1,maxWidth:320,background:'var(--bg-surface)',border:'1px solid rgba(139,92,246,0.3)',borderRadius:6,
                      padding:'5px 10px',fontSize:11,color:'var(--text-primary)',fontFamily:'var(--font-body)'}} />
                  <button onClick={()=>sendFeedback(0)}
                    style={{background:'var(--purple)',border:'none',borderRadius:6,padding:'5px 12px',cursor:'pointer',
                      fontSize:11,fontWeight:600,color:'#fff',fontFamily:'var(--font-body)'}}>Send</button>
                </div>
              ) : (
                <React.Fragment>
                  <span style={{fontSize:11,color:'var(--text-muted)'}}>Helpful?</span>
                  <button onClick={()=>sendFeedback(1)} title="Helpful"
                    style={{background:'transparent',border:'1px solid rgba(139,92,246,0.25)',borderRadius:6,width:28,height:26,cursor:'pointer',
                      fontSize:13,lineHeight:1,transition:'all 0.15s'}}
                    onMouseOver={e=>{e.currentTarget.style.background='rgba(34,197,94,0.15)';e.currentTarget.style.borderColor='#22c55e';}}
                    onMouseOut={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='rgba(139,92,246,0.25)';}}>
                    {'\uD83D\uDC4D'}</button>
                  <button onClick={()=>setFbMode('comment')} title="Not helpful"
                    style={{background:'transparent',border:'1px solid rgba(139,92,246,0.25)',borderRadius:6,width:28,height:26,cursor:'pointer',
                      fontSize:13,lineHeight:1,transition:'all 0.15s'}}
                    onMouseOver={e=>{e.currentTarget.style.background='rgba(239,68,68,0.15)';e.currentTarget.style.borderColor='#ef4444';}}
                    onMouseOut={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor='rgba(139,92,246,0.25)';}}>
                    {'\uD83D\uDC4E'}</button>
                </React.Fragment>
              )}
            </div>
          )}
        </div>
      )}
      {sectionId === 'users-demographics' ? (() => {
        const metricIds = widgetIds.filter(id => W[id] && W[id].component === 'metric');
        const chartIds = widgetIds.filter(id => W[id] && W[id].component !== 'metric');
        return <React.Fragment>
          {metricIds.length > 0 && <div className="kpi-strip">
            {metricIds.map(id => {
              const def = W[id]; if (!def) return null;
              const raw = widgetReady(def, reportData) ? reportData[def.reportType] : null;
              const data = raw ? def.transform(raw) : null;
              // Period-comparison pill (from created_at) — the kpi-strip renders
              // these tiles directly, not through MetricCard, so compute it here.
              let prior = null;
              if (data && def.delta && def.priorValue && raw) {
                try { const pv = def.priorValue(raw); if (pv != null && !isNaN(pv)) prior = { value: pv, goodWhenDown: !!def.deltaGoodWhenDown, label: def.deltaLabel || 'vs prior 30d' }; } catch (e) {}
              }
              return <div key={id} className="kpi-strip-item">
                <span className="kpi-strip-value">{data ? fmt(data.value, data.format) : '...'}</span>
                <span className="kpi-strip-label">{def.label}</span>
                {def.note && <span className="kpi-strip-note">{def.note}</span>}
                {prior && data && <DeltaPill cur={data.value} prev={prior.value} goodWhenDown={prior.goodWhenDown} label={prior.label} />}
              </div>;
            })}
          </div>}
          <div className="widget-grid">
            {chartIds.map(id => <WidgetCard key={id} widgetId={id} reportData={reportData} loading={loading} freshRts={freshRts} reportingBaseUrl={reportingBaseUrl}
              target={targets?.[id]} onTargetChange={onTargetChange} chartType={chartTypes?.[id]} onChartTypeChange={onChartTypeChange} dateRange={dateRange} priorReportData={priorReportData} />)}
          </div>
        </React.Fragment>;
      })() : (
        <div className="widget-grid">
