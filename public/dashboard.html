            {metricIds.map(id => {
              const def = W[id]; if (!def) return null;
              const raw = widgetReady(def, reportData) ? reportData[def.reportType] : null;
              const data = raw ? def.transform(raw) : null;
              // Period-comparison pill (from created_at) — the kpi-strip renders
              // these tiles directly, not through MetricCard, so compute it here.
              let prior = null;
              if (data && def.delta && def.priorValue && raw) {
                try { const pv = def.priorValue(raw); if (pv != null && !isNaN(pv)) prior = { value: pv, goodWhenDown: !!def.deltaGoodWhenDown, label: def.deltaLabel || 'vs prior 30d' }; } catch (e) {}
              }
              return <div key={id} className="kpi-strip-item">
                <span className="kpi-strip-value">{data ? fmt(data.value, data.format) : '...'}</span>
                <span className="kpi-strip-label">{def.label}</span>
                {def.note && <span className="kpi-strip-note">{def.note}</span>}
                {prior && data && <DeltaPill cur={data.value} prev={prior.value} goodWhenDown={prior.goodWhenDown} label={prior.label} />}
              </div>;
            })}
          </div>}
          <div className="widget-grid">
            {chartIds.map(id => <WidgetCard key={id} widgetId={id} reportData={reportData} loading={loading} freshRts={freshRts} reportingBaseUrl={reportingBaseUrl}
              target={targets?.[id]} onTargetChange={onTargetChange} chartType={chartTypes?.[id]} onChartTypeChange={onChartTypeChange} dateRange={dateRange} priorReportData={priorReportData} />)}
          </div>
        </React.Fragment>;
      })() : (
        <div className="widget-grid">
          {widgetIds.map(id => <WidgetCard key={id} widgetId={id} reportData={reportData} loading={loading} freshRts={freshRts} reportingBaseUrl={reportingBaseUrl}
            target={targets?.[id]} onTargetChange={onTargetChange} chartType={chartTypes?.[id]} onChartTypeChange={onChartTypeChange} dateRange={dateRange} priorReportData={priorReportData} />)}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  EDIT MODAL
// ═══════════════════════════════════════════════════════
const MAX_PER_SECTION = 999;
const MAX_TOTAL = 999;

function EditModal({ sections, onSave, onClose, availableReports, toggles, focusSection }) {
  const [draft, setDraft] = useState(sections.map(s => ({ ...s, widgets: [...s.widgets] })));
  // Opening from a section's own "N widgets" badge lands on THAT section rather
  // than on the first one — the whole point of the per-section entry point is
  // not having to hunt for the section you were already looking at.
  const [expanded, setExpanded] = useState(focusSection || sections[0]?.id || '');
  // ...and scroll it into view, because on a long dashboard the expanded
  // section can open below the fold and look like nothing happened.
  const focusRef = React.useRef(null);
  React.useEffect(() => {
    if (!focusSection || !focusRef.current) return;
    focusRef.current.scrollIntoView({ block: 'start' });
  }, [focusSection]);

  const totalWidgets = draft.reduce((s, sec) => s + sec.widgets.length, 0);
  const atLimit = totalWidgets >= MAX_TOTAL;

  function removeSection(idx) { setDraft(d => d.filter((_,i) => i!==idx)); }
  function moveSection(idx, dir) {
    setDraft(d => { const n=[...d]; const j=idx+dir; if(j<0||j>=n.length) return n; [n[idx],n[j]]=[n[j],n[idx]]; return n; });
  }
  function addSection(secId) {
    const sec = SECTIONS[secId]; if (!sec) return;
    setDraft(d => [...d, { id: secId, widgets: [...sec.defaultWidgets] }]);
    setExpanded(secId);
  }
  function toggleWidget(secIdx, widgetId) {
    setDraft(d => { const n = d.map((s,i) => i===secIdx ? { ...s, widgets: s.widgets.includes(widgetId) ? s.widgets.filter(w=>w!==widgetId) : [...s.widgets, widgetId] } : s); return n; });
  }
  function moveWidget(secIdx, wIdx, dir) {
    setDraft(d => d.map((s,i) => { if (i!==secIdx) return s; const w=[...s.widgets]; const j=wIdx+dir; if(j<0||j>=w.length) return s; [w[wIdx],w[j]]=[w[j],w[wIdx]]; return { ...s, widgets: w }; }));
  }

  const activeSectionIds = new Set(draft.map(s => s.id));
  const availableSections = Object.values(SECTIONS).filter(s => {
      if (activeSectionIds.has(s.id)) return false;
      if (s.id === 'ai-briefing') return false;  // disabled until data pipeline audit
      if (s.id === 'support') return false;      // lives in its own tab, not section config
      // Always on and rendered outside config.sections — offering to "add" it
      // would create a duplicate that renders nothing.
      if (s.id === 'live') return false;
      // Also hide sections whose report is hidden on the reporting side (from window._reportVisibility)
      if (window._reportVisibility) {
        const rt = SECTION_REPORT_MAP[s.id];
        if (rt) {
          const vis = window._reportVisibility.find(v => v.type === rt);
          if (vis && !vis.visible) return false;
        }
      }
      return true;
    });

  return (
    <div className="modal-overlay" onClick={e => { if (e.target===e.currentTarget) onClose(); }}>
      <div className="modal-panel">
        <div className="modal-header">
          <span className="modal-title">
            {focusSection && SECTIONS[focusSection] ? SECTIONS[focusSection].label + ' widgets' : 'Edit Dashboard'}
          </span>
          <button className="modal-close" onClick={onClose}>{'\u2715'}</button>
        </div>
        <div className="modal-body">
          {/* LIVE WIDGETS IS ALWAYS ON, so it is shown as a state rather than
              offered as a choice. Dan, seeing it in "Add a Section" while it
              was already rendering above: "if it's already loaded, shouldn't
              it be highlighted, and at the top with a widget counter of 1?"
              Yes — a control that offers to add what is already there is the
              dead end this codebase keeps writing down, and adding it would
              have produced a duplicate section that renders nothing. Same
              shape as the Support row below it, and FIRST, because that is
              where the section itself sits on the page. */}
          {availableReports.enrollments && (
            <div className="edit-section" data-edit-live="1" style={{opacity:0.85,cursor:'default'}}
              title="Live data, always on — it ignores the date range and refreshes itself">
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px'}}>
                <span style={{fontSize:15}}>{SECTIONS.live.icon}</span>
                <span style={{fontSize:13,fontWeight:600,color:'var(--text-primary)'}}>{SECTIONS.live.label}</span>
                <span style={{fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:8,background:'rgba(22,163,74,.12)',color:'#16a34a'}}>{'\u26A1'} Always on {'\u00b7'} not date-filtered</span>
                <span style={{fontSize:11,color:'var(--text-muted)',marginLeft:'auto'}}>1 widget</span>
              </div>
            </div>
          )}
          {availableReports.support && (
            <div className="edit-section" style={{opacity:0.85,cursor:'default'}}
              title="Included with every dashboard — Rec runs resident support for your org">
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'12px 14px'}}>
                <span style={{fontSize:15}}>{SECTIONS.support.icon}</span>
                <span style={{fontSize:13,fontWeight:600,color:'var(--text-primary)'}}>{SECTIONS.support.label}</span>
                <span style={{fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:8,background:'var(--amber-glow)',color:'var(--amber)'}}>{'🔒'} Always included {'·'} its own tab</span>
                <span style={{fontSize:11,color:'var(--text-muted)',marginLeft:'auto'}}>{SECTIONS.support.defaultWidgets.length} widgets + inbox</span>
              </div>
            </div>
          )}
          {draft.map((sec, si) => {
            const secDef = SECTIONS[sec.id]; if (!secDef) return null;
            const isOpen = expanded === sec.id;
            const poolWidgets = Object.entries(W).filter(([id,w]) => w.section===sec.id && !sec.widgets.includes(id));
            return (
              <div key={sec.id+si} className="edit-section"
                   ref={sec.id === focusSection ? focusRef : null}
                   data-edit-section={sec.id}>
                <div className="edit-section-header" onClick={() => setExpanded(isOpen ? '' : sec.id)}>
                  <span style={{fontSize:18}}>{secDef.icon}</span>
                  <span className="edit-section-title">{secDef.label}</span>
                  <span style={{fontSize:11,color:sec.widgets.length>=MAX_PER_SECTION?'var(--red)':'var(--text-muted)'}}>{sec.widgets.length}{MAX_PER_SECTION < 100 ? '/'+MAX_PER_SECTION : ''}</span>
                  <div style={{display:'flex',gap:3}}>
                    <button className="btn btn-sm" onClick={e=>{e.stopPropagation();moveSection(si,-1);}} disabled={si===0}>{'\u25B2'}</button>
                    <button className="btn btn-sm" onClick={e=>{e.stopPropagation();moveSection(si,1);}} disabled={si===draft.length-1}>{'\u25BC'}</button>
                    <button className="btn btn-sm" style={{color:'#ef4444'}} onClick={e=>{e.stopPropagation();removeSection(si);}}>{'\u2715'}</button>
                  </div>
                </div>
                {isOpen && (
                  <div className="edit-section-body">
                    <div className="mini-label">Active</div>
                    {sec.widgets.map((wId, wi) => {
                      const wd = W[wId]; if (!wd) return null;
                      return (
                        <div key={wId} className="widget-list-item">
                          <span className="widget-list-icon">{wd.icon}</span>
                          <div className="widget-list-info"><div className="widget-list-name">{wd.label}</div><div className="widget-list-desc">{wd.description}</div></div>
                          <div style={{display:'flex',gap:3}}>
                            <button className="btn btn-sm" onClick={()=>moveWidget(si,wi,-1)} disabled={wi===0}>{'\u25B2'}</button>
                            <button className="btn btn-sm" onClick={()=>moveWidget(si,wi,1)} disabled={wi>=sec.widgets.length-1}>{'\u25BC'}</button>
                            <button className="btn btn-sm" style={{color:'#ef4444'}} onClick={()=>toggleWidget(si,wId)}>{'\u2715'}</button>
                          </div>
                        </div>
                      );
                    })}
                    {poolWidgets.length > 0 && <>
                      <div className="mini-label">Available</div>
                      {poolWidgets.map(([id,wd]) => (
                        <div key={id} className="widget-list-item">
                          <span className="widget-list-icon">{wd.icon}</span>
                          <div className="widget-list-info"><div className="widget-list-name">{wd.label}</div><div className="widget-list-desc">{wd.description}</div></div>
                          <button className="btn btn-sm" style={{color: atLimit||sec.widgets.length>=MAX_PER_SECTION?'var(--text-muted)':'var(--green)'}}
                            disabled={atLimit||sec.widgets.length>=MAX_PER_SECTION} onClick={()=>toggleWidget(si,id)}>+</button>
                        </div>
                      ))}
                    </>}
                  </div>
                )}
              </div>
            );
          })}
          {availableSections.length > 0 && <>
            <div className="mini-label" style={{marginTop:16}}>Add a Section</div>
            {availableSections.map(sec => (
              <button key={sec.id} className="add-section-btn" onClick={() => addSection(sec.id)} style={{marginBottom:8}}>
                <span style={{fontSize:20}}>{sec.icon}</span>
                <div style={{textAlign:'left'}}><div style={{fontWeight:600}}>{sec.label}</div><div style={{fontSize:11,opacity:0.6}}>{sec.description}</div></div>
              </button>
            ))}
          </>}
        </div>
        <div className="modal-footer">
          <span style={{fontSize:11,color:atLimit?'var(--red)':'var(--text-muted)',flex:1}}>{totalWidgets} widgets{MAX_TOTAL < 100 ? ' / '+MAX_TOTAL+(atLimit?' (limit reached)':'') : ''}</span>
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-amber" onClick={() => onSave(draft)}>Save Layout</button>
        </div>
      </div>
    </div>
  );
}

          </div>
          <button onClick={handleCreate} disabled={!selectedCount}
            style={{background:selectedCount ? 'var(--accent, #3b82f6)' : 'var(--border)',color:'#fff',border:'none',
              padding:'10px 28px',borderRadius:8,fontWeight:600,fontSize:14,cursor:selectedCount ? 'pointer' : 'default',
              opacity:selectedCount ? 1 : 0.5}}>
            Create Dashboard
          </button>
        </div>
      </div>
    </div>
  );
}

function SettingsPopover({ cacheTTL, onCacheTTLChange, onClearCache, onReset, theme, onThemeChange, emailDigestEnabled, sections, dateRange, onSendDigest }) {
  const [confirmReset, setConfirmReset] = useState(false);
  const [subEmail, setSubEmail] = useState('');
  const [subFreq, setSubFreq] = useState('weekly');
  const [subStatus, setSubStatus] = useState(null);
  const [sendEmail, setSendEmail] = useState('');
  const [sendStatus, setSendStatus] = useState(null);

  async function handleSendNow() {
    if (!sendEmail || !sendEmail.includes('@')) { setSendStatus('error'); return; }
    setSendStatus('sending');
    try {
      var json = await onSendDigest(sendEmail);
      setSendStatus(json.ok ? 'sent' : 'error');
      if (json.ok) setTimeout(function() { setSendStatus(null); }, 3000);
    } catch(e) { setSendStatus('error'); }
  }
  const [pdfOpen, setPdfOpen] = useState(false);
  const [pdfSections, setPdfSections] = useState(() => (sections || []).map(s => s.id));
  const [shareUrl, setShareUrl] = useState(null);
  const [shareLoading, setShareLoading] = useState(false);
  const [shareCopied, setShareCopied] = useState(false);

  async function handleSubscribe() {
    if (!subEmail || !subEmail.includes('@')) { setSubStatus('error'); return; }
    setSubStatus('saving');
    try {
      const resp = await fetch('/' + ORG_SLUG + '/api/email-subscribe?token=' + TOKEN, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: subEmail, frequency: subFreq })
      });
      const json = await resp.json();
      setSubStatus(json.ok ? 'success' : 'error');
      if (json.ok) track('email_subscribed', { frequency: subFreq });
    } catch(e) { setSubStatus('error'); }
  }

  function handlePdfExport() {
    if (!pdfSections.length) return;
    const qs = new URLSearchParams({ token: TOKEN, start: dateRange.start, end: dateRange.end, _print: '1', sections: pdfSections.join(',') });
    window.open('/' + ORG_SLUG + '?' + qs.toString(), '_blank');
    track('pdf_exported', { sections: pdfSections.length });
  }

  function togglePdfSection(id) {
    setPdfSections(prev => prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]);
  }

  async function handleShare() {
    setShareLoading(true);
    try {
      const resp = await fetch('/' + ORG_SLUG + '/api/share?token=' + TOKEN, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dateRange })
      });
      const json = await resp.json();
      if (json.ok) { setShareUrl(json.url); track('dashboard_shared'); }
    } catch(e) {}
    setShareLoading(false);
  }

  function copyShareUrl() {
    if (!shareUrl) return;
    navigator.clipboard.writeText(shareUrl).then(() => { setShareCopied(true); setTimeout(() => setShareCopied(false), 2000); });
  }

  return (
    <div style={{ position:'absolute',top:'100%',right:0,marginTop:6,background:'var(--bg-modal)',border:'1px solid var(--border)',
      borderRadius:10,padding:16,width:300,zIndex:60,boxShadow:'0 12px 32px rgba(0,0,0,0.5)',maxHeight:'80vh',overflowY:'auto' }} onClick={e=>e.stopPropagation()}>
      <div style={{fontSize:13,fontWeight:600,marginBottom:14}}>Dashboard Settings</div>

      <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:6}}>Theme</div>
      <div style={{display:'flex',gap:6,marginBottom:14}}>
        <button className={`btn btn-sm ${theme==='dark'?'btn-amber':''}`} style={{flex:1}} onClick={()=>onThemeChange('dark')}>Dark</button>
        <button className={`btn btn-sm ${theme==='light'?'btn-amber':''}`} style={{flex:1}} onClick={()=>onThemeChange('light')}>Light</button>
      </div>

      <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:6}}>Cache Duration</div>
      <select value={cacheTTL} onChange={e=>onCacheTTLChange(Number(e.target.value))}
        style={{width:'100%',padding:'6px 8px',borderRadius:6,border:'1px solid var(--border)',background:'var(--bg-surface)',color:'var(--text-primary)',fontSize:13,marginBottom:12}}>
        <option value={5}>5 minutes</option><option value={15}>15 minutes</option><option value={30}>30 minutes</option><option value={60}>1 hour</option><option value={240}>4 hours</option>
      </select>
      <button className="btn" style={{width:'100%',fontSize:12,marginBottom:10}} onClick={onClearCache}>Clear Cache Now</button>

      <div style={{borderTop:'1px solid var(--border)',paddingTop:12,marginTop:4,marginBottom:10}}>
        <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:8,display:'flex',alignItems:'center',gap:5}}>
          {'\uD83D\uDCC4'} PDF Export
        </div>
        {!pdfOpen ? (
          <button className="btn" style={{width:'100%',fontSize:12}} onClick={()=>setPdfOpen(true)}>Choose Sections...</button>
        ) : (
          <div>
            <div style={{maxHeight:140,overflowY:'auto',marginBottom:8}}>
              {(sections || []).map(sec => {
                const def = SECTIONS[sec.id];
                if (!def || sec.id === 'ai-briefing') return null;
                return (
                  <label key={sec.id} style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--text-secondary)',
                    cursor:'pointer',padding:'3px 0'}}>
                    <input type="checkbox" checked={pdfSections.includes(sec.id)}
                      onChange={()=>togglePdfSection(sec.id)}
                      style={{accentColor:'var(--amber)',width:14,height:14}} />
                    <span>{def.icon} {def.label}</span>
                  </label>
                );
              })}
            </div>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-sm" style={{flex:1}} onClick={()=>setPdfOpen(false)}>Cancel</button>
              <button className="btn btn-sm btn-amber" style={{flex:1}} onClick={handlePdfExport}
                disabled={!pdfSections.length}>
                Export {pdfSections.length} section{pdfSections.length !== 1 ? 's' : ''}
              </button>
            </div>
          </div>
        )}
      </div>

      <div style={{borderTop:'1px solid var(--border)',paddingTop:12,marginTop:4,marginBottom:10}}>
        <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:8,display:'flex',alignItems:'center',gap:5}}>
          {'\uD83D\uDD17'} Share Dashboard
        </div>
        {shareUrl ? (
          <div>
            <div style={{display:'flex',gap:6,marginBottom:6}}>
              <input type="text" readOnly value={shareUrl}
                style={{flex:1,padding:'6px 8px',borderRadius:6,border:'1px solid var(--border)',
                  background:'var(--bg-surface)',color:'var(--text-primary)',fontSize:10,
                  fontFamily:'var(--font-body)',outline:'none',boxSizing:'border-box'}} />
              <button className="btn btn-sm" style={{fontSize:11,whiteSpace:'nowrap'}} onClick={copyShareUrl}>
                {shareCopied ? '\u2713 Copied' : 'Copy'}
              </button>
            </div>
            <div style={{fontSize:10,color:'var(--text-muted)'}}>Read-only, expires in 72 hours. No login required.</div>
          </div>
        ) : (
          <button className="btn" style={{width:'100%',fontSize:12}} onClick={handleShare} disabled={shareLoading}>
            {shareLoading ? 'Generating...' : 'Generate Share Link'}
          </button>
        )}
      </div>

      <div style={{borderTop:'1px solid var(--border)',paddingTop:12,marginTop:4,marginBottom:10}}>
          <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:8,display:'flex',alignItems:'center',gap:5}}>
            {'\uD83D\uDCE8'} Send Digest Now
          </div>
          {sendStatus === 'sent' ? (
            <div style={{fontSize:11,color:'var(--green)',padding:'4px 0'}}>{'\u2713'} Sent! Check your inbox.</div>
          ) : (
            <React.Fragment>
              <input type="email" value={sendEmail} onChange={function(e){setSendEmail(e.target.value);}}
                placeholder="you@example.com"
                onKeyDown={function(e){if(e.key==='Enter')handleSendNow();}}
                style={{width:'100%',padding:'6px 8px',borderRadius:6,border:'1px solid var(--border)',
                  background:'var(--bg-surface)',color:'var(--text-primary)',fontSize:12,marginBottom:6,
                  fontFamily:'var(--font-body)',outline:'none',boxSizing:'border-box'}} />
              <button className="btn" style={{width:'100%',fontSize:12,fontWeight:600,background:'linear-gradient(135deg,#f97316,#ea580c)',color:'#fff',borderColor:'#ea580c'}}
                onClick={handleSendNow} disabled={sendStatus==='sending'}>
                {sendStatus === 'sending' ? 'Sending...' : sendStatus === 'error' ? 'Failed \u2014 try again' : 'Send Now'}
              </button>
            </React.Fragment>
          )}
        </div>

      {emailDigestEnabled && (
        <div style={{borderTop:'1px solid var(--border)',paddingTop:12,marginTop:4,marginBottom:10}}>
          <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:8,display:'flex',alignItems:'center',gap:5}}>
            {'\uD83D\uDCE7'} Email Summary
          </div>
          {subStatus === 'success' ? (
            <div style={{fontSize:11,color:'var(--green)',padding:'4px 0'}}>{'\u2713'} Subscribed!</div>
          ) : (
            <React.Fragment>
              <input type="email" value={subEmail} onChange={e=>setSubEmail(e.target.value)}
                placeholder="you@example.com"
                onKeyDown={e=>{if(e.key==='Enter')handleSubscribe();}}
                style={{width:'100%',padding:'6px 8px',borderRadius:6,border:'1px solid var(--border)',
                  background:'var(--bg-surface)',color:'var(--text-primary)',fontSize:12,marginBottom:6,
                  fontFamily:'var(--font-body)',outline:'none',boxSizing:'border-box'}} />
              <div style={{display:'flex',gap:6}}>
                <select value={subFreq} onChange={e=>setSubFreq(e.target.value)}
                  style={{flex:1,padding:'6px 8px',borderRadius:6,border:'1px solid var(--border)',
                    background:'var(--bg-surface)',color:'var(--text-primary)',fontSize:11,fontFamily:'var(--font-body)'}}>
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                </select>
                <button className="btn btn-sm" style={{fontSize:11,fontWeight:600,background:'var(--blue)',color:'#fff',borderColor:'var(--blue)'}}
                  onClick={handleSubscribe} disabled={subStatus==='saving'}>
                  {subStatus === 'saving' ? '...' : 'Subscribe'}
                </button>
              </div>
              {subStatus === 'error' && <div style={{fontSize:10,color:'var(--red)',marginTop:4}}>Enter a valid email</div>}

      <div style={{borderTop:'1px solid var(--border)',paddingTop:10,marginTop:4}}>
        {!confirmReset ? (

        ) : (
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:12,color:'var(--red)',marginBottom:8}}>Clear layout and start over?</div>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-sm" style={{flex:1}} onClick={()=>setConfirmReset(false)}>Cancel</button>
              <button className="btn btn-sm" style={{flex:1,background:'var(--red)',color:'#fff',borderColor:'var(--red)'}} onClick={onReset}>Yes, Reset</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function timeAgo(ts) {
  const s = Math.floor(Date.now() / 1000 - ts);
  if (s < 3600) return `${Math.max(1, Math.floor(s / 60))}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  return `${Math.floor(s / 86400)}d`;
}
function msgTime(ts) {
  return new Date(ts * 1000).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function ForwardModal({ conv, onClose, onSent }) {
  const [to, setTo] = useState('');
  const [note, setNote] = useState('');
  const [status, setStatus] = useState(null); // null | 'sending' | 'sent' | error string
  async function send() {
    if (!to) return;
    setStatus('sending');
    try {
      const resp = await fetch(`/${ORG_SLUG}/api/support/inbox/${conv.id}/forward?token=${TOKEN}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to, note }) });
      const json = await resp.json();
      if (json.ok) { setStatus('sent'); track('support_forwarded', { conversationId: conv.id }); if (onSent) onSent(conv.id); setTimeout(onClose, 1200); }
      else setStatus(json.error || 'Failed to send');
    } catch (e) { setStatus('Failed to send'); }
  }
  return (
    <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-panel" style={{maxWidth:440}}>
        <div className="modal-header">
          <span className="modal-title">Forward to your team</span>
          <button className="modal-close" onClick={onClose}>{'✕'}</button>
        </div>
        <div className="modal-body" style={{padding:'18px 24px'}}>
          <div style={{fontSize:12,color:'var(--text-secondary)',marginBottom:14}}>
            Emails this conversation — <b style={{color:'var(--text-primary)'}}>{conv.subject}</b> from {conv.contact.name} — to a member of your staff, with the full thread included.
          </div>
          <label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:4}}>Send to</label>
          <input type="email" className="date-input" style={{width:'100%',marginBottom:12}} placeholder="staff@torranceca.gov"
            value={to} onChange={e => setTo(e.target.value)} autoFocus />
          <label style={{fontSize:11,fontWeight:600,color:'var(--text-muted)',display:'block',marginBottom:4}}>Note (optional)</label>
          <textarea className="date-input" style={{width:'100%',height:70,resize:'vertical',fontFamily:'var(--font-body)'}}
            placeholder="Can you take a look at this one? Resident needs a residency badge approved." value={note} onChange={e => setNote(e.target.value)} />
          {status && status !== 'sending' && status !== 'sent' && <div style={{fontSize:11,color:'var(--red)',marginTop:8}}>{status}</div>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-amber" disabled={status === 'sending' || status === 'sent'} onClick={send}>
            {status === 'sending' ? 'Sending…' : status === 'sent' ? '✓ Sent' : '✉ Forward'}
          </button>
        </div>
      </div>
    </div>
  );
}

function NotifySettings({ initialEmails }) {
  const [open, setOpen] = useState(false);
  const [value, setValue] = useState((initialEmails || []).join(', '));
  const [status, setStatus] = useState(null); // null | 'saving' | 'saved' | error string
  async function save() {
    setStatus('saving');
    try {
      const resp = await fetch(`/${ORG_SLUG}/api/support/notify-emails?token=${TOKEN}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ emails: value }) });
      const json = await resp.json();
      if (json.ok) { setValue((json.emails || []).join(', ')); setStatus('saved'); track('support_notify_updated'); setTimeout(() => setStatus(null), 2000); }
      else setStatus(json.error || 'Failed to save');
    } catch (e) { setStatus('Failed to save'); }
  }
  return (
    <div style={{position:'relative'}}>
      <button className="btn btn-sm" onClick={() => setOpen(o => !o)}>{'🔔'} Notifications</button>
      {open && (
        <div className="status-menu" style={{width:340,padding:14}} onClick={e => e.stopPropagation()}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--text-primary)',marginBottom:4}}>Escalation notifications</div>
          <div style={{fontSize:11,color:'var(--text-secondary)',marginBottom:10}}>
            When Rec's support team escalates a resident question to your org, these addresses get the email with a link to the conversation.</div>
          <input type="text" className="date-input" style={{width:'100%',marginBottom:8}}
            placeholder="staff@yourcity.gov, parks@yourcity.gov" value={value} onChange={e => setValue(e.target.value)} />
          {status && status !== 'saving' && status !== 'saved' && <div style={{fontSize:11,color:'var(--red)',marginBottom:8}}>{status}</div>}
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
            <button className="btn btn-sm" onClick={() => setOpen(false)}>Close</button>
            <button className="btn btn-sm btn-amber" disabled={status === 'saving'} onClick={save}>
              {status === 'saving' ? 'Saving…' : status === 'saved' ? '✓ Saved' : 'Save'}</button>
          </div>
        </div>
      )}
    </div>
  );
}

function SupportInbox({ actionsDisabled, onConversationSeen, notifyEmails, dateRange, refreshNonce }) {
  const [convs, setConvs] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [thread, setThread] = useState(null);
  const [isLive, setIsLive] = useState(false);
  const [filter, setFilter] = useState('open'); // all | open | closed — default to Open; no one wants to land on closed tickets
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState('newest'); // newest | oldest | activity
  const [forwardOpen, setForwardOpen] = useState(false);
  const [statusOpen, setStatusOpen] = useState(false);
  const [statusBusy, setStatusBusy] = useState(false);
  const [noteText, setNoteText] = useState('');
  const [noteBusy, setNoteBusy] = useState(false);

  async function sendNote() {
    const text = noteText.trim();
    if (!thread || !text || noteBusy) return;
    setNoteBusy(true);
    try {
      const resp = await fetch(`/${ORG_SLUG}/api/support/inbox/${thread.id}/note?token=${TOKEN}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      const json = await resp.json();
      if (json.ok) {
        setThread(t => t && t.id === thread.id ? { ...t, messages: [...t.messages,
          { role: 'note', name: 'Your team', at: Math.floor(Date.now() / 1000), text: `💬 Note to Rec Support: ${text}` }] } : t);
        setNoteText('');
        track('support_note_added', { conversationId: thread.id });
      }
    } catch (e) {}
    setNoteBusy(false);
  }

  async function setStatus(status) {
    if (!thread || statusBusy) return;
    setStatusBusy(true);
    try {
      const resp = await fetch(`/${ORG_SLUG}/api/support/inbox/${thread.id}/status?token=${TOKEN}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
      const json = await resp.json();
      if (json.ok) {
        const patch = { orgResolved: !!json.resolved, state: json.state };
        setThread(t => t && t.id === thread.id ? { ...t, ...patch } : t);
        setConvs(cs => cs.map(c => c.id === thread.id ? { ...c, ...patch } : c));
        track('support_status_set', { conversationId: thread.id, status });
      }
    } catch (e) {}
    setStatusBusy(false); setStatusOpen(false);
  }

  const [loadError, setLoadError] = useState(false);
  const [lastFetched, setLastFetched] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  function loadInbox(opts) {
    const { quiet, fresh } = opts || {};
    setLoadError(false);
    if (!quiet) setConvs(null); // quiet refreshes update in place, no skeleton flash
    else setRefreshing(true);
    const range = dateRange ? `&start=${dateRange.start}&end=${dateRange.end}` : '';
    fetch(`/${ORG_SLUG}/api/support/inbox?token=${TOKEN}${range}${fresh ? '&fresh=1' : ''}`).then(r => r.json()).then(json => {
      if (!json.conversations) throw new Error(json.error || 'no data');
      setConvs(prev => {
        // keep the current selection when it still exists; only auto-select on first load
        const deepLink = params.get('conversation');
        setSelectedId(sel => {
          if (json.conversations.some(c => c.id === sel)) return sel;
          if (deepLink && json.conversations.some(c => c.id === deepLink)) return deepLink;
          return json.conversations[0]?.id || null;
        });
        return json.conversations;
      });
      setIsLive(!!json.live); setLastFetched(Date.now()); setRefreshing(false);
    }).catch(() => { setRefreshing(false); if (!quiet) { setConvs([]); setLoadError(true); } });
  }
  useEffect(() => loadInbox(), [dateRange?.start, dateRange?.end]); // inbox follows the dashboard date picker
  useEffect(() => { if (refreshNonce) loadInbox({ quiet: true, fresh: true }); }, [refreshNonce]); // header Refresh button
  // Quiet auto-refresh every 60s while the browser tab is visible
  useEffect(() => {
    const t = setInterval(() => { if (document.visibilityState === 'visible') loadInbox({ quiet: true }); }, 60000);
    return () => clearInterval(t);
  }, [dateRange?.start, dateRange?.end]);

  useEffect(() => {
    if (!selectedId) return;
    setThread(null);
    fetch(`/${ORG_SLUG}/api/support/inbox/${selectedId}?token=${TOKEN}`).then(r => r.json())
      .then(json => setThread(json.conversation || null)).catch(() => {});
    if (onConversationSeen) onConversationSeen(selectedId); // shrink the tab's escalation badge
    track('support_thread_viewed', { conversationId: selectedId });
  }, [selectedId]);

  if (!convs) return (
    <div className="dashboard-section">
      <div className="section-header"><span className="section-icon">{'📥'}</span><span className="section-label">Support Inbox</span><div className="section-line" /></div>
      <div className="skeleton skeleton-chart" style={{height:420}} />
      <div style={{fontSize:11,color:'var(--text-muted)',marginTop:8}}>Loading resident conversations from Intercom — the first load can take a minute…</div>
    </div>
  );
  if (loadError) return (
    <div className="dashboard-section">
      <div className="section-header"><span className="section-icon">{'📥'}</span><span className="section-label">Support Inbox</span><div className="section-line" /></div>
      <div style={{padding:24,fontSize:12,color:'var(--text-secondary)',background:'var(--bg-card)',border:'1px solid var(--border-subtle)',borderRadius:12}}>
        Couldn't load conversations. <button className="btn btn-sm" style={{marginLeft:8}} onClick={loadInbox}>{'↻'} Retry</button>
      </div>
    </div>
  );

  const q = search.trim().toLowerCase();
  const SORTS = {
    newest: (a, b) => b.createdAt - a.createdAt,
    oldest: (a, b) => a.createdAt - b.createdAt,
    activity: (a, b) => b.updatedAt - a.updatedAt,
  };
  const shown = convs
    .filter(c => filter === 'all' || c.state === filter)
    .filter(c => !q || [c.subject, c.contact.name, c.contact.email, c.topic, c.preview]
      .some(v => (v || '').toLowerCase().includes(q)))
    .sort(SORTS[sort] || SORTS.newest);
  const openCount = convs.filter(c => c.state === 'open').length;

  return (
    <div className="dashboard-section">
      <div className="section-header">
        <span className="section-icon">{'📥'}</span>
        <span className="section-label">Support Inbox</span>
        <div className="section-line" />
        <span style={{fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:8,

                <div style={{borderTop:'1px solid var(--border-subtle)',padding:'10px 14px',display:'flex',gap:8,alignItems:'flex-end'}}>

        onSent={id => { // reflect the Intercom tag immediately, without waiting for a refetch

// One-time dismissible "What's New" popup. Shows the first announcement whose
// id isn't in this browser's dismissed set (localStorage, per org). Server has
// already filtered `announcements` to what this org should see.
function WhatsNewPopup({ announcements, orgSlug }) {
  const KEY = 'rec-updates-dismissed-' + orgSlug;
  const readSeen = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return new Set(); } };
  const [seen, setSeen] = useState(readSeen);
  const list = announcements || [];
  const next = list.find(a => !seen.has(a.id));
  if (!next) return null;
  const dismiss = () => {
    const s = new Set(seen); s.add(next.id);
    try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch (e) {}
    setSeen(s);
  };
  const body = (next.items && next.items.length)
    ? (
      <ul style={{ margin: 0, padding: 0, listStyle: 'none' }}>
        {next.items.map((it, i) => (
          <li key={i} style={{ padding: '7px 0', borderBottom: i < next.items.length - 1 ? '1px solid #eee' : 'none', fontSize: 14, lineHeight: 1.5, color: '#333' }}>
            <span style={{ marginRight: 6 }}>{it.emoji || '✨'}</span>{it.text}
          </li>
        ))}
      </ul>
    )
    : (<div style={{ fontSize: 14, lineHeight: 1.6, color: '#333', whiteSpace: 'pre-wrap' }}>{next.body || ''}</div>);
  // Pasted-screenshot attachments — only render server-minted image URLs
  const imgs = (next.images || []).filter(u => /^\/announce-image\/[A-Za-z0-9_.-]+$/.test(String(u || '')));
  return (
    <div onClick={e => { if (e.target === e.currentTarget) dismiss(); }}
      style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
      <div style={{ background: '#fff', borderRadius: 14, maxWidth: 440, width: '100%', overflow: 'hidden', boxShadow: '0 20px 60px rgba(0,0,0,0.3)', fontFamily: 'var(--font-body)' }}>
        <div style={{ background: 'linear-gradient(135deg,#6d28d9,#7c3aed)', color: '#fff', padding: '16px 20px', fontWeight: 700, fontSize: 16 }}>
          {'📣'} {next.title || 'What’s new'}
        </div>
        <div style={{ padding: '16px 20px', maxHeight: '55vh', overflow: 'auto' }}>
          {body}
          {imgs.map((u, i) => <img key={i} src={u} alt="" style={{ maxWidth: '100%', border: '1px solid #e5e5e5', borderRadius: 8, marginTop: 12, display: 'block', boxShadow: '0 2px 8px rgba(0,0,0,0.08)' }} />)}
        </div>
        <div style={{ padding: '0 20px 18px', textAlign: 'right' }}>
          <button onClick={dismiss} style={{ background: '#7c3aed', color: '#fff', border: 'none', borderRadius: 8, padding: '9px 20px', fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'var(--font-body)' }}>Got it</button>
        </div>
      </div>
    </div>
  );
}

// "Compare To" control. Lets the user pick what the delta pills measure
// against. The prior-quarter option is data-aware: opening the menu probes
// whether the org actually has data for that window and disables the option
// (with a reason) when it doesn't, so we never offer a comparison that would
// render empty.
function CompareDropdown({ mode, options, onChange, avail, onEnsureAvail }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    options.forEach(o => { if (o.gate && o.win) onEnsureAvail(o.win); });
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);
  const cur = options.find(o => o.mode === mode) || options[0];
  return (
    <div className="cmp-dd" ref={ref}>
      <button className={'btn-quick' + (mode !== 'none' ? ' active' : '')} onClick={() => setOpen(o => !o)}
        title="Compare the current period against an earlier one">
        {'⇄'} Compare: {cur.short} {'▾'}
      </button>
      {open && (
        <div className="cmp-dd-menu">
          {options.map(o => {
            const key = o.win ? o.win.start + ':' + o.win.end : '';
            const av = o.gate ? avail[key] : true; // undefined=unknown, null=checking, bool=known
            const noWin = o.gate && !o.win;
            const disabled = noWin || av === false;
            const checking = o.gate && av === null;
            let sub = o.subLabel || '';
            if (o.mode === 'none') sub = 'Hide period-over-period deltas';
            else if (checking) sub = 'checking data…';
            else if (noWin) sub = 'unavailable for this range';
            else if (av === false) sub = 'no data for ' + (o.subLabel || 'that period');
            else if (o.subLabel) sub = 'vs ' + o.subLabel;
            return (
              <button key={o.mode} className={'cmp-dd-item' + (o.mode === mode ? ' active' : '') + (disabled ? ' disabled' : '')}
                disabled={disabled} onClick={() => { if (disabled) return; onChange(o.mode); setOpen(false); }}>
                <span className="cmp-dd-item-label">{o.label}</span>
                <span className="cmp-dd-item-sub">{sub}</span>
                {o.mode === mode && <span className="cmp-dd-check">{'✓'}</span>}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function DashboardApp() {
  const [config, setConfig] = useState(null);
  const [orgMeta, setOrgMeta] = useState({});
  const [availableReports, setAvailableReports] = useState({});
  const [dateRange, setDateRange] = useState(getMonthRange(0));
  const [datePreset, setDatePreset] = useState('thisMonth');
  const [reportData, setReportData] = useState({});
  const [priorReportData, setPriorReportData] = useState(null); // { _window: {start,end}, [rt]: rows } — lazy, for delta pills
  const [freshRts, setFreshRts] = useState({}); // report types already refreshed by the in-flight batch
  const [compareMode, setCompareMode] = useState('prior-period'); // 'none' | 'prior-period' | 'prior-quarter'
  const [compareAvail, setCompareAvail] = useState({}); // window key -> undefined(unknown) | null(checking) | bool
  const fetchGen = useRef(0); // bumped per fetch batch so late results from a superseded range are discarded
  const priorGen = useRef(0); // same, for the independent comparison fetch
  const briefingRef = React.useRef(null);

  // Probe whether the org has data for a comparison window (used to gate the
  // "Prior quarter" menu item). A single GL fetch is a good proxy — no revenue
  // rows in the window means nothing to compare against. Cached per window.
  async function ensureCompareAvail(win) {
    if (!win) return;
    const key = win.start + ':' + win.end;
    if (compareAvail[key] !== undefined) return;
    setCompareAvail(a => ({ ...a, [key]: null }));
    try {
      const rows = await fetchReportData('gl', win);
      setCompareAvail(a => ({ ...a, [key]: Array.isArray(rows) && rows.length > 0 }));
    } catch (e) { setCompareAvail(a => ({ ...a, [key]: false })); }
  }

  function buildDigestPayload() {
    const payload = [];
    (config.sections || []).forEach(function(sec) {
      var secWidgets = [];
      var secDef = SECTIONS[sec.id] || {};
      (sec.widgets || secDef.defaultWidgets || []).forEach(function(wid) {
        var def = W[wid];
        if (!def || def.component === 'table' || def.component === 'map') return;
        var raw = reportData[def.reportType];
        if (!raw) return;
        try {
          var data = def.transform(raw);
          if (def.component === 'metric' && data && data.value != null) {
            secWidgets.push({ label: def.label, value: fmt(data.value, data.format), delta: data.delta || null });
          } else if (data && data.labels && data.values) {
            var top = data.labels.slice(0, 3).map(function(l, i) { return l + ': ' + fmt(data.values[i], data.format); }).join(', ');
            secWidgets.push({ label: def.label, value: top });
          }
        } catch(e) {}
      });
      if (secWidgets.length) {
        payload.push({ title: secDef.label || sec.id, icon: secDef.icon || '', widgets: secWidgets });
      }
    });
    return payload;
  }

  async function handleSendDigest(email) {
    var sections = buildDigestPayload();
    var dr = dateRange ? dateRange.start + ' to ' + dateRange.end : 'current month';
    var resp = await fetch('/' + ORG_SLUG + '/api/send-digest?token=' + TOKEN, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        sections: sections,
        dateRange: dr,
        orgName: orgMeta.name || ORG_SLUG,
        briefing: briefingRef.current || null
      })
    });
    return resp.json();
  }
  const [loading, setLoading] = useState(true);
  const [editOpen, setEditOpen] = useState(false);
  // Which section the edit modal should open focused on. Null = opened from the
  // toolbar's Edit Dashboard, so no section is singled out.
  const [editFocus, setEditFocus] = useState(null);
  function openSectionWidgets(sectionId) {
    setEditFocus(sectionId);
    setEditOpen(true);
    track('edit_opened', { from: 'section', section: sectionId });
  }
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [activeTab, setActiveTab] = useState(params.get('tab') === 'support' ? 'support' : 'dashboard');
  const [supportRefreshNonce, setSupportRefreshNonce] = useState(0);

  // ── Escalation badge: red count on the Customer Support tab ──
  // Counts escalated conversations this browser hasn't opened yet; viewing
  // a thread marks it seen (localStorage) and the badge shrinks.
  const [supportConvs, setSupportConvs] = useState(null);
  const [seenBump, setSeenBump] = useState(0);
  const SEEN_KEY = `rec-support-seen-${ORG_SLUG}`;
  const getSeen = () => { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); } catch (e) { return new Set(); } };
  const markConversationSeen = useCallback(id => {
    const seen = getSeen();
    if (seen.has(id)) return;
    seen.add(id);
    try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); } catch (e) {}
    setSeenBump(b => b + 1);
  }, []);
  useEffect(() => {
    if (!availableReports.support || IS_SHARE || IS_PRINT) return;
    fetch(`/${ORG_SLUG}/api/support/inbox?token=${TOKEN}&start=${dateRange.start}&end=${dateRange.end}`).then(r => r.json())
      .then(json => setSupportConvs(json.conversations || [])).catch(() => {});
  }, [availableReports.support, dateRange.start, dateRange.end]);
  // Open questions awaiting a reply — surfaced as a red count on the Customer
  // Support tab so the admin sees pending questions without opening the tab.
  const openBadge = supportConvs ? supportConvs.filter(c => c.state === 'open').length : 0;
  const [lastRefresh, setLastRefresh] = useState(null);
  const [fetchErrors, setFetchErrors] = useState({});
  const [theme, setTheme] = useState('light');
  const [targets, setTargets] = useState({});
  const [chartTypes, setChartTypes] = useState({}); // smart-card viz overrides: { [widgetId]: 'bar'|'donut'|'line' }

  function applyTheme(t) {
    setTheme(t);
    document.documentElement.setAttribute('data-theme', t);
    applyChartTheme(t);
    track('theme_changed', { theme: t });
  }

  useEffect(() => {
    (async () => {
      try {
        const configUrl = IS_SHARE
          ? `/share/${SHARE_TOKEN}/config`
          : `/${ORG_SLUG}/api/config?token=${TOKEN}`;
        const resp = await fetch(configUrl);
        const json = await resp.json();
        setAvailableReports(json.availableReports || {});
        var _m = { name: json.orgName, logoUrl: json.logoUrl, city: json.city, state: json.state, toggles: json.toggles || {}, reportingBaseUrl: json.reportingBaseUrl || '',
          reportingSlug: json.reportingSlug || '', reportingToken: json.reportingToken || '', reportVisibility: json.reportVisibility || null, readOnly: json.readOnly || false, expiresAt: json.expiresAt || null, supportReadOnly: json.supportReadOnly || false, supportNotify: json.supportNotify || [], announcements: json.announcements || [],
          // The rec.us org uuid, for admin deep links. Explicitly copied like every
          // other field here — orgMeta is a whitelist, so a key the server sends
          // and this map forgets is simply absent, silently.
          recOrgId: json.recOrgId || '' };
        window._orgMeta = _m;
        setOrgMeta(_m);
        window._orgGeo = json.city && json.state ? `${json.city}, ${json.state}` : '';
        window._reportVisibility = json.reportVisibility || null;
        if (json.dateRange) { setDateRange(json.dateRange); setDatePreset(''); }
        if (json.config?.sections?.length > 0) {
          setConfig(json.config);
          if (!json.dateRange && json.config.datePreset) applyPreset(json.config.datePreset);
          if (json.config.theme) { setTheme(json.config.theme); document.documentElement.setAttribute('data-theme', json.config.theme); applyChartTheme(json.config.theme); }
          if (json.config.targets) setTargets(json.config.targets);
          if (json.config.chartTypes) setChartTypes(json.config.chartTypes);
        } else { setConfig('new'); }
      } catch (e) { setConfig('new'); }
    })();
  }, []);

  // Only refetch when sections/widgets change or date range changes, NOT theme/cacheTTL
  const dataKey = config && config !== 'new' ? JSON.stringify(config.sections.map(s=>s.id+':'+s.widgets.join(','))) + (availableReports.support ? '+support' : '') : '';

  useEffect(() => {
    if (!config || config === 'new') { setLoading(false); return; }
    const allWidgetIds = config.sections.flatMap(s => s.widgets);
    const baseRts = allWidgetIds.map(id => W[id]?.reportType).filter(Boolean);
    allWidgetIds.forEach(id => { var def = W[id]; if (def && def._extraReportTypes) def._extraReportTypes.forEach(function(rt){ baseRts.push(rt); }); });
    const rts = [...new Set(baseRts)];
    // The Customer Support tab is outside section config — load its data whenever the org has it
    if (availableReports.support && !rts.includes('support')) rts.push('support');
    if (!rts.length) { setLoading(false); return; }
    setLoading(true); clearDataStore(); setPriorReportData(null); setFreshRts({}); setFetchErrors({});

    // ── Progressive render ──────────────────────────────────────────────
    // Every report type is still requested in parallel, but each one is
    // written into state the moment it resolves rather than waiting on the
    // whole batch. Without this the dashboard is gated by its single slowest
    // query — for a big org that's ~98s of nothing on screen while ten of the
    // eleven reports sit finished in memory.
    //
    // `loading` deliberately stays true until the last request settles: it's
    // what keeps not-yet-arrived widgets showing a skeleton instead of an
    // empty state, and what the print handler waits on.
    const gen = ++fetchGen.current;
    let settled = 0;
    rts.forEach(rt => {
      fetchReportData(rt, dateRange).catch(e => { fetchFailures[rt] = e.message || 'fetch failed'; return null; })
        .then(rows => {
          // A newer date range / config superseded this batch — drop the result
          // rather than merging it over fresher data.
          if (gen !== fetchGen.current) return;
          setReportData(prev => ({ ...prev, [rt]: rows || [] }));
          setFreshRts(prev => ({ ...prev, [rt]: true }));
          setFetchErrors({ ...fetchFailures });
          if (++settled === rts.length) onAllSettled();
        });
    });

    function onAllSettled() {
      setLoading(false); setLastRefresh(new Date());
      track('dashboard_view', { sections: config.sections.length, widgets: allWidgetIds.length, reportTypes: rts, dateRange });
    }
  }, [dataKey, dateRange]);

  // ── Comparison fetch for delta pills ────────────────────────────────
  // Runs independently of the main data load so switching "Compare To" never
  // refetches the whole board — only the prior-window copies of the
  // delta-flagged, date-sensitive report types. The pills fade in when this
  // resolves; an empty prior window clears them (and records unavailability).
  useEffect(() => {
    if (!config || config === 'new') return;
    const pw = comparisonWindow(dateRange, compareMode);
    if (!pw) { setPriorReportData(null); return; }
    const allWidgetIds = config.sections.flatMap(s => s.widgets);
    const rts = new Set(allWidgetIds.map(id => W[id]?.reportType).filter(Boolean));
    const deltaRts = [...new Set(Object.values(W).filter(d => d.delta && d.component === 'metric').map(d => d.reportType))]
      .filter(rt => rts.has(rt) && !ALL_TIME_REPORTS.has(rt));
    if (!deltaRts.length) { setPriorReportData(null); return; }
    const gen = ++priorGen.current;
    Promise.all(deltaRts.map(rt => fetchReportData(rt, pw).then(rows => [rt, rows]).catch(() => [rt, null])))
      .then(pres => {
        if (gen !== priorGen.current) return;
        const anyRows = pres.some(([, rows]) => Array.isArray(rows) && rows.length);
        const key = pw.start + ':' + pw.end;
        setCompareAvail(a => (a[key] === anyRows ? a : { ...a, [key]: anyRows }));
        if (!anyRows) { setPriorReportData(null); return; }
        const pd = { _window: pw, _label: comparisonLabel(pw, compareMode) };
        pres.forEach(([rt, rows]) => { if (Array.isArray(rows)) pd[rt] = rows; });
        setPriorReportData(pd);
      });
  }, [compareMode, dataKey, dateRange]);

  function applyPreset(p) {
    setDatePreset(p);
    if (p==='thisMonth') setDateRange(getMonthRange(0));
    else if (p==='lastMonth') setDateRange(getMonthRange(-1));
    else if (p==='last3') { const r=getMonthRange(-2); r.end=getMonthRange(0).end; setDateRange(r); }
    else if (p==='nextMonth') setDateRange(getMonthRange(1));
    else if (p==='ytd') { const now=new Date(); setDateRange({start:`${now.getFullYear()}-01-01`,end:now.toISOString().split('T')[0]}); }
    track('date_preset_changed', { preset: p });
  }

  async function saveConfig(cfg) {
    try { await fetch(`/${ORG_SLUG}/api/config?token=${TOKEN}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(cfg) }); } catch(e) {}
  }

  async function handleSelectTemplate(key, customSections, chosenTheme) {
    let secs;
    if (key === '__custom' && customSections) {
      secs = customSections;
    } else {
      const t = TEMPLATES[key];
      secs = t.sections.map(s=>({...s, widgets:[...s.widgets]}));
    }
    const t = chosenTheme || 'light';
    const cfg = { template: key, sections: secs, cacheTTL: 15, datePreset: 'thisMonth', theme: t };
    setConfig(cfg); setTheme(t); document.documentElement.setAttribute('data-theme', t); await saveConfig(cfg);
    track('template_selected', { template: key, sections: secs.length, theme: t });
  }

  async function handleSaveSections(sections) {
    const oldIds = config.sections.map(s=>s.id);
    const newIds = sections.map(s=>s.id);
    const added = newIds.filter(id => !oldIds.includes(id));
    const removed = oldIds.filter(id => !newIds.includes(id));
    const cfg = { ...config, sections }; setConfig(cfg); setEditOpen(false); await saveConfig(cfg);
    track('layout_saved', { sections: sections.length, widgets: sections.reduce((s,sec)=>s+sec.widgets.length,0), sectionsAdded: added, sectionsRemoved: removed });
  }

  async function handleClearCache() {
    try { await fetch(`/${ORG_SLUG}/api/cache/clear?token=${TOKEN}`, {method:'POST'}); } catch(e) {}
    clearDataStore(); setDateRange({...dateRange}); setSettingsOpen(false);
    track('cache_cleared');
  }

  async function handleReset() {
    try { await fetch(`/${ORG_SLUG}/api/config?token=${TOKEN}`, {method:'DELETE'}); } catch(e) {}
    track('dashboard_reset');
    flushEvents();
    setConfig('new'); setSettingsOpen(false);
  }

  async function handleCacheTTLChange(ttl) { const cfg={...config,cacheTTL:ttl}; setConfig(cfg); await saveConfig(cfg); }
  async function handleThemeChange(t) { applyTheme(t); const cfg={...config,theme:t}; setConfig(cfg); await saveConfig(cfg); }
  async function handleTargetChange(widgetId, value) {
    const newTargets = { ...targets };
    if (value == null) { delete newTargets[widgetId]; } else { newTargets[widgetId] = value; }
    setTargets(newTargets);
    const cfg = { ...config, targets: newTargets }; setConfig(cfg); await saveConfig(cfg);
    track('target_set', { widget: widgetId, value });
  }
  async function handleChartTypeChange(widgetId, type) {
    const next = { ...chartTypes };
    const def = W[widgetId];
    // Drop the override when it matches the widget's default, so config stays lean.
    if (!type || (def && def.component === type)) { delete next[widgetId]; } else { next[widgetId] = type; }
    setChartTypes(next);
    const cfg = { ...config, chartTypes: next }; setConfig(cfg); await saveConfig(cfg);
    track('chart_type_changed', { widget: widgetId, type });
  }
  function handleRefresh() { clearDataStore(); setDateRange({...dateRange}); setSupportRefreshNonce(n => n + 1); track('refresh_clicked'); }
  function handleCompareChange(m) { setCompareMode(m); track('compare_changed', { mode: m, dateRange }); }
  const comparePeriodWin = priorWindow(dateRange);
  const compareQuarterWin = priorQuarterWindow(dateRange);
  const compareOptions = [
    { mode: 'none', short: 'Off', label: 'No comparison', win: null },
    { mode: 'prior-period', short: 'Prior period', label: 'Prior period', win: comparePeriodWin, subLabel: comparisonLabel(comparePeriodWin, 'prior-period') },
    { mode: 'prior-quarter', short: 'Prior quarter', label: 'Prior quarter', win: compareQuarterWin, subLabel: comparisonLabel(compareQuarterWin, 'prior-quarter'), gate: true },
  ];

  // Auto-print in print mode (must be before early returns to maintain hook order)
  useEffect(() => {
    if (IS_PRINT && !loading && lastRefresh) {
      setTimeout(() => window.print(), 500);
    }
  }, [loading, lastRefresh]);

  if (config === 'new') return <TemplateChooser onSelect={handleSelectTemplate} orgMeta={orgMeta} hasSupport={!!availableReports.support} />;
  if (!config) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'var(--text-secondary)'}}>Loading...</div>;

  const isReadOnly = orgMeta.readOnly || IS_SHARE;
  const totalWidgets = config.sections.reduce((s,sec) => s + sec.widgets.length, 0);
  const displaySections = (() => {
    const filtered = config.sections.filter(sec => {
      if (sec.id === 'ai-briefing') return false;
      if (sec.id === 'support') return false; // lives in its own tab
      if (PRINT_SECTIONS && !PRINT_SECTIONS.includes(sec.id)) return false;
      if (!orgMeta.reportVisibility) return true;
      const reportType = SECTION_REPORT_MAP[sec.id];
      if (!reportType) return true;
      const vis = orgMeta.reportVisibility.find(v => v.type === reportType);
      if (!vis) return true;
      return vis.visible;
    });
    const userIdx = filtered.findIndex(s => s.id === 'users-demographics');
    if (userIdx > 0) { const [ud] = filtered.splice(userIdx, 1); filtered.unshift(ud); }
    return filtered;
  })();

  return (
    <div>
      {!IS_PRINT && !isReadOnly && <WhatsNewPopup announcements={orgMeta.announcements} orgSlug={ORG_SLUG} />}
      {!IS_PRINT && !isReadOnly && (
        <div style={{background:'linear-gradient(135deg,#ea580c,#f97316)',padding:'8px 24px',textAlign:'center',
          fontSize:13,fontWeight:600,color:'#fff',fontFamily:'var(--font-body)',letterSpacing:'0.02em'}}>
          Enhanced Reports in Early Access — Contact <a href="mailto:dan@rec.us" style={{color:'#fff',textDecoration:'underline'}}>dan@rec.us</a> with Feedback or Questions
        </div>
      )}
      {isReadOnly && !IS_PRINT && (
        <div style={{background:'linear-gradient(135deg,#3b82f6,#2563eb)',padding:'8px 24px',textAlign:'center',
          fontSize:12,fontWeight:500,color:'#fff',fontFamily:'var(--font-body)'}}>
          Shared Dashboard {orgMeta.expiresAt ? '\u00B7 View-only link' : ''} — Powered by <span style={{fontWeight:700}}>rec.us</span>
        </div>
      )}
      <div className={`dash-header ${IS_PRINT ? 'print-header' : ''}`}>
        <div className="dash-header-left">
          {orgMeta.logoUrl && <img src={orgMeta.logoUrl} className="dash-logo" alt="" />}
          <div><div className="dash-title">{orgMeta.name || ORG_SLUG}</div><div className="dash-subtitle">Dashboard{isReadOnly ? ' (shared view)' : ''}</div></div>
        </div>
        {!IS_PRINT && (
          <div className="dash-header-center">
            {isReadOnly ? (
              <span style={{fontSize:12,color:'var(--text-muted)'}}>{dateRange.start} to {dateRange.end}</span>
            ) : (
              <React.Fragment>
                <input type="date" className="date-input" value={dateRange.start} onChange={e=>{setDatePreset('');setDateRange(p=>({...p,start:e.target.value}));}} />
                <span style={{color:'var(--text-muted)',fontSize:12}}>to</span>
                <input type="date" className="date-input" value={dateRange.end} onChange={e=>{setDatePreset('');setDateRange(p=>({...p,end:e.target.value}));}} />
                <button className={`btn-quick ${datePreset==='lastMonth'?'active':''}`} onClick={()=>applyPreset('lastMonth')}>Last Mo</button>
                <button className={`btn-quick ${datePreset==='thisMonth'?'active':''}`} onClick={()=>applyPreset('thisMonth')}>This Mo</button>
                <button className={`btn-quick ${datePreset==='nextMonth'?'active':''}`} onClick={()=>applyPreset('nextMonth')}>Next Mo</button>
                <button className={`btn-quick ${datePreset==='last3'?'active':''}`} onClick={()=>applyPreset('last3')}>3 Mo</button>
                <button className={`btn-quick ${datePreset==='ytd'?'active':''}`} onClick={()=>applyPreset('ytd')}>YTD</button>
                <CompareDropdown mode={compareMode} options={compareOptions} onChange={handleCompareChange}
                  avail={compareAvail} onEnsureAvail={ensureCompareAvail} />
              </React.Fragment>
            )}
          </div>
        )}
        {!IS_PRINT && !isReadOnly && (
          <div className="dash-header-right">
            <button className="btn" onClick={handleRefresh}>{'\u21BB'} Refresh</button>
            <button className="btn" onClick={()=>{setEditFocus(null);setEditOpen(true);track('edit_opened',{from:'toolbar'});}}>{'\u270E'} Edit Dashboard</button>
            <div style={{position:'relative'}}>
              <button className="btn" onClick={()=>setSettingsOpen(!settingsOpen)}>{'\u2699'}</button>
              {settingsOpen && <SettingsPopover cacheTTL={config.cacheTTL||15} onCacheTTLChange={handleCacheTTLChange} onClearCache={handleClearCache} onReset={handleReset} theme={theme} onThemeChange={handleThemeChange} emailDigestEnabled={orgMeta.toggles?.emailDigest === true} sections={config.sections} dateRange={dateRange} onSendDigest={handleSendDigest} />}
            </div>
          </div>
        )}
      </div>
      {!IS_PRINT && (
        <div className="settings-bar">
          <div><span className="cache-dot" style={{background:loading?'var(--amber)':'var(--green)'}} />
            {loading ? 'Loading data...' : lastRefresh ? `Last refreshed ${lastRefresh.toLocaleTimeString()}` : 'Ready'}</div>
          <div>{config.sections.length} sections {'\u00B7'} {totalWidgets} widgets{!isReadOnly ? ` \u00B7 cache ${config.cacheTTL||15}m` : ''}</div>
        </div>
      )}
      <div className={`loading-bar ${loading ? 'active' : ''}`}><div className="loading-bar-inner" /></div>

      {/* Failed feeds are an outage, not zeros — never let them look like data */}
      {!IS_PRINT && Object.keys(fetchErrors).length > 0 && (
        <div style={{background:'#fef2f2',border:'1px solid #fca5a5',borderRadius:8,padding:'10px 14px',margin:'10px 0',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <span style={{fontSize:13,color:'#991b1b'}}>
            <strong>{'⚠'} {Object.keys(fetchErrors).length} data feed{Object.keys(fetchErrors).length>1?'s':''} failed to load</strong>
            {' '}({Object.keys(fetchErrors).join(', ')}) — the numbers below are incomplete, not zero.
          </span>
          <button className="btn btn-sm" onClick={handleRefresh} style={{marginLeft:'auto'}}>{'↻'} Retry</button>
        </div>
      )}

      {!IS_PRINT && availableReports.support && (
        <div className="g-tabs" style={{marginBottom:14}}>
          <button className={`g-tab ${activeTab==='dashboard'?'active':''}`} onClick={()=>{setActiveTab('dashboard');track('tab_changed',{tab:'dashboard'});}}>{'📊'} Dashboard</button>
          <button className={`g-tab ${activeTab==='support'?'active':''}`} onClick={()=>{setActiveTab('support');track('tab_changed',{tab:'support'});}}>{'💬'} Customer Support
            {openBadge > 0 && <span className="tab-alert" title={`${openBadge} open question${openBadge > 1 ? 's' : ''} awaiting a reply`}>{openBadge}</span>}
          </button>
        </div>
      )}

      <div>
        {false && !IS_PRINT && config.sections.some(s => s.id === 'ai-briefing') && (
          <BriefingSection reportData={reportData} loading={loading} dateRange={dateRange} briefingRef={briefingRef} />
        )}
        {/* ABOVE the stored sections, and NOT read from config.sections: this
            is live data, so it is the thing you want on arrival, and gating it
            on a per-org config would mean nobody sees it until they go looking
            in the editor for a widget they do not know exists. It renders only
            where the feed exists at all (availableReports.enrollments is
            absent until the card has a public link), and never in print — a
            printed "right now" is a lie the moment the paper leaves the
            printer. */}
        {!IS_PRINT && activeTab === 'dashboard' && availableReports.enrollments && (
          <LiveSection reportingBaseUrl={orgMeta.reportingBaseUrl || ''} recOrgId={orgMeta.recOrgId || ''} />
        )}
        {(IS_PRINT || activeTab === 'dashboard' || !availableReports.support) && displaySections.map((sec, i) => (
          <SectionBlock key={sec.id+i+theme} sectionId={sec.id} widgetIds={sec.widgets} reportData={reportData} loading={loading} freshRts={freshRts} priorReportData={priorReportData}
            targets={targets} onTargetChange={handleTargetChange} chartTypes={chartTypes} onChartTypeChange={handleChartTypeChange} dateRange={dateRange} aiEnabled={!isReadOnly && orgMeta.toggles?.ai !== false}
            reportLinksEnabled={!isReadOnly && orgMeta.toggles?.reportLinks === true} reportingBaseUrl={orgMeta.reportingBaseUrl || ''}
            onCustomize={isReadOnly || IS_PRINT ? null : openSectionWidgets} />
        ))}
        {!IS_PRINT && activeTab === 'support' && availableReports.support && (
          <SupportTab key={'support'+theme} reportData={reportData} loading={loading} freshRts={freshRts} priorReportData={priorReportData} targets={targets}
            onTargetChange={handleTargetChange} chartTypes={chartTypes} onChartTypeChange={handleChartTypeChange} dateRange={dateRange} aiEnabled={!isReadOnly && orgMeta.toggles?.ai !== false}
            supportReadOnly={orgMeta.supportReadOnly} onConversationSeen={markConversationSeen} notifyEmails={orgMeta.supportNotify} refreshNonce={supportRefreshNonce} />
        )}
      </div>

      {!isReadOnly && editOpen && <EditModal sections={config.sections.filter(sec => {
          if (!orgMeta.reportVisibility) return true;
          const rt = SECTION_REPORT_MAP[sec.id];
          if (!rt) return true;
          const vis = orgMeta.reportVisibility.find(v => v.type === rt);
          return !vis || vis.visible;
        })} availableReports={availableReports} toggles={orgMeta.toggles || {}} focusSection={editFocus}
        onSave={handleSaveSections} onClose={()=>{setEditOpen(false);setEditFocus(null);}} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
</script>
</body>
</html>
