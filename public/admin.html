<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/public/favicon.ico" type="image/x-icon">
<title>rec.us Dashboard Platform — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f6f7f9; color: #1a1a1a; line-height: 1.6; }
a { color: #d97706; text-decoration: none; }
a:hover { text-decoration: underline; }
code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; background: #eef0f2; padding: 2px 6px; border-radius: 4px; }

.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

.header { border-bottom: 1px solid #e5e7eb; padding: 20px 0; margin-bottom: 32px; }
.header-inner { display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 700; }
.header h1 span { color: #f59e0b; }
.header-meta { font-size: 12px; color: #6b7280; }

/* Collapsible sections */
.collapsible { margin-bottom: 24px; }
.collapsible-header {
  font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600;
  padding: 12px 0; border-bottom: 1px solid #e5e7eb; cursor: pointer;
  display: flex; align-items: center; gap: 10px; user-select: none;
}
.collapsible-header:hover { color: #d97706; }
.collapsible-header .icon { font-size: 20px; }
.collapsible-header .flex { flex: 1; }
.chevron { font-size: 14px; color: #9ca3af; transition: transform 0.25s ease; display: inline-block; }
.collapsible.open .chevron { transform: rotate(180deg); }
.collapsible-body { overflow: hidden; max-height: 0; transition: max-height 0.35s ease; }
.collapsible.open .collapsible-body { max-height: 5000px; }
.collapsible-inner { padding: 16px 0; }

/* Org cards */
.org-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 16px; }
.org-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; transition: border-color 0.2s, box-shadow 0.2s; }
.org-card:hover { border-color: #cbd5e1; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.org-card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.org-logo { height: 40px; width: auto; max-width: 160px; border-radius: 6px; object-fit: contain; }
.org-name { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600; }
.org-slug { font-size: 12px; color: #6b7280; font-family: 'JetBrains Mono', monospace; }
.org-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.org-stat { background: #f1f3f5; border-radius: 8px; padding: 10px 12px; }
.org-stat-label { font-size: 10px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }
.org-stat-value { font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600; }
.org-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
.badge-green { background: rgba(34,197,94,0.15); color: #15803d; }
.badge-amber { background: rgba(245,158,11,0.18); color: #b45309; }
.badge-gray { background: rgba(100,116,139,0.15); color: #64748b; }
.badge-blue { background: rgba(59,130,246,0.15); color: #2563eb; }
.org-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
  padding: 6px 14px; border-radius: 6px; background: #f59e0b; color: #1a1a1a; transition: background 0.15s; }
.org-link:hover { background: #d97706; text-decoration: none; }
.org-updated { font-size: 11px; color: #9ca3af; margin-top: 10px; }

/* How it works */
.how-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 20px; }
.how-card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; }
.how-card h3 { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.how-card p { font-size: 13px; color: #4b5563; line-height: 1.7; }
.how-card p code { font-size: 0.85em; }

/* SVG container */
.svg-wrap { display: flex; justify-content: center; margin: 8px 0 12px; }
.svg-wrap svg { max-width: 100%; height: auto; }

/* Architecture text */
.arch-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
@media (max-width: 700px) { .arch-detail { grid-template-columns: 1fr; } }
.arch-block { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; }
.arch-block h4 { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #b45309; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.arch-block p { font-size: 13px; color: #4b5563; line-height: 1.7; }

/* Shared reports */
.shared-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.shared-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: #f1f3f5;
  border: 1px solid #e2e5e9; border-radius: 6px; padding: 4px 10px; color: #475569; }

/* Updates */
.update-entry { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; }
.update-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.update-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #b45309; background: rgba(245,158,11,0.12); padding: 2px 8px; border-radius: 4px; }
.update-title { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; }
.update-items { list-style: none; padding: 0; }
.update-items li { font-size: 13px; color: #4b5563; padding: 2px 0 2px 16px; position: relative; }
.update-items li::before { content: ''; position: absolute; left: 0; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; }

.loading { text-align: center; padding: 60px; color: #9ca3af; font-size: 14px; }
.footer { border-top: 1px solid #e5e7eb; padding: 20px 0; margin-top: 20px; text-align: center; font-size: 11px; color: #9ca3af; }
.add-org-btn { background: #22c55e; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; letter-spacing: 0.02em; transition: background 0.2s; }
.add-org-btn:hover { background: #16a34a; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 28px 32px; width: 440px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
.modal h2 { font-size: 18px; color: #111; margin: 0 0 20px; font-family: 'DM Sans', sans-serif; }
.modal label { display: block; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; font-weight: 500; }
.modal input { width: 100%; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 10px; color: #111; font-size: 13px; margin-bottom: 14px; box-sizing: border-box; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
.modal input:focus { border-color: #22c55e; }
.modal .row { display: flex; gap: 12px; }
.modal .row > div { flex: 1; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
.modal-actions button { padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; }
.modal-cancel { background: #e5e7eb; color: #374151; }
.modal-cancel:hover { background: #d1d5db; }
.modal-submit { background: #22c55e; color: #fff; }
.modal-submit:hover { background: #16a34a; }
.modal-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.modal .error { color: #dc2626; font-size: 12px; margin-bottom: 10px; display: none; }
.modal .success { background: #ecfdf5; border: 1px solid #22c55e; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
.modal .success .token { font-family: 'SF Mono', monospace; background: #f1f3f5; padding: 4px 8px; border-radius: 4px; color: #15803d; font-size: 13px; user-select: all; }
    /* Project Update composer — light mode (admin is otherwise dark) */
    #add-update-modal .modal { width: min(660px, 92vw); max-width: none; background: #fff; color: #1a1a1a; border-color: #e5e7eb; max-height: 90vh; overflow: auto; }
    #add-update-modal .modal h2 { color: #111; }
    #add-update-modal .modal label { color: #374151; }
    #add-update-modal .modal input, #add-update-modal .modal textarea { background: #fff; border-color: #d1d5db; color: #111; margin-bottom: 0; }
    /* Base admin CSS makes every .modal input width:100% — that balloons row checkboxes and crushes the text field. Constrain checkboxes. */
    #add-update-modal .modal input[type=checkbox] { width: 16px; height: 16px; flex: 0 0 auto; margin: 0; accent-color: #7c3aed; cursor: pointer; }
    #add-update-modal .modal input:focus, #add-update-modal .modal textarea:focus { border-color: #7c3aed; }
    #add-update-modal .modal-cancel { background: #eee; color: #333; }
    #add-update-modal .modal-cancel:hover { background: #ddd; }
    #add-update-modal .loading { color: #666; padding: 30px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-inner">
      <h1><span>rec.us</span> Dashboard Platform</h1>
      <div style="display:flex;align-items:center;gap:16px">
        <button class="add-org-btn" onclick="openUpd()">📣 Add Update</button>
        <div class="header-meta" id="header-meta">Loading...</div>
      </div>
    </div>
  </div>
  <div id="content"><div class="loading">Loading admin data...</div></div>

  <!-- Add Org Modal -->
  <div class="modal-overlay" id="add-org-modal" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal">
      <h2>Add New Organization</h2>
      <div class="error" id="add-org-error"></div>
      <div id="add-org-form">
        <label>Org Slug (lowercase, URL-safe)</label>
        <input id="ao-slug" placeholder="pflugerville" pattern="[a-z0-9-]+">
        <label>Display Name</label>
        <input id="ao-name" placeholder="City of Pflugerville">
        <label>rec.us Org UUID</label>
        <input id="ao-orgid" placeholder="460566d3-3a51-4387-a7a0-0b010923e40d">
        <div class="row">
          <div><label>City</label><input id="ao-city" placeholder="Pflugerville"></div>
          <div><label>State</label><input id="ao-state" placeholder="TX" maxlength="2" style="text-transform:uppercase"></div>
        </div>
        <label>Logo URL (optional — auto-generated from UUID)</label>
        <input id="ao-logo" placeholder="https://prod-rec-tech-img-bucket-...">
        <div class="modal-actions">
          <button class="modal-cancel" onclick="document.getElementById('add-org-modal').classList.remove('open')">Cancel</button>
          <button class="modal-submit" id="ao-submit" onclick="submitAddOrg()">Add Organization</button>
        </div>
      </div>
      <div id="add-org-success" class="success" style="display:none"></div>
    </div>
  </div>

  <!-- Add Update (Project Updates) Modal -->
  <div class="modal-overlay" id="add-update-modal" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal">
      <div id="upd-content"><div class="loading">Loading…</div></div>
    </div>
  </div>
  <div class="footer">rec.us Dashboard Platform &middot; Powered by shared Metabase cards, zero per-org duplication</div>
</div>

<script>
function toggleSection(id) {
  document.getElementById(id).classList.toggle('open');
}

async function toggleOrg(slug, key, value) {
  const body = {}; body[key] = value;
  await fetch('/admin/api/orgs/' + slug + '/toggles', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  // Support toggle reveals/hides the recipients field — re-render
  if (key === 'support') location.reload();
}

async function saveNotify(slug) {
  const input = document.getElementById('sn-' + slug);
  const btn = document.getElementById('snb-' + slug);
  const resp = await fetch('/admin/api/orgs/' + slug + '/support-notify', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ emails: input.value })
  });
  const json = await resp.json();
  if (json.ok) {
    input.value = (json.emails || []).join(', ');
    btn.textContent = '✓ Saved'; btn.style.background = '#22c55e';
  } else {
    btn.textContent = json.error || 'Error'; btn.style.background = '#ef4444'; btn.style.color = '#fff';
  }
  setTimeout(() => { btn.textContent = 'Save'; btn.style.background = '#14b8a6'; btn.style.color = '#000'; }, 2500);
}

(async function() {
  const resp = await fetch('/admin/api/orgs');
  const data = await resp.json();
  const { orgs, updates, sharedReports } = data;

  let evtData = { total: 0, byOrg: {}, byType: {}, last7Days: {} };
  try { const er = await fetch('/admin/api/events/summary'); evtData = await er.json(); } catch(e) {}

  document.getElementById('header-meta').textContent =
    orgs.length + ' org' + (orgs.length !== 1 ? 's' : '') + ' \u00B7 ' + sharedReports.length + ' shared reports \u00B7 ' + evtData.total + ' events \u00B7 ' + (evtData.byType['insight_generated'] || 0) + ' AI insights';

  const BASE = window.location.origin;

  document.getElementById('content').innerHTML = `

    <!-- ═══ Organizations ═══ -->
    <div class="collapsible open" id="sec-orgs">
      <div class="collapsible-header" onclick="toggleSection('sec-orgs')">
        <span class="icon">\uD83C\uDFE2</span>
        <span class="flex">Organizations</span>
        <span style="font-size:12px;color:#666;font-weight:400">${orgs.length} org${orgs.length !== 1 ? 's' : ''}</span>
        <button class="add-org-btn" onclick="event.stopPropagation(); document.getElementById('add-org-modal').classList.add('open')">+ Add Org</button>
        <span class="chevron">\u25BC</span>
      </div>
      <div class="collapsible-body"><div class="collapsible-inner">
        <div class="org-grid">
          ${orgs.map(o => `
            <div class="org-card">
              <div class="org-card-header">
                ${o.logoUrl ? '<img src="' + o.logoUrl + '" class="org-logo" alt="" onerror="this.style.display=\'none\'">' : ''}
                <div>
                  <div class="org-name">${o.name}</div>
                  <div class="org-slug">/${o.slug}</div>
                </div>
              </div>
              <div class="org-meta">
                <div class="org-stat"><div class="org-stat-label">Sections</div><div class="org-stat-value">${o.sectionCount}</div></div>
                <div class="org-stat"><div class="org-stat-label">Widgets</div><div class="org-stat-value">${o.widgetCount}</div></div>
                <div class="org-stat"><div class="org-stat-label">Events</div><div class="org-stat-value">${evtData.byOrg[o.slug] || 0}</div></div>
                <div class="org-stat"><div class="org-stat-label">AI Insights</div><div class="org-stat-value">${(evtData.byOrgType?.[o.slug]?.['insight_generated'] || 0)}</div></div>
                <div class="org-stat"><div class="org-stat-label">Dash Views</div><div class="org-stat-value">${(evtData.byOrgType?.[o.slug]?.['dashboard_view'] || 0)}</div></div>
                <div class="org-stat"><div class="org-stat-label">Layout Saves</div><div class="org-stat-value">${(evtData.byOrgType?.[o.slug]?.['layout_saved'] || 0)}</div></div>
              </div>
              <div class="org-badges">
                <span class="badge ${o.configured ? 'badge-green' : 'badge-gray'}">${o.configured ? 'Configured' : 'Not configured'}</span>
                ${o.template ? '<span class="badge badge-amber">' + o.template + '</span>' : ''}
                <span class="badge badge-blue">${o.theme || 'dark'} mode</span>
                <span class="badge badge-gray">cache ${o.cacheTTL}m</span>
                <span class="badge badge-gray">${o.reportCount} reports</span>
                <span class="badge" style="background:rgba(124,58,237,0.15);color:#7c3aed">\u2728 AI Insights</span>
                ${o.perOrgReports.length ? '<span class="badge badge-amber">custom: ' + o.perOrgReports.join(', ') + '</span>' : ''}
              </div>
              <a href="${BASE}/${o.slug}?token=${o.token}" class="org-link" target="_blank">\u2192 Open Dashboard</a>
              <div style="display:flex;gap:16px;margin-top:12px;padding-top:10px;border-top:1px solid #e5e7eb">
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#4b5563;cursor:pointer">
                  <input type="checkbox" ${o.toggles.ai ? 'checked' : ''} onchange="toggleOrg('${o.slug}','ai',this.checked)" style="accent-color:#7c3aed;width:16px;height:16px">
                  <span>\u2728 AI Insights</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#4b5563;cursor:pointer">
                  <input type="checkbox" ${o.toggles.reportLinks ? 'checked' : ''} onchange="toggleOrg('${o.slug}','reportLinks',this.checked)" style="accent-color:#f59e0b;width:16px;height:16px">
                  <span>\uD83D\uDD17 Report Linkage</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#4b5563;cursor:pointer">
                  <input type="checkbox" ${o.toggles.aiBriefing ? 'checked' : ''} onchange="toggleOrg('${o.slug}','aiBriefing',this.checked)" style="accent-color:#a855f7;width:16px;height:16px">
                  <span>\uD83D\uDCCB AI Briefing</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#4b5563;cursor:pointer">
                  <input type="checkbox" ${o.toggles.emailDigest ? 'checked' : ''} onchange="toggleOrg('${o.slug}','emailDigest',this.checked)" style="accent-color:#06b6d4;width:16px;height:16px">
                  <span>\uD83D\uDCE7 Email Digest</span>
                </label>
              </div>
              <div style="margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#4b5563;cursor:${o.supportLockedOn ? 'default' : 'pointer'}">
                    <input type="checkbox" ${o.support ? 'checked' : ''} ${o.supportLockedOn ? 'disabled' : ''} onchange="toggleOrg('${o.slug}','support',this.checked)" style="accent-color:#14b8a6;width:16px;height:16px">
                    <span>\uD83D\uDCAC Customer Support</span>
                  </label>
                  ${o.supportLockedOn ? '<span style="font-size:10px;color:#14b8a6;background:rgba(20,184,166,0.12);padding:2px 8px;border-radius:8px">enabled in code</span>' : ''}
                  ${o.supportReadOnly ? '<span style="font-size:10px;color:#f59e0b;background:rgba(245,158,11,0.12);padding:2px 8px;border-radius:8px">\uD83D\uDD12 read-only (testing)</span>' : ''}
                </div>
                ${o.support ? `
                <div style="display:flex;gap:6px;margin-top:8px;align-items:center">
                  <input id="sn-${o.slug}" type="text" placeholder="escalation emails, comma-separated" value="${(o.supportNotify || []).join(', ')}"
                    style="flex:1;background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:6px 10px;font-size:11px;color:#111;font-family:inherit">
                  <button id="snb-${o.slug}" onclick="saveNotify('${o.slug}')"
                    style="background:#14b8a6;color:#000;border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer">Save</button>
                </div>
                <div style="font-size:10px;color:#666;margin-top:4px">Who gets \u201CNew Customer Support inquiry\u201D emails when Rec tags an escalation. Orgs can also edit this from their dashboard.</div>
                ` : ''}
              </div>
              ${o.updatedAt ? '<div class="org-updated">Last updated: ' + new Date(o.updatedAt).toLocaleString() + '</div>' : ''}
            </div>
          `).join('')}
        </div>
      </div></div>
    </div>

    <!-- ═══ How It Works ═══ -->
    <div class="collapsible open" id="sec-how">
      <div class="collapsible-header" onclick="toggleSection('sec-how')">
        <span class="icon">\u2699\uFE0F</span>
        <span class="flex">How It Works</span>
        <span class="chevron">\u25BC</span>
      </div>
      <div class="collapsible-body"><div class="collapsible-inner">

        <!-- SVG Architecture Diagram -->
        <div class="svg-wrap">
          <svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" style="max-width:880px">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
              <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
              <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/></linearGradient>
              <filter id="cardShadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
            </defs>

            <!-- Background -->
            <rect width="880" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

            <!-- ── User / Browser ── -->
            <rect x="330" y="16" width="220" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>

        <!-- Detailed Architecture Blocks -->
        <div class="arch-detail">
          <div class="arch-block">
            <h4>Shared UUID Architecture</h4>
            <p>Every Metabase SQL card is written with a <code>{{org_id}}</code> template variable in its WHERE clause. The dashboard server injects the requesting org's UUID into this parameter at fetch time. This means <strong>one SQL card powers all organizations</strong> — no more duplicating and editing 50+ cards per org. Per-org UUID overrides are supported when an org needs a custom query (e.g. Norman's GL with a <code>Locations</code> column).</p>
          </div>
          <div class="arch-block">
            <h4>Widget Registry Pattern</h4>
            <p>Each widget is a self-contained definition: <code>reportType</code> (which Metabase data), <code>transform</code> (how to aggregate rows into chart data), <code>component</code> (metric card, bar, donut, or line chart), and <code>section</code> (which category it belongs to). Adding a new widget means one object in the registry — no routing, no new endpoints, no new HTML files.</p>
          </div>
          <div class="arch-block">
            <h4>Smart Data Batching</h4>
            <p>When a dashboard loads, the engine scans all active widgets, collects the unique <code>reportType</code> values needed, and fires those fetches in parallel. If 6 widgets all need <code>facility</code> data, that is one Metabase call, not six. Each widget's <code>transform</code> function slices what it needs from the shared response.</p>
          </div>
          <div class="arch-block">
            <h4>Section-Based Layouts</h4>
            <p>Widgets are organized into sections (Revenue Overview, Facility Rentals, Programs, etc). Admins choose which sections appear on their dashboard, reorder them, and customize widgets within each. The config is persisted to <code>/data/dashboards.json</code> on Railway's persistent volume, surviving restarts and redeploys.</p>
          </div>
          <div class="arch-block">
            <h4>Event Tracking Pipeline</h4>
            <p>Every user interaction fires a tracking event: dashboard views, date range changes, template selections, widget edits, layout saves, theme switches. Events batch client-side on a 2-second debounce, then POST as a JSON array. Server appends to <code>/data/events.jsonl</code> (one JSON object per line, append-only). Queryable via <code>/admin/api/events/summary</code>.</p>
          </div>
          <div class="arch-block">
            <h4>Adding a New Org</h4>
            <p>Add 5 lines to the <code>ORGS</code> map in server.js: slug, orgId, token, logoUrl, and optional per-org report UUIDs. All 12 shared report types light up automatically. Push to GitHub, Railway auto-deploys in ~60 seconds. The org's admin hits their URL, picks a template, and their dashboard is live. Total onboarding time: under 2 minutes.</p>
          </div>
          <div class="arch-block">
            <h4>Caching Layer</h4>
            <p>Every Metabase response is cached in-memory with a configurable TTL (5 min to 4 hours, per-org). Cache key is <code>org:reportType:dateParams</code> — same org, same report, same date range = instant response from cache. Multiple users on the same org share the cache. <strong>Metabase is only queried on: first load after restart, TTL expiry, date range change, or manual refresh.</strong> Page navigation, theme toggles, and widget editing never touch Metabase.</p>
          </div>
          <div class="arch-block">
            <h4>Performance vs Old Dashboards</h4>
            <p>The old Metabase iframe dashboard fires <strong>20+ independent queries</strong> every time someone opens the page — no caching, no batching, every card is a live hit. Our dashboard fires <strong>5 queries max</strong> (one per report type), caches the results, and serves all 20 widgets from those 5 responses. After the first load, subsequent views are <strong>zero Metabase queries</strong> until the TTL expires. Estimated <strong>75%+ reduction</strong> in Metabase load per org. Multiply by 59 orgs and the savings are massive.</p>
          </div>
          <div class="arch-block">
            <h4>Widget Limits</h4>
            <p>To prevent runaway query load, dashboards enforce a <strong>max 8 widgets per section</strong> and <strong>max 20 widgets per dashboard</strong>. The edit modal shows live counts and disables add buttons when limits are reached. Since each report type is fetched once regardless of widget count, the real constraint is rendering performance, not Metabase load — but the limits keep dashboards focused and fast.</p>
          </div>
          <div class="arch-block">
            <h4>Roadmap</h4>
            <p><strong>PDF Export:</strong> Section picker for downloadable snapshots. <strong>Email Summaries:</strong> Resend integration for daily digests to @rec.us admins. <strong>Langfuse:</strong> Thumbs up/down on AI insights with feedback loop. <strong>Schema Health Check:</strong> Startup column validation, broken widget alerts. <strong>Goal Targets:</strong> Pace calculations with month-end projections. <strong>Multi-Dashboard:</strong> Per-user/role dashboards (finance, aquatics, etc). <strong>QoQ Comparison:</strong> Dual date picker with delta indicators. <strong>Drag-and-Drop:</strong> react-grid-layout for widget positioning. <strong>1-Click Org Add:</strong> Admin panel skill to onboard new orgs.</p>
          </div>
          <div class="arch-block">
            <h4>Cross-Project Integration</h4>
            <p>The dashboard syncs with the rental-report project (the detailed reporting tool):</p>
            <ul>
              <li><strong>Org Sync</strong> &#8212; adding an org auto-creates it on the reporting side with the same token.</li>
              <li><strong>Report Links</strong> &#8212; toggle ON per org to show View Report buttons on section headers, linking to detailed reports.</li>
              <li><strong>Report Visibility</strong> &#8212; sections respect the reporting project hidden-report toggles. Disabled reports auto-hide from dashboard + editor.</li>
            </ul>
            <h4>AI Insights Engine</h4>
            <p>Each section header has a <strong>Rec Insights</strong> button. Click it: the frontend builds a text summary from the section's widget data, POSTs to <code>/:org/api/insights/:section</code>, which calls Claude Haiku with a section-specific prompt. 4-5 emoji-led, metric-cited bullet points appear in a purple gradient panel. AI can be toggled on/off per org from the admin panel. Events tracked to measure adoption.</p>
          </div>
          <div class="arch-block">
            <h4>Server-Side Geocoding</h4>
            <p>Map widgets use a server-side geocoding proxy (<code>/:org/api/geocode</code>) instead of browser-direct Nominatim calls. Results cached to <code>/data/geocache.json</code> — each city is only geocoded once, ever. Org city/state auto-appended to generic location names (e.g. "Arsenal Park" becomes "Arsenal Park, Watertown, MA"). CartoDB tiles switch between dark and light to match the dashboard theme.</p>
          </div>
          <div class="arch-block">
            <h4>Widget Targets</h4>
            <p>Metric cards have a gear icon that opens an inline target editor. Set a goal number (e.g. $50K revenue) and the card transforms: value on the left, SVG progress ring on the right, percentage below. Ring color shifts green/amber/red based on progress. Targets persist per-org in the config. Value updates automatically when the date range changes — same target, different progress.</p>
          </div>

async function submitAddOrg() {
  const errEl = document.getElementById('add-org-error');
  const btn = document.getElementById('ao-submit');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Adding...';

  const slug = document.getElementById('ao-slug').value.trim().toLowerCase();
  const name = document.getElementById('ao-name').value.trim();
  const orgId = document.getElementById('ao-orgid').value.trim();
  const city = document.getElementById('ao-city').value.trim();
  const state = document.getElementById('ao-state').value.trim().toUpperCase();
  const logoUrl = document.getElementById('ao-logo').value.trim();

  if (!slug || !orgId) {
    errEl.textContent = 'Slug and Org UUID are required';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Add Organization';
    return;
  }

  try {
    const resp = await fetch('/admin/api/orgs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, name: name || slug, orgId, city, state, logoUrl })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Failed');

    document.getElementById('add-org-form').style.display = 'none';
    const successEl = document.getElementById('add-org-success');
    successEl.innerHTML = '<div style="color:#22c55e;font-weight:600;margin-bottom:8px">\u2705 ' + data.slug + ' added!</div>' +
      '<div style="margin-bottom:8px"><span style="color:#999;font-size:11px">ACCESS TOKEN (save this):</span><br><span class="token">' + data.token + '</span></div>' +
      '<div style="font-size:12px;color:#999;margin-bottom:12px">Dashboard URL:<br><a href="/' + data.slug + '?token=' + data.token + '" style="color:#60a5fa" target="_blank">' + window.location.origin + '/' + data.slug + '?token=' + data.token + '</a></div>' +
      '<div style="font-size:11px;color:#666">All shared reports are live. Reload this page to see the new org card.</div>' +
      '<div class="modal-actions" style="margin-top:14px"><button class="modal-submit" onclick="window.location.reload()">Reload Admin</button></div>';
    successEl.style.display = 'block';
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Add Organization';
  }
}

// ══ Project Update composer ══════════════════════════════════════════
var updState = { orgs: [], visibility: {}, features: [], changelog: [], published: [], rows: null, mode: 'smart', title: null };

function openUpd() { document.getElementById('add-update-modal').classList.add('open'); loadUpd(); }
function closeUpd() { document.getElementById('add-update-modal').classList.remove('open'); }

async function loadUpd() {
  var box = document.getElementById('upd-content');
  box.innerHTML = '<div class="loading">Loading…</div>';
  updState.rows = null;
  if (updState.title == null) updState.title = '✨ What’s new on your dashboard';
  try {
    var r = await fetch('/admin/api/announcements');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    updState.orgs = d.orgs || [];
    updState.visibility = d.visibility || {};
    updState.features = d.features || [];
    updState.changelog = d.changelog || [];
    updState.published = d.announcements || [];
    renderUpd();
  } catch (e) {
    box.innerHTML = '<div class="error" style="display:block">Failed to load: ' + e.message + '</div>';
  }
}

function updEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function updEmoji(t) { var m = updState.features.find(function (x) { return x.key === t; }); return m ? m.emoji : '✨'; }
function updLabel(t) { var m = updState.features.find(function (x) { return x.key === t; }); return m ? m.label : t; }
function updKnown(t) { return !!updState.features.find(function (x) { return x.key === t; }); }
function updTotalOrgs() { return updState.orgs.length; }

// Infer which dashboard FEATURE(s) a changelog line is about (untagged = all orgs).
var UPD_RULES = [
  [/ai briefing/i, 'aiBriefing'],
  [/email digest|scheduled email|\bdigest\b/i, 'emailDigest'],
  [/report link|linkage|view report/i, 'reportLinks'],
  [/support|intercom|escalation|inbox/i, 'support'],
  [/ai insight|rec insight|\binsights?\b|\bai\b|claude|haiku/i, 'ai'],
];
function updInfer(text) {
  var out = [];
  UPD_RULES.forEach(function (rule) { if (rule[0].test(text) && out.indexOf(rule[1]) < 0 && updKnown(rule[1])) out.push(rule[1]); });
  return out;
}
function updCountOrgs(features) {
  var want = {}; features.forEach(function (f) { want[f] = 1; });
  var n = 0;
  Object.keys(updState.visibility).forEach(function (slug) {
    if ((updState.visibility[slug] || []).some(function (f) { return want[f]; })) n++;
  });
  return n;
}

function renderUpd() {
  var s = updState;
  function tab(mode, label) {
    return '<button onclick="updSetMode(\'' + mode + '\')" style="flex:1;padding:9px;border:1px solid #ddd;background:' + (s.mode === mode ? '#111' : '#fff') + ';color:' + (s.mode === mode ? '#fff' : '#333') + ';border-radius:6px;font-size:13px;font-weight:600;cursor:pointer">' + label + '</button>';
  }
  var html = '<h2 style="margin-bottom:4px">📣 Project Updates</h2>';
  html += '<div style="font-size:12px;color:#666;margin-bottom:14px">Tell orgs what shipped on their dashboard — untagged lines go to everyone; tag a line with a feature to target just the orgs that have it on.</div>';
  html += '<div style="display:flex;gap:8px;margin-bottom:14px">' + tab('smart', '📰 From changelog') + tab('manual', '✍️ Write manually') + '</div>';
  html += '<label>Update title</label><input id="upd-title" value="' + updEsc(s.title) + '" oninput="updState.title=this.value" style="width:100%;margin-bottom:12px">';
  html += (s.mode === 'smart') ? renderSmart() : renderManual();
  html += '<div class="modal-actions" style="margin-top:16px"><button class="modal-cancel" onclick="closeUpd()">Cancel</button>';
  html += (s.mode === 'smart')
    ? '<button class="modal-submit" onclick="submitSmart()">🚀 Publish to matched orgs</button>'
    : '<button class="modal-submit" onclick="submitManual()">🚀 Publish</button>';
  html += '</div>';
  html += renderPublished();
  document.getElementById('upd-content').innerHTML = html;
  if (s.mode === 'smart') updRecalc();
}
function updSetMode(m) { updState.mode = m; renderUpd(); }

function renderSmart() {
  var s = updState;
  if (!s.rows) {
    s.rows = (s.changelog || []).slice(0, 30).map(function (e) {
      var text = (e.title || (e.items && e.items[0]) || '').trim();
      var blob = [e.title].concat(e.items || []).join(' ');
      return { text: text, features: updInfer(blob), include: false, date: e.date || null };
    });
  }
  var html = '<div id="upd-imgs" style="display:none;flex-wrap:wrap;gap:10px;margin-bottom:8px"></div>';
  html += '<div style="font-size:10.5px;color:#aaa;margin:0 0 8px">📋 Paste a screenshot (Ctrl/Cmd+V) to attach it to this update</div>';
  html += '<div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Recent shipped changes — tick to include</div>';
  html += '<div style="max-height:280px;overflow:auto;border:1px solid #eee;border-radius:8px;padding:6px">';
  s.rows.forEach(function (row, i) {
    html += '<div style="border:1px solid #eee;border-radius:6px;padding:8px;margin-bottom:6px;background:' + (row.include ? '#f5f3ff' : '#fff') + '">';
    html += '<div style="display:flex;gap:8px;align-items:flex-start">';
    html += '<input type="checkbox" ' + (row.include ? 'checked' : '') + ' onchange="updToggleRow(' + i + ',this.checked)" style="margin-top:5px">';
    html += '<input value="' + updEsc(row.text) + '" oninput="updState.rows[' + i + '].text=this.value" style="flex:1;font-size:13px;padding:4px 6px;border:1px solid #ddd;border-radius:4px">';
    html += '</div>';
    html += '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-left:26px">';
    html += renderChips(i);
    html += updAddSelect(i);
    html += '<span style="margin-left:auto;font-size:11px;color:#7c3aed;font-weight:600">' + updRowAudience(row) + '</span>';
    html += '</div></div>';
  });
  html += '</div>';
  html += '<div id="upd-audience" style="margin-top:10px;padding:8px 12px;background:#f5f3ff;border-radius:6px;font-size:13px;font-weight:600;color:#5b21b6"></div>';
  return html;
}
function renderChips(i) {
  var row = updState.rows[i];
  return (row.features || []).map(function (ft) {
    return '<span style="display:inline-flex;align-items:center;gap:3px;background:#ede9fe;color:#5b21b6;border-radius:12px;padding:2px 8px;font-size:11px">' + updEmoji(ft) + ' ' + updEsc(updLabel(ft)) + ' <span onclick="updRemoveChip(' + i + ',\'' + ft + '\')" style="cursor:pointer;font-weight:700">×</span></span>';
  }).join(' ');
}
function updAddSelect(i) {
  var opts = '<option value="">+ feature</option>' + updState.features.map(function (f) { return '<option value="' + f.key + '">' + updEsc(f.label) + '</option>'; }).join('');
  return '<select onchange="updAddChip(' + i + ',this.value)" style="font-size:11px;border:1px solid #ddd;border-radius:4px;padding:2px 4px">' + opts + '</select>';
}
function updRowAudience(row) {
  if (!row.features || !row.features.length) return '→ all orgs';
  var n = updCountOrgs(row.features);
  return '→ ' + n + ' org' + (n === 1 ? '' : 's');
}
function updToggleRow(i, on) { updState.rows[i].include = on; renderUpd(); }
function updAddChip(i, ft) { if (!ft) return; var r = updState.rows[i]; if (r.features.indexOf(ft) < 0) r.features.push(ft); renderUpd(); }
function updRemoveChip(i, ft) { var r = updState.rows[i]; r.features = r.features.filter(function (x) { return x !== ft; }); renderUpd(); }
function updRecalc() {
  var el = document.getElementById('upd-audience'); if (!el) return;
  var ticked = (updState.rows || []).filter(function (r) { return r.include; });
  if (!ticked.length) { el.textContent = 'Tick a change above to see who gets it.'; return; }
  var n;
  if (ticked.some(function (r) { return !r.features || !r.features.length; })) { n = updTotalOrgs(); }
  else { var union = {}; ticked.forEach(function (r) { r.features.forEach(function (ft) { union[ft] = 1; }); }); n = updCountOrgs(Object.keys(union)); }
  el.textContent = '🎯 ' + n + ' org' + (n === 1 ? '' : 's') + ' will get this update.';
}

function renderManual() {
  var orgChecks = updState.orgs.map(function (o) {
    return '<label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;margin:2px 10px 2px 0"><input type="checkbox" class="upd-org" value="' + o.slug + '"> ' + updEsc(o.name) + '</label>';
  }).join('');
  var html = '<label>Message (markdown ok)</label>';
  html += '<textarea id="upd-body" rows="5" placeholder="What’s new…" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:5px;font-family:inherit;font-size:13px"></textarea>';
  html += '<div id="upd-imgs" style="display:none;flex-wrap:wrap;gap:10px;margin-top:8px"></div>';
  html += '<div style="font-size:10.5px;color:#aaa;margin-top:4px">📋 Paste a screenshot (Ctrl/Cmd+V) to attach it — it ships with either publish path</div>';
  html += '<label style="display:inline-flex;align-items:center;gap:6px;margin:10px 0"><input type="checkbox" id="upd-all" onchange="document.getElementById(\'upd-orglist\').style.opacity=this.checked?0.4:1"> All orgs (including future)</label>';
  html += '<div id="upd-orglist" style="max-height:160px;overflow:auto;border:1px solid #eee;border-radius:6px;padding:8px">' + orgChecks + '</div>';
  return html;
}

function renderPublished() {
  var list = updState.published || [];
  if (!list.length) return '<div style="margin-top:18px;font-size:12px;color:#999">No published updates yet.</div>';
  var html = '<div style="margin-top:20px;border-top:1px solid #eee;padding-top:12px"><div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Published updates</div>';
  list.forEach(function (a) {
    var target = a.smart ? ('📰 smart · ' + (a.audience || 0) + ' orgs') : (a.allOrgs ? 'all orgs' : ((a.orgs || []).length + ' orgs'));
    html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f3f3f3">';
    html += '<span style="flex:1;font-size:13px;' + (a.active === false ? 'opacity:.5;text-decoration:line-through' : '') + '">' + updEsc(a.title) + ' <span style="color:#999;font-size:11px">(' + target + ')</span></span>';
    html += '<button onclick="updToggle(\'' + a.id + '\')" style="font-size:11px;padding:3px 8px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer">' + (a.active === false ? 'Resume' : 'Pause') + '</button>';
    html += '<button onclick="updDelete(\'' + a.id + '\')" style="font-size:11px;padding:3px 8px;border:1px solid #fca5a5;color:#dc2626;border-radius:4px;background:#fff;cursor:pointer">Delete</button>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ── Pasted screenshots: Ctrl/Cmd+V in the Updates composer attaches the image ──
var updImages = [];
function renderUpdImgs() {
  var s = document.getElementById('upd-imgs'); if (!s) return;
  s.innerHTML = updImages.map(function (u, i) {
    return '<span style="position:relative;display:inline-block"><img src="' + updEsc(u) + '" style="height:64px;border:1px solid #ddd;border-radius:6px;display:block">'
      + '<span onclick="removeUpdImg(' + i + ')" title="Remove image" style="position:absolute;top:-6px;right:-6px;background:#333;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:16px;text-align:center;cursor:pointer">&times;</span></span>';
  }).join('');
  s.style.display = updImages.length ? 'flex' : 'none';
}
function removeUpdImg(i) { updImages.splice(i, 1); renderUpdImgs(); }
async function uploadUpdImage(file) {
  if (file.size > 6 * 1024 * 1024) { alert('Image too large — crop or downscale the screenshot.'); return; }
  var dataUrl = await new Promise(function (resolve, reject) { var r = new FileReader(); r.onload = function () { resolve(r.result); }; r.onerror = reject; r.readAsDataURL(file); });
  try {
    var resp = await fetch('/admin/api/announcements/image', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dataUrl: dataUrl }) });
    var d = await resp.json();
    if (!resp.ok) throw new Error(d.error || 'Upload failed');
    updImages.push(d.url); renderUpdImgs();
  } catch (e) { alert('Image upload failed: ' + e.message); }
}
document.addEventListener('paste', function (e) {
  var modal = document.getElementById('upd-modal') || document.getElementById('upd-imgs');
  if (!modal || !document.getElementById('upd-imgs')) return; // composer not on screen
  var items = (e.clipboardData && e.clipboardData.items) || [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].type && items[i].type.indexOf('image/') === 0) { e.preventDefault(); uploadUpdImage(items[i].getAsFile()); break; }
  }
});

async function submitSmart() {
  var title = (updState.title || '').trim();
  var items = (updState.rows || []).filter(function (r) { return r.include && r.text.trim(); })
    .map(function (r) { return { text: r.text.trim(), features: r.features || [], date: r.date }; });
  if (!title) { alert('Title is required.'); return; }
  if (!items.length) { alert('Tick at least one change to include.'); return; }
  try {
    var resp = await fetch('/admin/api/announcements/from-updates', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title, items: items, images: updImages }) });
    var d = await resp.json();
    if (!resp.ok) throw new Error(d.error || 'Failed');
    alert('🚀 Published to ' + d.audience + ' org' + (d.audience === 1 ? '' : 's') + '.');
    updImages = []; renderUpdImgs();
    loadUpd();
  } catch (e) { alert(e.message); }
}
async function submitManual() {
  var title = (document.getElementById('upd-title').value || '').trim();
  var body = (document.getElementById('upd-body').value || '').trim();
  var allOrgs = document.getElementById('upd-all').checked;
  var orgs = [].slice.call(document.querySelectorAll('.upd-org:checked')).map(function (c) { return c.value; });
  if (!title) { alert('Title is required.'); return; }
  if (!allOrgs && !orgs.length) { alert('Pick All orgs or at least one org.'); return; }
  try {
    var resp = await fetch('/admin/api/announcements', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: title, body: body, orgs: orgs, allOrgs: allOrgs, images: updImages }) });
    var d = await resp.json();
    if (!resp.ok) throw new Error(d.error || 'Failed');
    alert('🚀 Published.');
    updImages = []; renderUpdImgs();
    loadUpd();
  } catch (e) { alert(e.message); }
}
async function updToggle(id) {
  await fetch('/admin/api/announcements/toggle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id }) });
  loadUpd();
}
async function updDelete(id) {
  if (!confirm('Delete this update?')) return;
  await fetch('/admin/api/announcements/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id }) });
  loadUpd();
}
</script>
