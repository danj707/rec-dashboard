name: CI

# Fast pre-deploy validation. Railway's "Wait for CI" gates production
# deploys on this passing, so a syntax error can't reach prod.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check root JS (node --check)
        run: |
          shopt -s nullglob
          for f in *.js; do echo "→ node --check $f"; node --check "$f"; done

      - name: Install @babel/standalone (for JSX parse check)
        run: npm install --no-save @babel/standalone@7.23.9

      - name: Validate public/*.html JSX blocks
        run: node scripts/ci-check-html.js

      # Pins that report links are built from the identity the reporting project
      # actually serves, not from this dashboard's own copy of the slug/token.
      # Shrewsbury's links 404'd for five weeks because those two diverged.
      - name: Reporting-identity reconciliation
        run: node scripts/reporting-identity.spec.js

      # Was passing locally but never wired in — a spec outside CI is a spec
      # nobody is running. Same class as email-slack-notify.spec.js over in
      # rental-report, which sat dead and out of CI for weeks.
      - name: SWR cache behaviour
        run: node scripts/swr-cache.spec.js

      # The per-section widget entry point: one picker, not two, and an
      # affordance visible at REST rather than on hover.
      - name: Section widget entry point
        run: node scripts/section-widget-entry.spec.js

      # The two Fast Track widgets. Pins that the capacity headline is fed from
      # Over Demand and never from Left on Table — those have opposite fixes,
      # and 100 of Watertown's 138 "money waiting" sections still have seats.
      - name: Fast Track widgets
        run: node scripts/ft-widgets.spec.js

      # The Memberships section's auto-renew widgets. Card 17301 is SHARED with
      # rental-report, so a rule about what a row MEANS has to be the same in
      # both or the dashboard and the report it links to disagree about the same
      # org on the same day. Pins the three that shipped wrong on the report
      # side first: a pass is not a membership, a billing cycle belongs to the
      # plan and not to one row's timestamps, and a feed missing a column must
      # render a dash rather than a confident zero.
      - name: Membership book widgets
        run: node scripts/membership-book.spec.js

      # LIVE WIDGETS are the one section here that ignores the date picker, and
      # every way they can be wrong still renders a plausible tile: a confident
      # "0 signups today" when the feed did not answer, a "right now" served
      # from a 15-minute cache, a day counted off the viewer's clock instead of
      # the org's, or a printed page claiming to be live.
      - name: Live Widgets — the Coffee Counter
        run: node scripts/live-widgets.spec.js

      # THE UPLOAD ROUTE READ CORRECTLY AND WAS UNREACHABLE. A global
      # express.json() on the default 100kb limit sat ~930 lines above a route
      # declaring its own 8mb one, so a pasted screenshot died in the wrong
      # parser and came back as an HTML error page the client could not parse.
      # No source assertion can see that — what was wrong is WHERE a line sits
      # relative to another — so this one BOOTS THE SERVER and posts a real
      # oversized body.
      - name: Project Updates image upload — parser order and JSON errors
        run: node scripts/announce-image-upload.spec.js

      # The CRM & Messaging section. Pins the two figures that are easy to get
      # confidently wrong: the delivery rate is Rec's OWN formula (delivered /
      # sent, matched against the message page this section links to), and it
      # is WITHHELD rather than reported as 0% for a window the provider never
      # reported back on — email delivery webhooks were not wired until
      # 2026-02, so every 2025 send has neither a delivery nor a bounce and a
      # lifetime rate reads 91.6% about the webhook rather than about
      # deliverability.
      - name: CRM & Messaging widgets
        run: node scripts/messaging-widgets.spec.js

      # THE TOOLBAR'S WEATHER CARD. lib/weather.js is a byte-for-byte TWIN of
      # rental-report's, so the sky a code means has to be the same on both or
      # the two surfaces disagree about the same org on the same afternoon.
      # The contrast half is COMPUTED rather than asserted: this card carries
      # its text ON the sky, so the palette is the only place legibility can
      # come from, and a stylesheet reads plausibly whatever hexes it holds.
      - name: Weather card
        run: node scripts/org-weather.spec.js

      # The inbound half of the cross-project org sync, and the credential leak
      # found building it: the mirror of this route on rental-report was handing
      # an org's ACCESS TOKEN to anyone who asked. The live half boots a real
      # server, because a regex over our own patch is not evidence it behaves —
      # and two source assertions were dropped after mutation showed them
      # satisfied by the update branch's identical lines.
      - name: Org sync (no token unauthenticated; no duplicate under another slug)
        run: node scripts/org-sync.spec.js

      # THE PAGE MUST ACTUALLY RENDER. This repo had no render check at all, for
      # a 3,500-line React page compiled by in-browser Babel — and its sibling
      # shipped two blank pages to production before adding one. Every other
      # check here passes on a page that shows the user nothing: node --check
      # reads a different file, the JSX check proves the block PARSES, and no
      # spec mounts a component. Parsing is not running.
      #
      # It earned its keep immediately: the Auto-Renew By Plan table was
      # returning { headers, rows } where TableWidget reads { columns, data },
      # which unmounts the WHOLE dashboard, and all 73 spec assertions passed on
      # that build.
      - name: Ensure a browser for the render check
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$c" ]; then echo "PUPPETEER_EXECUTABLE_PATH=$c" >> $GITHUB_ENV; exit 0; fi
          done
          echo "no system Chrome — installing puppeteer's"
          npm install --no-save puppeteer@22
          npx puppeteer browsers install chrome

      - name: Dashboard render check (real browser; a blank page fails the build)
        run: |
          node -e "require('puppeteer')" 2>/dev/null || npm install --no-save puppeteer@22
          node scripts/ci-check-render.js
